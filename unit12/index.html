<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גופים במרחב — תיבה וקובייה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');
  :root{
    --navy:#1E1B2E; --deep-navy:#0F0D1A; --green:#10B981; --green-dark:#059669;
    --foam:#EAF4F1; --gold:#EFA94A; --coral:#E2604F; --seafoam:#48B08C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Rubik',sans-serif;background:radial-gradient(ellipse at 50% -10%,#0D3D2E 0%,#1E1B2E 50%,#0F0D1A 100%);color:var(--foam);direction:rtl;min-height:100vh;line-height:1.6;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 18px 70px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;max-width:900px;margin:0 auto;}
  .brand{font-size:19px;color:var(--green);}
  .homebtn{background:transparent;border:1.5px solid var(--foam);color:var(--foam);padding:7px 16px;border-radius:20px;font-family:'Rubik',sans-serif;font-size:14px;cursor:pointer;opacity:.85;text-decoration:none;display:inline-block;}
  .homebtn:hover{opacity:1;border-color:var(--green);color:var(--green);}
  .hero{text-align:center;padding:18px 10px 10px;}
  h1.title{font-weight:800;font-size:clamp(26px,5.2vw,42px);margin:6px 0 10px;color:#FFFFFF;letter-spacing:-0.5px;}
  p.subtitle{font-size:17px;opacity:.85;margin:0 0 8px;}
  .cards{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  .sequence-section{margin-bottom:28px;background:rgba(234,244,241,0.04);border-radius:14px;padding:18px 20px;}
  .sequence-title{font-weight:700;font-size:17px;color:var(--foam);text-align:center;margin:0 0 14px;opacity:.9;}
  .flow-arrow{display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(16,185,129,0.5);flex-shrink:0;}
  .card{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:50px;cursor:pointer;font-family:'Rubik',sans-serif;font-weight:600;font-size:15px;transition:transform .15s ease,box-shadow .15s ease;border:none;}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.25);}
  .card h3{font-size:15px;font-weight:600;margin:0;}
  .card.learn{background:rgba(16,185,129,0.18);border:1.5px solid var(--green);color:var(--green);}
  .card.game{background:rgba(239,169,74,0.18);border:1.5px solid var(--gold);color:var(--gold);}
  .card.quiz{background:rgba(226,96,79,0.18);border:1.5px solid var(--coral);color:var(--coral);}
  .panel{background:rgba(234,244,241,0.06);border:1px solid rgba(234,244,241,0.15);border-radius:10px;padding:22px;margin:18px 0;}
  .btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .btn{background:var(--green);color:#0F1E18;border:none;font-weight:700;font-family:'Rubik',sans-serif;font-size:15px;padding:11px 26px;border-radius:24px;cursor:pointer;transition:transform .12s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn.secondary{background:transparent;border:1.5px solid var(--foam);color:var(--foam);}
  .btn.secondary:hover{border-color:var(--green);color:var(--green);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .feedback{text-align:center;font-size:16px;font-weight:700;margin:14px 0;min-height:24px;}
  .feedback.ok{color:var(--seafoam);}
  .feedback.bad{color:var(--coral);}
  .progressdots{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
  .dot{width:11px;height:11px;border-radius:50%;background:rgba(234,244,241,0.25);border:none;padding:0;}
  .dot.done{background:var(--seafoam);}
  .dot.active{background:var(--gold);}
  .mc-options{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:16px auto 0;}
  .mc-btn{background:rgba(234,244,241,0.08);border:1.5px solid rgba(234,244,241,0.3);color:var(--foam);padding:12px 16px;border-radius:8px;font-size:16px;cursor:pointer;font-family:'Rubik',sans-serif;text-align:right;}
  .mc-btn:hover{border-color:var(--green);}
  .mc-btn.correct{background:rgba(72,176,140,0.3);border-color:var(--seafoam);}
  .mc-btn.wrong{background:rgba(226,96,79,0.3);border-color:var(--coral);}
  .mc-btn:disabled{cursor:default;}
  .explain-box{background:rgba(72,176,140,0.1);border-right:4px solid var(--seafoam);border-radius:6px;padding:12px 16px;margin-top:14px;font-size:15px;}
  .qmeta{text-align:center;font-size:14px;opacity:.75;margin-bottom:6px;}
  .qtitle{font-size:18px;font-weight:700;text-align:center;margin:6px 0 4px;}
  .qtext{font-size:16px;text-align:center;margin:0 0 6px;max-width:560px;margin-left:auto;margin-right:auto;}
  .scorebig{font-size:52px;color:var(--gold);text-align:center;margin:10px 0;}
  ul.bullets{list-style:none;margin:18px 0 6px;padding:0;text-align:right;}
  ul.bullets li{position:relative;padding-right:22px;margin-bottom:10px;font-size:16px;line-height:1.55;}
  ul.bullets li::before{content:"•";color:var(--green);position:absolute;right:0;top:0;font-size:18px;}
  .learn-note{background:rgba(16,185,129,0.1);border-right:4px solid var(--green);border-radius:6px;padding:12px 16px;margin-top:16px;font-size:15px;text-align:right;}
  .gold-box{background:rgba(239,169,74,0.12);border-right:4px solid var(--gold);border-radius:6px;padding:14px 18px;margin:14px 0;font-size:17px;font-weight:700;color:var(--gold);text-align:right;}
  .formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
  .formula-card{background:rgba(234,244,241,0.07);border:1.5px solid rgba(234,244,241,0.15);border-radius:10px;padding:14px;text-align:center;}
  .formula-card .fname{font-size:13px;opacity:.7;margin-bottom:4px;}
  .formula-card .fval{font-size:18px;font-weight:700;color:var(--gold);}
  .def-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px;}
  .def-table td{padding:8px 12px;border-bottom:1px solid rgba(234,244,241,0.1);}
  .def-table td:first-child{font-weight:700;color:var(--gold);width:120px;}
  .m{direction:ltr;unicode-bidi:isolate;}
  /* worksheet overlay */
  .ws-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:flex-start;padding-top:30px;}
  .ws-overlay.open{display:flex;}
  .ws-frame{width:min(780px,96vw);height:88vh;border-radius:12px;overflow:hidden;border:none;background:#fff;}
  .ws-close{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;border:none;padding:8px 24px;border-radius:20px;font-family:'Rubik',sans-serif;font-size:15px;font-weight:700;cursor:pointer;z-index:1001;}
</style>
</head>
<body>
<div id="app"></div>
<div class="ws-overlay" id="wsOverlay">
  <button class="ws-close" onclick="hideWorksheet()">✕ סגור</button>
  <iframe class="ws-frame" id="wsFrame" src=""></iframe>
</div>
<script>
const state = { screen:'home', sequence:1, qi:0, score:0, answered:false };
const openSections = new Set();

function goTo(s){ state.screen=s; render(); window.scrollTo(0,0); }
function goHome(){ state.screen='home'; render(); window.scrollTo(0,0); }
function toggleSection(n){ openSections.has(n)?openSections.delete(n):openSections.add(n); render(); }
function startGame(){ state.qi=0; state.score=0; state.answered=false; goTo('game'); }
function showWorksheet(url){ document.getElementById('wsFrame').src=url; document.getElementById('wsOverlay').classList.add('open'); }
function hideWorksheet(){ document.getElementById('wsOverlay').classList.remove('open'); document.getElementById('wsFrame').src=''; }

/* ========== GAME LEVELS ========== */

const gameLevels1 = [
  { q:'כמה פאות (faces) יש לתיבה?', opts:['4','6','8','12'], ans:1, exp:'לתיבה 6 פאות: עליונה, תחתונה, קדמית, אחורית, שמאלית, ימנית.' },
  { q:'כמה מקצועות (edges) יש לתיבה?', opts:['6','8','10','12'], ans:3, exp:'לתיבה 12 מקצועות: 4 עליונים, 4 תחתונים, 4 אנכיים.' },
  { q:'כמה קודקודים (vertices) יש לתיבה?', opts:['6','8','10','12'], ans:1, exp:'לתיבה 8 קודקודים — פינות.' },
  { q:'פאה של תיבה היא...', opts:['קו ישר','נקודת חיבור','פוליגון (ריבוע או מלבן)','גוף תלת-ממדי'], ans:2, exp:'כל פאה של תיבה היא מלבן (ובקובייה — ריבוע). לתיבה 3 זוגות של פאות מנוגדות שוות.' },
  { q:'בתיבה עם מידות 5×3×2, כמה זוגות של פאות מנוגדות יש?', opts:['1','2','3','6'], ans:2, exp:'3 זוגות: 2 פאות של 5×3, 2 פאות של 5×2, 2 פאות של 3×2.' },
];

const gameLevels2 = [
  { q:'תיבה 4×3×5. מה נפחה?', opts:['12 סמ"ק','60 סמ"ק','24 סמ"ק','47 סמ"ק'], ans:1, exp:'4×3×5 = 60 סמ"ק.' },
  { q:'תיבה נפח 200 סמ"ק. שני ממדים: 5 ו-8 ס"מ. מה הממד השלישי?', opts:['5 ס"מ','4 ס"מ','160 ס"מ','8 ס"מ'], ans:0, exp:'200 = 5×8×x → 200 = 40x → x = 5 ס"מ.' },
  { q:'אדנית: אורך 30, רוחב 20, גובה 15 ס"מ. מה נפחה בליטרים? (1 ל׳ = 1000 סמ"ק)', opts:['9 ל׳','90 ל׳','0.9 ל׳','9000 ל׳'], ans:0, exp:'30×20×15=9000 סמ"ק = 9 ל׳.' },
  { q:'אדנית ראשונה: 30×20×15. אדנית שנייה: אורך 20, שאר זהה. כמה קטן הנפח?', opts:['3000 סמ"ק','6000 סמ"ק','1500 סמ"ק','9000 סמ"ק'], ans:0, exp:'ראשונה: 9000. שנייה: 20×20×15=6000. הפרש: 3000 סמ"ק.' },
  { q:'אקווריום 50×30×40 ס"מ מלא עד ¾. כמה ליטרים מים?', opts:['60 ל׳','45 ל׳','80 ל׳','30 ל׳'], ans:1, exp:'נפח מלא: 50×30×40=60000 סמ"ק = 60 ל׳. ¾ ממנו: 45 ל׳.' },
  { q:'מקבץ של קוביות 1×1×1 ממלא תיבה 3×4×2. כמה קוביות?', opts:['9','14','24','36'], ans:2, exp:'נפח = 3×4×2 = 24 קוביות יחידה. כל קובייה = 1 סמ"ק.' },
  { q:'קרטון חלב (1 ל׳) הוא תיבה. בסיס 7×7 ס"מ. מה גובהו? (1 ל׳ = 1000 סמ"ק)', opts:['10 ס"מ','14 ס"מ','20 ס"מ','49 ס"מ'], ans:2, exp:'1000 = 7×7×h = 49h → h ≈ 20.4 ס"מ ≈ 20.' },
];

const gameLevels3 = [
  { q:'שטח פנים של תיבה 5×4×3:', opts:['60 סמ"ר','94 סמ"ר','47 סמ"ר','120 סמ"ר'], ans:1, exp:'2×(5×4 + 4×3 + 5×3) = 2×(20+12+15) = 94 סמ"ר.' },
  { q:'קופסת עבודה: 6×4×2 ס"מ. רוצים לצפות אותה בניר. כמה סמ"ר ניר?', opts:['48 סמ"ר','88 סמ"ר','44 סמ"ר','24 סמ"ר'], ans:1, exp:'שטח פנים = 2×(24+8+12)=88 סמ"ר. זה כמה ניר צריך לעטוף.' },
  { q:'תיבה 5×4×3. הוגדל הגובה ל-6. מה שטח פנים עכשיו?', opts:['94 סמ"ר','112 סמ"ר','148 סמ"ר','130 סמ"ר'], ans:2, exp:'2×(5×4 + 4×6 + 5×6) = 2×(20+24+30) = 2×74 = 148 סמ"ר. לעומת 94 במקור — הגובה הכפול הוסיף שטח.' },
  { q:'אקווריום: 60×30×40 ס"מ. צובעים 5 פנים פנימיות (בלי המכסה). כמה סמ"ר?', opts:['5400 סמ"ר','9000 סמ"ר','10800 סמ"ר','7200 סמ"ר'], ans:1, exp:'קרקע: 60×30=1800. קדמי+אחורי: 2×(60×40)=4800. ימין+שמאל: 2×(30×40)=2400. סה"כ: 1800+4800+2400=9000 סמ"ר.' },
  { q:'תיבה A: 4×4×4. תיבה B: 8×4×2. איזה שטח פנים גדול יותר?', opts:['A','B','שווים','תלוי'], ans:1, exp:'A: 6×16=96. B: 2×(32+8+16)=2×56=112. לB שטח פנים גדול יותר!' },
  { q:'גוף מורכב: תיבה תחתונה 6×6×10 + תיבה עליונה 2×2×10 (מרכזה). מה הנפח הכולל?', opts:['360+40=400 סמ"ק','360 סמ"ק','40 סמ"ק','720 סמ"ק'], ans:0, exp:'תחתונה: 6×6×10=360. עליונה: 2×2×10=40. סה"כ: 400 סמ"ק.' },
];

const gameLevels4 = [
  { q:'נפח קובייה הוא 64 סמ"ק. מה מקצועה?', opts:['8 ס"מ','16 ס"מ','4 ס"מ','32 ס"מ'], ans:2, exp:'a³=64 → a=³√64=4 ס"מ.' },
  { q:'2 קוביות עם מקצוע 3 ס"מ מונחות זו על זו. מה הנפח הכולל?', opts:['27 סמ"ק','54 סמ"ק','18 סמ"ק','6 סמ"ק'], ans:1, exp:'27+27=54 סמ"ק.' },
  { q:'אותן 2 קוביות (מקצוע 3). מה שטח פנים הגוף שנוצר? (שתי פאות מכוסות!)', opts:['108 סמ"ר','90 סמ"ר','54 סמ"ר','162 סמ"ר'], ans:1, exp:'שטח קובייה אחת: 6×9=54. שתיים: 108. אבל 2 פאות מכוסות בחיבור: 108−2×9=90 סמ"ר.' },
  { q:'קובייה גדולה (מקצוע 4) ביחס לקובייה קטנה (מקצוע 2). הנפח גדול פי...', opts:['2','4','6','8'], ans:3, exp:'64÷8=8. כשמקצוע מוכפל ב-2, נפח גדל פי 2³=8!' },
  { q:'קובייה מחולקת ל-8 קוביות שוות. מה מקצוע כל קובייה קטנה, אם מקצוע המקורית 4?', opts:['1 ס"מ','2 ס"מ','3 ס"מ','0.5 ס"מ'], ans:1, exp:'8 קוביות = 2³. חילוק ב-2 בכל ממד → מקצוע = 4÷2 = 2 ס"מ.' },
  { q:'קובייה עם מקצוע 1 ס"מ. כמה כאלה דרושות למלא קובייה עם מקצוע 3 ס"מ?', opts:['3','9','27','81'], ans:2, exp:'נפח 3³=27. כל קובייה קטנה = 1. צריך 27.' },
  { q:'נוסחת שטח פנים של קובייה?', opts:['a³','6a²','4a²','12a'], ans:1, exp:'6 פאות ריבועיות, כל אחת a². סה"כ 6a².' },
];

const gameLevels5 = [
  { q:'פריסת תיבה עם מידות 2×3×5. מה שטח הפריסה?', opts:['30 סמ"ר','62 סמ"ר','31 סמ"ר','15 סמ"ר'], ans:1, exp:'שטח פנים = 2×(2×3+3×5+2×5)=2×(6+15+10)=2×31=62 סמ"ר.' },
  { q:'כמה פריסות שונות יש לקובייה?', opts:['1','6','11','24'], ans:2, exp:'יש בדיוק 11 פריסות שונות לקובייה — כולן תקינות!' },
  { q:'האם 6 ריבועים בשורה ישרה מהווים פריסת קובייה?', opts:['כן','לא — אי אפשר לקפל','רק אם הריבועים גדולים','תלוי בגודל'], ans:1, exp:'6 ריבועים בשורה: כשמנסים לקפל, פאות נגדיות לא מתחברות נכון. לא פריסה תקינה.' },
  { q:'נתונה פריסה של תיבה. מה ניתן לחשב מהפריסה?', opts:['נפח בלבד','שטח פנים בלבד','גם נפח וגם שטח פנים','לא ניתן לחשב כלום'], ans:2, exp:'מהפריסה רואים את מידות הצלעות — מחשבים שטח פנים ישירות, ונפח ממידות התיבה.' },
  { q:'שטח פריסת קובייה עם מקצוע 5:', opts:['25 סמ"ר','125 סמ"ר','150 סמ"ר','30 סמ"ר'], ans:2, exp:'6×5²=6×25=150 סמ"ר.' },
  { q:'חברה מייצרת קופסאות מקרטון (תיבה 10×6×4). כמה קרטון לכל קופסה?', opts:['240 סמ"ר','248 סמ"ר','208 סמ"ר','120 סמ"ר'], ans:1, exp:'2×(10×6+6×4+10×4)=2×(60+24+40)=2×124=248 סמ"ר.' },
  { q:'נפח תיבה=120, שטח פנים=148. הגדלנו את כל הממדים פי 2. מה הנפח החדש?', opts:['240 סמ"ק','480 סמ"ק','960 סמ"ק','360 סמ"ק'], ans:2, exp:'כשמכפילים כל ממד ב-2, הנפח גדל פי 2³=8. 120×8=960 סמ"ק.' },
];

function currentLevels(){
  if(state.sequence===1) return gameLevels1;
  if(state.sequence===2) return gameLevels2;
  if(state.sequence===3) return gameLevels3;
  if(state.sequence===4) return gameLevels4;
  if(state.sequence===5) return gameLevels5;
  return gameLevels1;
}

/* ========== RENDER ========== */

function render(){
  const app = document.getElementById('app');
  if(state.screen==='home')       app.innerHTML = renderTopbar()+'<div class="wrap">'+renderHome()+'</div>';
  else if(state.screen==='learn') app.innerHTML = renderTopbar()+'<div class="wrap">'+renderLearn()+'</div>';
  else if(state.screen==='game')  app.innerHTML = renderTopbar()+'<div class="wrap">'+renderGame()+'</div>';
  else if(state.screen==='gameResults') app.innerHTML = renderTopbar()+'<div class="wrap">'+renderGameResults()+'</div>';
}

function renderTopbar(){
  return `<div class="topbar"><div class="brand">חן מרגלית למידה אקטיבית</div><a class="homebtn" href="../index.html">תפריט ראשי</a></div>`;
}

function seqRow(seqNum, label, opts={}){
  const isOpen = openSections.has(seqNum);
  const chevron = isOpen ? '▾' : '◂';
  let cards = '';
  if(isOpen){
    cards = `<div class="cards" style="margin-bottom:6px;">
      <div class="card learn" onclick="state.sequence=${seqNum};goTo('learn')"><h3>הקנייה</h3></div>
      <div class="flow-arrow">←</div>
      <div class="card game" onclick="state.sequence=${seqNum};startGame()"><h3>תרגול</h3></div>
    </div>`;
  }
  return `<div onclick="toggleSection(${seqNum})" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid rgba(234,244,241,0.08);user-select:none;">
    <span class="sequence-title" style="margin:0;">${label}</span>
    <span style="font-size:20px;color:rgba(234,244,241,0.4);">${chevron}</span>
  </div>${cards}`;
}

function renderHome(){
  return `<div class="hero">
    <h1 class="title">גופים במרחב</h1>
    <p class="subtitle">יחידה 5 — תחום גיאומטרי</p>
  </div>
  <div class="sequence-section">
    <div class="sequence-title" style="font-size:19px;color:var(--gold);margin-bottom:8px;">תיבה וקובייה</div>
    ${seqRow(1,'1. מושגים — פאה, מקצוע, קודקוד',{})}
    ${seqRow(2,'2. נפח תיבה',{})}
    ${seqRow(3,'3. שטח פנים של תיבה',{})}
    ${seqRow(4,'4. קובייה — מקרה מיוחד',{})}
    ${seqRow(5,'5. פריסות',{worksheetUrl:'../worksheets/geometry_solids_exam.html'})}
  </div>

/* ========== GAME ========== */

function renderGame(){
  const levels = currentLevels();
  if(state.qi >= levels.length){ state.screen='gameResults'; return renderGameResults(); }
  const lv = levels[state.qi];
  const dots = levels.map((_,i)=>`<div class="dot${i<state.qi?' done':i===state.qi?' active':''}"></div>`).join('');
  let optsHtml = lv.opts.map((o,i)=>`<button class="mc-btn" id="opt${i}" onclick="answerMC(${i})">${o}</button>`).join('');
  return `<div class="panel">
    <div class="progressdots">${dots}</div>
    <p class="qmeta">שאלה ${state.qi+1} מתוך ${levels.length}</p>
    <h2 class="qtitle">${lv.q}</h2>
    <div class="mc-options">${optsHtml}</div>
    <div class="feedback" id="fb"></div>
    <div id="expbox"></div>
    <div class="btnrow" id="nextrow" style="display:none">
      <button class="btn" onclick="nextQ()">הבא ←</button>
    </div>
  </div>`;
}

function answerMC(i){
  if(state.answered) return;
  state.answered = true;
  const lv = currentLevels()[state.qi];
  const fb = document.getElementById('fb');
  document.querySelectorAll('.mc-btn').forEach((b,idx)=>{
    b.disabled = true;
    if(idx===lv.ans) b.classList.add('correct');
    else if(idx===i) b.classList.add('wrong');
  });
  if(i===lv.ans){ fb.className='feedback ok'; fb.textContent='נכון! ✓'; state.score++; }
  else { fb.className='feedback bad'; fb.textContent='לא נכון ✗'; }
  if(lv.exp){ document.getElementById('expbox').innerHTML=`<div class="explain-box">${lv.exp}</div>`; }
  document.getElementById('nextrow').style.display='flex';
}

function nextQ(){ state.qi++; state.answered=false; render(); }

function renderGameResults(){
  const levels = currentLevels();
  const pct = Math.round(state.score/levels.length*100);
  const msg = pct>=80?'מצוין! 🎉':pct>=60?'כמעט!':'נסה שוב';
  return `<div class="panel" style="text-align:center">
    <h2 class="qtitle">סיימת!</h2>
    <div class="scorebig">${state.score}/${levels.length}</div>
    <p style="font-size:18px;opacity:.85;">${pct}% — ${msg}</p>
    <div class="btnrow">
      <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
      <button class="btn" onclick="state.sequence=${state.sequence};startGame()">שוב ←</button>
    </div>
  </div>`;
}

render();
</script>
