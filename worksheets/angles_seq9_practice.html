<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תרגול — סכום זוויות במשולש</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Rubik',sans-serif;background:#fff;color:#1a1a2e;direction:rtl;line-height:1.7;}
  .page{max-width:720px;margin:0 auto;padding:32px 24px 60px;}
  .header{border-bottom:3px solid #10B981;padding-bottom:16px;margin-bottom:28px;}
  .header h1{font-size:22px;font-weight:800;margin:0 0 4px;color:#10B981;}
  .header p{font-size:13px;color:#6b7280;margin:0;}
  .q-block{margin-bottom:32px;padding:20px 22px;border:1.5px solid #e5e7eb;border-radius:12px;}
  .q-num{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#10B981;margin-bottom:6px;}
  .q-text{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.7;}
  .diagram{width:100%;max-width:620px;display:block;margin:0 auto 16px;border-radius:6px;border:1px solid #e5e7eb;}
  .sub-label{font-size:13px;font-weight:700;color:#374151;margin:14px 0 4px;}
  .explain-box{border:1.5px solid #d1d5db;border-radius:6px;width:100%;min-height:48px;display:block;background:transparent;padding:6px 10px;font-family:'Rubik',sans-serif;font-size:14px;resize:none;}
  .ltr{direction:ltr;unicode-bidi:isolate;display:inline;}
  footer{text-align:center;font-size:11px;color:#9ca3af;padding:20px 0;border-top:1px solid #f3f4f6;margin-top:20px;}
  @media print{.q-block{break-inside:avoid;}body{background:#fff;}.no-print{display:none;}}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>תרגול — סכום זוויות במשולש</h1>
    <p>שם: _________________________ &nbsp;&nbsp; תאריך: _____________</p>
  </div>

  <div class="q-block">
    <div class="q-num">שאלה 1</div>
    <div class="q-text">בכל אחד מהסעיפים הבאים חשבו את <span class="ltr">α</span>.</div>
    <img src="seq9_practice_q.png" class="diagram" alt="סרטוטים לחישוב α" />
    <div class="sub-label">(א) <span class="ltr">α</span> = <span style="border-bottom:1.5px solid #555;display:inline-block;min-width:60px;">&nbsp;</span></div>
    <textarea class="explain-box" rows="2" placeholder="כי..."></textarea>
    <div class="sub-label">(ב) <span class="ltr">α</span> = <span style="border-bottom:1.5px solid #555;display:inline-block;min-width:60px;">&nbsp;</span></div>
    <textarea class="explain-box" rows="2" placeholder="כי..."></textarea>
    <div class="sub-label">(ג) <span class="ltr">α</span> = <span style="border-bottom:1.5px solid #555;display:inline-block;min-width:60px;">&nbsp;</span></div>
    <textarea class="explain-box" rows="2" placeholder="כי..."></textarea>
  </div>

</div>

<button class="no-print" onclick="window.print()" style="position:fixed;bottom:18px;left:18px;background:#1a1a2e;color:#fff;border:none;padding:9px 20px;border-radius:20px;font-family:'Rubik',sans-serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.2);">🖨️ הדפסה</button>
<button class="no-print" onclick="if(window.parent!==window){window.parent.hideWorksheet();}else if(window.opener){window.close();}else{history.back();}" style="position:fixed;bottom:62px;right:18px;background:#374151;color:#fff;border:none;padding:9px 20px;border-radius:20px;font-family:'Rubik',sans-serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.2);">← חזרה</button>
<button class="no-print" onclick="if(window.parent!==window){window.parent.hideWorksheet();}else if(window.opener){window.close();}else{history.back();}" style="position:fixed;bottom:18px;right:18px;background:#10B981;color:#fff;border:none;padding:9px 20px;border-radius:20px;font-family:'Rubik',sans-serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.2);">סיימתי ✓</button>
<footer>© כל הזכויות שמורות לחן מרגלית &nbsp;|&nbsp; תרגול — סכום זוויות במשולש</footer>
</body>
</html>
