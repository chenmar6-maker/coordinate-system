<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משוואות ונקודות על גרף</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');

  :root{
    --navy:#1E1B2E;
    --deep-navy:#0F0D1A;
    --teal:#4A4080;
    --light-teal:#3AA0C4;
    --foam:#EAF4F1;
    --gold:#EFA94A;
    --coral:#E2604F;
    --seafoam:#48B08C;
    --ink:#0A2A43;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Rubik',sans-serif;
    background:radial-gradient(ellipse at 50% -10%,#3D3568 0%,#1E1B2E 50%,#0F0D1A 100%);
    color:var(--foam);
    direction:rtl;
    min-height:100vh;
    line-height:1.6;
  }

  .wrap{max-width:900px;margin:0 auto;padding:20px 18px 70px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;max-width:900px;margin:0 auto;}
  .brand{font-family:'Rubik',sans-serif;font-size:19px;color:var(--gold);}
  .homebtn{background:transparent;border:1.5px solid var(--foam);color:var(--foam);padding:7px 16px;border-radius:20px;font-family:'Rubik',sans-serif;font-size:14px;cursor:pointer;opacity:.85;text-decoration:none;display:inline-block;}
  .homebtn:hover{opacity:1;border-color:var(--gold);color:var(--gold);}

  .hero{text-align:center;padding:18px 10px 10px;}
  h1.title{font-family:'Rubik',sans-serif;font-weight:800;font-size:clamp(26px,5.2vw,42px);margin:6px 0 10px;color:#FFFFFF;text-align:center;letter-spacing:-0.5px;}

  .cards{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  .sequence-section{margin-bottom:28px;background:rgba(234,244,241,0.04);border-radius:14px;padding:18px 20px;}
  .sequence-title{font-family:'Rubik',sans-serif;font-weight:700;font-size:17px;color:var(--foam);text-align:center;margin:0 0 14px;opacity:.9;}

  .flow-arrow{display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(239,169,74,0.5);flex-shrink:0;}

  .card{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:50px;cursor:pointer;font-family:'Rubik',sans-serif;font-weight:600;font-size:15px;transition:transform .15s ease,box-shadow .15s ease;border:none;}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.25);}
  .card h3{font-family:'Rubik',sans-serif;font-size:15px;font-weight:600;margin:0;}
  .card p{display:none;}
  .card.learn{background:rgba(28,110,140,0.25);border:1.5px solid var(--teal);color:var(--foam);}
  .card.game{background:rgba(239,169,74,0.18);border:1.5px solid var(--gold);color:var(--gold);}
  .card.quiz{background:rgba(226,96,79,0.18);border:1.5px solid var(--coral);color:var(--coral);}

  .panel{background:rgba(234,244,241,0.06);border:1px solid rgba(234,244,241,0.15);border-radius:10px;padding:22px;margin:18px 0;}

  .btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .btn{background:var(--gold);color:var(--deep-navy);border:none;font-weight:700;font-family:'Rubik',sans-serif;font-size:15px;padding:11px 26px;border-radius:24px;cursor:pointer;transition:transform .12s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn.secondary{background:transparent;border:1.5px solid var(--foam);color:var(--foam);}
  .btn.secondary:hover{border-color:var(--gold);color:var(--gold);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  .feedback{text-align:center;font-size:16px;font-weight:700;margin:14px 0;min-height:24px;}
  .feedback.ok{color:var(--seafoam);}
  .feedback.bad{color:var(--coral);}

  .progressdots{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
  .dot{width:11px;height:11px;border-radius:50%;background:rgba(234,244,241,0.25);border:none;padding:0;}
  .dot.done{background:var(--seafoam);}
  .dot.active{background:var(--gold);}
  .dot:hover{opacity:.75;}

  .mc-options{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:16px auto 0;}
  .mc-btn{background:rgba(234,244,241,0.08);border:1.5px solid rgba(234,244,241,0.3);color:var(--foam);padding:12px 16px;border-radius:8px;font-size:16px;cursor:pointer;font-family:'Rubik',sans-serif;text-align:center;direction:ltr;unicode-bidi:isolate;}
  .mc-btn:hover{border-color:var(--gold);}
  .mc-btn.correct{background:rgba(72,176,140,0.3);border-color:var(--seafoam);}
  .mc-btn.wrong{background:rgba(226,96,79,0.3);border-color:var(--coral);}
  .mc-btn:disabled{cursor:default;}

  .explain-box{background:rgba(72,176,140,0.1);border-right:4px solid var(--seafoam);border-radius:6px;padding:12px 16px;margin-top:14px;text-align:right;font-size:15px;}

  .qmeta{text-align:center;font-size:14px;opacity:.75;margin-bottom:6px;}
  .qtitle{font-size:18px;font-weight:700;text-align:center;margin:6px 0 4px;}
  .qtext{font-size:16px;text-align:center;margin:0 0 6px;max-width:560px;margin-left:auto;margin-right:auto;}

  .scorebig{font-family:'Rubik',sans-serif;font-size:52px;color:var(--gold);text-align:center;margin:10px 0;}

  .abs-input-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0;direction:rtl;}
  .abs-input-row input{width:80px;padding:8px 10px;font-size:18px;border-radius:6px;border:1.5px solid var(--teal);text-align:center;font-family:'Rubik',sans-serif;background:var(--foam);color:var(--ink);}
  .abs-input-row input:focus{outline:2px solid var(--gold);}

  .instr{text-align:center;font-size:15px;color:var(--foam);opacity:.85;margin:8px 0 4px;}

  ul.bullets{list-style:none;margin:18px 0 6px;padding:0;text-align:right;}
  ul.bullets li{position:relative;padding-right:22px;margin-bottom:10px;font-size:16px;line-height:1.55;}
  ul.bullets li::before{content:"•";color:var(--gold);position:absolute;right:0;top:0;font-size:18px;}

  .learn-note{background:rgba(239,169,74,0.1);border-right:4px solid var(--gold);border-radius:6px;padding:12px 16px;margin-top:16px;font-size:15px;text-align:right;}

  .example-box{background:rgba(239,169,74,0.08);border:1.5px solid rgba(239,169,74,0.35);border-radius:8px;padding:14px 18px;margin:10px 0;text-align:center;font-size:17px;font-weight:700;color:var(--foam);}
  .gold-box{background:rgba(239,169,74,0.12);border-right:4px solid var(--gold);border-radius:6px;padding:14px 18px;margin:14px 0;text-align:center;font-size:18px;font-weight:700;color:var(--gold);}
  .examples-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .examples-row .example-box{flex:1;min-width:160px;max-width:260px;}

  .m{direction:ltr;unicode-bidi:isolate;}

  .def-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px;}
  .def-table td,.def-table th{padding:9px 14px;border:1px solid rgba(234,244,241,0.15);text-align:right;}
  .def-table th{background:rgba(239,169,74,0.12);color:var(--gold);font-weight:700;}
  .def-table td:last-child{direction:ltr;unicode-bidi:isolate;text-align:center;}

  .seq-row{display:flex;align-items:center;gap:10px;justify-content:center;font-size:18px;font-weight:700;margin:10px 0;direction:ltr;unicode-bidi:isolate;}
  .seq-chip{background:rgba(239,169,74,0.15);border:1.5px solid rgba(239,169,74,0.4);border-radius:8px;padding:6px 14px;color:var(--foam);}

  sup{font-size:0.68em;font-weight:700;vertical-align:super;line-height:1;}

  @keyframes popIn{0%{transform:scale(.55);opacity:0;}65%{transform:scale(1.18);opacity:1;}100%{transform:scale(1);}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ STATE ============ */
const state = {
  screen:'home',
  sequence:1,
  levelIndex:0,
  gameScore:0,
  gameTotal:0,
  levelSub:{},
  shuffledOptions:[]
};

/* ============ GAME LEVELS ============ */

const gameLevels2 = [
  { id:'typedSum', title:'פתרון משוואות', expr:'x + 7 = 12',
    correct:5, explain:'מחסירים 7 משני האגפים: x = 12 − 7 = 5' },
  { id:'typedSum', title:'פתרון משוואות', expr:'3x = 18',
    correct:6, explain:'מחלקים שני האגפים ב-3: x = 18 ÷ 3 = 6' },
  { id:'typedSum', title:'משוואה דו-שלבית', expr:'2x + 3 = 11',
    correct:4, explain:'מחסירים 3: 2x = 8. מחלקים ב-2: x = 4' },
  { id:'typedSum', title:'משוואה דו-שלבית', expr:'5x − 2 = 13',
    correct:3, explain:'מוסיפים 2: 5x = 15. מחלקים ב-5: x = 3' },
  { id:'mc', title:'צעד ראשון נכון',
    question:'מהו הצעד הראשון הנכון לפתרון המשוואה <span class="m">4x + 6 = 18</span>?',
    options:['4x = 18 + 6','4x = 18 − 6','x = (18 + 6) ÷ 4','מחלקים ב-4 את שני האגפים'],
    correct:'4x = 18 − 6',
    explain:'מחסירים 6 משני האגפים: 4x = 12. ואז מחלקים ב-4: x = 3.' },
  { id:'typedSum', title:'נעלם משני האגפים', expr:'3x + 2 = x + 10',
    correct:4, explain:'מחסירים x: 2x + 2 = 10. מחסירים 2: 2x = 8. x = 4' },
  { id:'typedSum', title:'עם סוגריים', expr:'2(x + 3) = 14',
    correct:4, explain:'פותחים סוגריים: 2x + 6 = 14. 2x = 8. x = 4' },
  { id:'mc', title:'עם סוגריים — ארבעה שלבים',
    question:'פתרון המשוואה <span class="m">4(x − 1) = 2x + 6</span> הוא:',
    options:['x = 2','x = 3','x = 4','x = 5'],
    correct:'x = 5',
    explain:'פותחים: 4x − 4 = 2x + 6. מעבירים: 2x = 10. x = 5' },
  { id:'mc', title:'כמה פתרונות?',
    question:'למשוואה <span class="m">2x + 5 = 2x + 8</span> יש:',
    options:['פתרון אחד: x = 3','פתרון אחד: x = 0','אינסוף פתרונות','אין פתרון כלל'],
    correct:'אין פתרון כלל',
    explain:'מחסירים 2x משני האגפים: 5 = 8 — זה שקר תמיד. אין שום ערך של x שיעבוד.' },
  { id:'mc', title:'כמה פתרונות?',
    question:'למשוואה <span class="m">3(x + 2) = 3x + 6</span> יש:',
    options:['פתרון אחד: x = 0','פתרון אחד: x = 2','אינסוף פתרונות','אין פתרון כלל'],
    correct:'אינסוף פתרונות',
    explain:'פותחים: 3x + 6 = 3x + 6. אחרי ביטול 3x: 6 = 6 — זה נכון לכל x. אינסוף פתרונות.' },
];


/* ============ NAVIGATION ============ */

let openSections = new Set();

function toggleSection(key){
  if(openSections.has(key)) openSections.delete(key);
  else openSections.add(key);
  render();
}

function goHome(){ state.screen='home'; openSections=new Set(); render(); }
function goTo(s){ state.screen=s; render(); }

function startGame(){
  state.screen='game'; state.levelIndex=0; state.gameScore=0; state.gameTotal=0;
  state.levelSub=freshLevelSub(0);
  const first=currentGameLevels()[0];
  if(first&&first.id==='mc') state.shuffledOptions=shuffleArr(first.options.slice());
  render();
}

function freshLevelSub(){ return {answered:false,correct:false}; }

function nextLevel(){
  state.levelIndex++;
  if(state.levelIndex>=currentGameLevels().length){ finishGame(); return; }
  state.levelSub=freshLevelSub();
  const next=currentGameLevels()[state.levelIndex];
  if(next&&next.id==='mc') state.shuffledOptions=shuffleArr(next.options.slice());
  render();
}

function finishGame(){ state.screen='gameResults'; render(); }

function jumpToLevel(i){
  state.levelIndex=i; state.levelSub=freshLevelSub();
  const lvl=currentGameLevels()[i];
  if(lvl&&lvl.id==='mc') state.shuffledOptions=shuffleArr(lvl.options.slice());
  render();
}

function skipLevel(){
  const levels=currentGameLevels();
  if(state.levelIndex>=levels.length-1) return;
  state.levelIndex++; state.levelSub=freshLevelSub();
  const next=levels[state.levelIndex];
  if(next&&next.options) state.shuffledOptions=shuffleArr(next.options.slice());
  render();
}

function currentGameLevels(){
  if(state.sequence===2) return gameLevels2;
  return [];
}

/* ============ HELPERS ============ */

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function escOpt(s){ return s.replace(/'/g,"\\'"); }
function wrapOpt(s){ return s; }
function wrapMath(s){ return s; }

/* ============ RENDER ============ */

function render(){
  const app=document.getElementById('app');
  if(state.screen==='home') app.innerHTML=renderTopbar()+'<div class="wrap">'+renderHome()+'</div>';
  else if(state.screen==='learn') app.innerHTML=renderTopbar()+'<div class="wrap">'+renderLearn()+'</div>';
  else if(state.screen==='game') app.innerHTML=renderTopbar()+'<div class="wrap">'+renderGame()+'</div>';
  else if(state.screen==='gameResults') app.innerHTML=renderTopbar()+'<div class="wrap">'+renderGameResults()+'</div>';
}

function renderTopbar(){
  return `<div class="topbar">
    <div class="brand">חן מרגלית למידה אקטיבית</div>
    <button class="homebtn" onclick="window.location.href='../index.html'">תפריט ראשי</button>
  </div>`;
}

/* ============ seqRow ============ */

function seqRow(seqNum, label, opts={}){
  const isOpen = openSections.has(seqNum);
  const chevron = isOpen ? '▲' : '▼';
  let cards = '';
  if(isOpen){
    const quizCard = opts.worksheetUrl
      ? `<div class="card quiz" onclick="showWorksheet('${opts.worksheetUrl}')"><h3>מבדק שליטה</h3></div>`
      : '';
    const answersCard = opts.answersUrl ? `<div class="flow-arrow">←</div><div class="card" onclick="showWorksheet('${opts.answersUrl}')" style="background:rgba(72,176,140,0.12);border:1.5px solid rgba(72,176,140,0.35);color:var(--seafoam);"><h3>תשובות</h3></div>` : '';
    const checkCard = opts.checkUrl ? `<div class="flow-arrow">←</div><div class="card" onclick="showWorksheet('${opts.checkUrl}')" style="background:rgba(99,102,241,0.12);border:1.5px solid rgba(99,102,241,0.45);color:#a5b4fc;"><h3>בדיקה עצמית</h3></div>` : '';
    const nextCard = opts.hasNext
      ? `<div class="flow-arrow">←</div><div class="card" onclick="window.location.href='../index.html'" style="background:rgba(72,176,140,0.12);border:1.5px solid rgba(72,176,140,0.35);color:var(--seafoam);"><h3>ליחידה הבאה</h3></div>`
      : '';
    cards = `<div class="cards" style="margin-bottom:6px;">
      <div class="card learn" onclick="state.sequence=${seqNum};goTo('learn')"><h3>הקנייה</h3></div>
      <div class="flow-arrow">←</div>
      <div class="card game" onclick="state.sequence=${seqNum};startGame()"><h3>תרגול</h3></div>
      ${quizCard ? '<div class="flow-arrow">←</div>'+quizCard : ''}
      ${checkCard}
      ${answersCard}
      ${nextCard}
    </div>`;
  }
  return `
    <div onclick="toggleSection(${seqNum})" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:10px 4px 10px;border-bottom:1px solid rgba(234,244,241,0.08);user-select:none;">
      <span class="sequence-title" style="margin:0;">${label}</span>
      <span style="font-size:20px;color:rgba(234,244,241,0.4);transition:transform .15s;">${chevron}</span>
    </div>
    ${cards}`;
}

/* ============ HOME ============ */

function renderHome(){
  return `
    <div class="hero">
      <h1 class="title">משוואות ונקודות על גרף</h1>
    </div>
    <div class="sequence-section" style="margin-bottom:32px;">
      <div class="sequence-title" style="font-size:19px;color:var(--gold);margin-bottom:8px;">משוואות</div>
      ${seqRow(1,'1. מבוא למשוואות — זיהוי פתרון',{worksheetUrl:'../worksheets/equations_intro_exam.html',answersUrl:'../worksheets/equations_intro_exam_answers.html',checkUrl:'../worksheets/equations_intro_exam_check.html'})}
      ${seqRow(2,'2. פתרון משוואות',{worksheetUrl:'../worksheets/equations_solving_exam.html',answersUrl:'../worksheets/equations_solving_exam_answers.html',checkUrl:'../worksheets/equations_solving_exam_check.html'})}
      ${seqRow(3,'3. שאלות מילוליות',{worksheetUrl:'../worksheets/equations_word_problems_exam.html',answersUrl:'../worksheets/equations_word_problems_exam_answers.html',checkUrl:'../worksheets/equations_word_problems_exam_check.html'})}

      <div class="sequence-title" style="font-size:19px;color:var(--gold);margin:20px 0 8px;">קריאת תיאור גרפי של נקודות ברביע I</div>
      ${seqRow(4,'4. קריאת תיאור גרפי של נקודות ברביע I',{worksheetUrl:'../worksheets/graphs_reading_exam.html'})}

      <div style="font-size:12px;font-weight:700;letter-spacing:1px;color:rgba(234,244,241,0.4);text-transform:uppercase;margin:14px 0 6px;">מבדק מקיף</div>
      <div onclick="showWorksheet('../worksheets/equations_master_exam.html')" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:rgba(226,96,79,0.1);border:1.5px solid rgba(226,96,79,0.4);margin-bottom:4px;transition:transform .15s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
        <div>
          <div style="font-weight:700;font-size:15px;color:var(--coral);">מבדק מקיף — כל נושא המשוואות</div>
          <div style="font-size:12px;color:rgba(234,244,241,0.5);margin-top:3px;">מבוא למשוואות · פתרון משוואות · שאלות מילוליות · קריאת גרפים</div>
        </div>
        <span style="font-size:18px;color:rgba(226,96,79,0.6);">←</span>
      </div>

      <div style="font-size:12px;font-weight:700;letter-spacing:1px;color:rgba(239,169,74,0.8);text-transform:uppercase;margin:22px 0 6px;">⭐ מבדק מסכם</div>
      <div onclick="window.open('../worksheets/comprehensive_hard_exam.html','_blank')" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,rgba(239,169,74,0.18),rgba(139,92,246,0.18));border:1.5px solid rgba(239,169,74,0.5);margin-bottom:4px;transition:transform .15s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
        <div>
          <div style="font-weight:700;font-size:15px;color:#EFA94A;">מבדק מסכם — מספרי ואלגברי ⭐⭐⭐</div>
          <div style="font-size:12px;color:rgba(234,244,241,0.5);margin-top:3px;">מספרים מכוונים · מערכת הצירים · חזקות ושורשים · ביטויים · משוואות | קשה מאוד</div>
        </div>
        <span style="font-size:18px;color:rgba(239,169,74,0.6);">←</span>
      </div>
    </div>`;
}

/* ============ LEARN ============ */

function renderLearn(){
  if(state.sequence===2) return renderLearn2();
  return `<div class="panel">
    <h2 class="qtitle">הקנייה בבנייה</h2>
    <div style="text-align:center;opacity:.6;margin-top:20px;">תוכן ההקנייה יתווסף בקרוב</div>
    <div class="btnrow">
      <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
    </div>
  </div>`;
}

function renderLearn2(){
  return `<div class="panel">
    <h2 class="qtitle">פתרון משוואות</h2>
    <p class="qtext" style="margin-bottom:16px;">משוואה היא כמו מאזניים ⚖️ — שני האגפים שווים. מה שעושים לאגף אחד, חייבים לעשות לשני.</p>

    <div class="gold-box" style="font-size:15px;text-align:right;padding:14px 18px;">
      <div style="font-weight:800;margin-bottom:8px;font-size:16px;text-align:center;">שלבי פתרון</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div><span style="color:var(--gold);font-weight:800;">1.</span> פתחו סוגריים (אם יש)</div>
        <div><span style="color:var(--gold);font-weight:800;">2.</span> העבירו נעלמים לאגף ימין, מספרים לאגף שמאל</div>
        <div><span style="color:var(--gold);font-weight:800;">3.</span> כנסו איברים דומים</div>
        <div><span style="color:var(--gold);font-weight:800;">4.</span> חלקו בציפר של הנעלם</div>

    </div>

    <div class="learn-note" style="margin-top:18px;">
      <div style="font-weight:700;margin-bottom:10px;">דוגמה 1 — משוואה דו-שלבית:</div>
      <div class="examples-row" style="font-size:15px;gap:8px;">
        <div class="example-box" style="font-size:15px;text-align:right;padding:10px 14px;">
          <div class="m" style="text-align:center;font-size:18px;margin-bottom:8px;">2x + 3 = 11</div>
          <div>מחסירים 3: <span class="m">2x = 8</span></div>
          <div>מחלקים ב-2: <span class="m">x = 4</span></div>
          <div style="margin-top:6px;color:var(--seafoam);">בדיקה: 2·4 + 3 = 11 ✓</div>
        </div>
        <div class="example-box" style="font-size:15px;text-align:right;padding:10px 14px;">
          <div class="m" style="text-align:center;font-size:18px;margin-bottom:8px;">3x + 2 = x + 10</div>
          <div>מחסירים x: <span class="m">2x + 2 = 10</span></div>
          <div>מחסירים 2: <span class="m">2x = 8</span></div>
          <div>מחלקים ב-2: <span class="m">x = 4</span></div>
        </div>

    </div>

    <div class="learn-note" style="margin-top:14px;border-right-color:var(--coral);">
      <div style="font-weight:700;margin-bottom:10px;">משוואות מיוחדות:</div>
      <div style="display:flex;flex-direction:column;gap:12px;font-size:15px;">
        <div>
          <div style="font-weight:700;color:var(--coral);">🚫 אין פתרון</div>
          <div class="m" style="margin:4px 0;">2x + 5 = 2x + 8</div>
          <div>מחסירים 2x: <span class="m">5 = 8</span> — שגוי תמיד. אין ערך של x שיעבוד.</div>
        </div>
        <div>
          <div style="font-weight:700;color:var(--seafoam);">♾️ אינסוף פתרונות</div>
          <div class="m" style="margin:4px 0;">3(x + 2) = 3x + 6</div>
          <div>פותחים: <span class="m">3x + 6 = 3x + 6</span> — נכון לכל x. כל מספר הוא פתרון.</div>
        </div>
      </div>

    <div class="btnrow" style="margin-top:20px;">
      <button class="btn" onclick="state.sequence=2;startGame()">לתרגול ←</button>
      <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
    </div>
  </div>`;
}


/* ============ GAME ============ */

function renderGame(){
  const lvl=currentGameLevels()[state.levelIndex];
  const levels=currentGameLevels();
  const dots=levels.map((_,i)=>{
    let cls='dot';
    if(i<state.levelIndex) cls+=' done';
    else if(i===state.levelIndex) cls+=' active';
    return `<div class="${cls}" onclick="jumpToLevel(${i})" style="cursor:pointer;"></div>`;
  }).join('');
  let content='';
  if(!lvl) content='<p>שגיאה</p>';
  else if(lvl.id==='mc') content=renderMC(lvl);
  else if(lvl.id==='typedSum') content=renderTypedSum(lvl);
  const sub=state.levelSub||{};
  const isAnswered=!!sub.answered;
  const isLastLvl=state.levelIndex>=levels.length-1;
  const skipBtn=(!isAnswered&&!isLastLvl)
    ?`<div style="text-align:center;margin-top:10px;"><button class="btn secondary" onclick="skipLevel()" style="font-size:13px;padding:6px 18px;">דלג לתרגיל הבא ←</button></div>`:'';
  return `<div class="progressdots">${dots}</div><div class="panel">${content}${skipBtn}</div>`;
}

function renderMC(lvl){
  const sub=state.levelSub;
  const opts=state.shuffledOptions&&state.shuffledOptions.length?state.shuffledOptions:lvl.options;
  const btns=opts.map(opt=>{
    let cls='mc-btn';
    if(sub.answered){
      if(opt===lvl.correct) cls+=' correct';
      else if(opt===sub.picked&&opt!==lvl.correct) cls+=' wrong';
    }
    return `<button class="${cls}" onclick="answerMC('${escOpt(opt)}')" ${sub.answered?'disabled':''}>${wrapOpt(opt)}</button>`;
  }).join('');
  let feedback='';
  if(sub.answered){
    feedback=`
      <div class="feedback ${sub.correct?'ok':'bad'}">${sub.correct?'נכון!':'לא מדויק.'}</div>
      <div class="explain-box">${wrapMath(lvl.explain)}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;
  }
  return `
    <h2 class="qtitle">${lvl.title}</h2>
    <p class="qtext">${lvl.question}</p>
    <div class="mc-options">${btns}</div>
    ${feedback}`;
}

function answerMC(picked){
  const lvl=currentGameLevels()[state.levelIndex];
  const correct=picked===lvl.correct;
  state.levelSub={answered:true,correct,picked};
  if(correct) state.gameScore++;
  state.gameTotal++;
  render();
}

function renderTypedSum(lvl){
  const sub=state.levelSub||{};
  const isAnswered=!!sub.answered;
  let feedback='';
  if(isAnswered){
    feedback=`
      <div class="feedback ${sub.correct?'ok':'bad'}">${sub.correct?'נכון!':'לא מדויק. התשובה: '+lvl.correct}</div>
      <div class="explain-box">${wrapMath(lvl.explain)}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;
  }
  const inputArea=isAnswered?'':`
    <div class="abs-input-row">
      <input type="number" id="tsInput" placeholder="?" onkeydown="if(event.key==='Enter')checkTypedSum()"/>
    </div>
    <div class="btnrow"><button class="btn" onclick="checkTypedSum()">בדיקה</button></div>`;
  const exprBlock = lvl.sub
    ? `<div style="font-size:12px;color:rgba(234,244,241,0.5);margin-bottom:6px;text-align:center;">נתון הביטוי:</div>
       <div style="text-align:center;font-size:26px;font-weight:700;direction:ltr;unicode-bidi:isolate;margin-bottom:12px;">${lvl.expr}</div>
       <div style="text-align:center;font-size:16px;color:var(--gold);margin-bottom:4px;">הציבו: ${lvl.sub}</div>`
    : `<div style="text-align:center;font-size:22px;font-weight:700;direction:ltr;unicode-bidi:isolate;">${lvl.expr} = ?</div>`;
  return `
    <h2 class="qtitle">${lvl.title}</h2>
    <div style="margin:14px 0;">${exprBlock}</div>
    ${inputArea}
    ${feedback}`;
}

function checkTypedSum(){
  const inp=document.getElementById('tsInput');
  if(!inp) return;
  const val=parseFloat(inp.value);
  if(isNaN(val)) return;
  const lvl=currentGameLevels()[state.levelIndex];
  const correct=Math.abs(val-lvl.correct)<0.001;
  state.levelSub={answered:true,correct,given:val};
  if(correct) state.gameScore++;
  state.gameTotal++;
  render();
}

function renderGameResults(){
  const pct=state.gameTotal>0?Math.round(state.gameScore/state.gameTotal*100):0;
  const msg=pct>=85?'מעולה! שליטה מלאה':'כמעט! כדאי לתרגל שוב';
  return `<div class="panel" style="text-align:center;">
    <h2 class="qtitle">תוצאות</h2>
    <div class="scorebig">${state.gameScore}/${state.gameTotal}</div>
    <div style="font-size:22px;font-weight:700;margin:8px 0;">${pct}%</div>
    <div style="font-size:16px;opacity:.8;margin-bottom:20px;">${msg}</div>
    <div class="btnrow">
      <button class="btn" onclick="startGame()">שוב ←</button>
      <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
    </div>
  </div>`;
}

/* ============ WORKSHEET OVERLAY ============ */

function showWorksheet(url){
  const overlay=document.getElementById('ws-overlay');
  document.getElementById('ws-frame').src=url;
  overlay.style.display='flex';
  document.body.style.overflow='hidden';
}
function hideWorksheet(){
  document.getElementById('ws-overlay').style.display='none';
  document.getElementById('ws-frame').src='';
  document.body.style.overflow='';
}

/* ============ INIT ============ */
render();
</script>
