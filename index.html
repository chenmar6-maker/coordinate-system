<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת הצירים בים</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700;800&display=swap');

  :root{
    --navy:#0A2A43;
    --deep-navy:#071B2C;
    --teal:#1C6E8C;
    --light-teal:#3AA0C4;
    --foam:#EAF4F1;
    --gold:#EFA94A;
    --coral:#E2604F;
    --seafoam:#48B08C;
    --paper:#EFE7D3;
    --ink:#0A2A43;
    --gridline: rgba(234,244,241,0.14);
    --axislabel: rgba(234,244,241,0.68);
    --axis:#EAF4F1;
    --linecolor:#EFA94A;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Assistant',sans-serif;
    background: radial-gradient(ellipse at 50% -10%, var(--teal) 0%, var(--navy) 45%, var(--deep-navy) 100%);
    color: var(--foam);
    direction: rtl;
    min-height:100vh;
    line-height:1.6;
  }

  .wrap{max-width:900px;margin:0 auto;padding:20px 18px 70px;}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;max-width:900px;margin:0 auto;
  }
  .brand-group{display:flex;align-items:center;gap:10px;}
  .topbar-logo{height:30px;width:auto;display:block;border-radius:6px;background:#fff;padding:3px 7px;}
  .brand{
    font-family:'Frank Ruhl Libre',serif;font-size:19px;color:var(--gold);
    text-align:right;
  }
  .logo-badge{
    display:inline-block;background:#fff;padding:10px 20px;border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.28);margin-bottom:14px;
  }
  .logo-badge img{height:54px;width:auto;display:block;}
  .homebtn{
    background:transparent;border:1.5px solid var(--foam);color:var(--foam);
    padding:7px 16px;border-radius:20px;font-family:'Assistant',sans-serif;
    font-size:14px;cursor:pointer;opacity:.85;
  }
  .homebtn:hover{opacity:1;border-color:var(--gold);color:var(--gold);}

  .hero{text-align:center;padding:18px 10px 10px;}
  h1.title{
    font-family:'Frank Ruhl Libre',serif;font-weight:700;
    font-size:clamp(26px,5.2vw,42px);margin:6px 0 10px;color:var(--gold);
    text-align:center;
  }
  p.subtitle{font-size:17px;color:var(--foam);opacity:.85;margin:0 0 8px;text-align:center;}

  .rtl-text{text-align:right;direction:rtl;}

  ul.bullets{list-style:none;margin:14px 0;padding:0;text-align:right;}
  ul.bullets li{position:relative;padding-right:20px;margin-bottom:9px;font-size:16px;}
  ul.bullets li::before{content:"•";color:var(--gold);position:absolute;right:0;top:0;font-size:18px;}

  .cards{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:28px;}

  .flow-arrow{
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:700;color:var(--gold);flex-shrink:0;
    text-shadow:0 0 10px rgba(239,169,74,0.5);
  }
  .flow-arrow .narrow-arrow{display:none;}

  .card{
    background:var(--paper);color:var(--ink);cursor:pointer;
    text-align:right;transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 0 rgba(0,0,0,.18);
  }
  .card:hover{transform:translateY(-4px);}
  .card h3{font-family:'Frank Ruhl Libre',serif;font-size:20px;margin:0 0 8px;}
  .card p{font-size:14.5px;line-height:1.5;margin:0;color:#3c4a52;}

  .card.learn{
    width:230px;padding:22px 22px 26px;border-right:6px solid var(--teal);
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%);
  }
  .card.quiz{
    width:230px;padding:22px 22px 26px;border-right:6px solid var(--coral);
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%);
  }
  .card.quiz .tag{
    display:inline-block;margin-top:10px;background:var(--coral);color:var(--foam);
    font-size:12px;padding:3px 10px;border-radius:12px;
  }
  .card.game{
    width:220px;height:220px;border-radius:50%;
    border:6px solid var(--navy);outline:3px solid var(--gold);outline-offset:4px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;
  }
  .card.game h3{text-align:center;}
  .card.game p{text-align:center;}

  .icon{font-size:30px;margin-bottom:8px;display:block;text-align:inherit;}

  .panel{
    background:rgba(234,244,241,0.06);border:1px solid rgba(234,244,241,0.15);
    border-radius:10px;padding:22px;margin:18px 0;
  }

  .callout{
    background:rgba(239,169,74,0.12);border-right:4px solid var(--gold);
    border-radius:6px;padding:14px 16px;margin:0 0 18px;text-align:right;
  }
  .callout .who{font-weight:700;color:var(--gold);margin-bottom:4px;display:block;}

  .hint{
    background:rgba(239,169,74,0.08);border-right:4px solid var(--gold);
    border-radius:6px;padding:10px 16px;margin:0 0 18px;text-align:right;
  }
  .hint summary{
    cursor:pointer;font-weight:700;color:var(--gold);list-style:none;
    display:flex;align-items:center;gap:6px;justify-content:flex-end;
  }
  .hint summary::-webkit-details-marker{display:none;}
  .hint .arrow{display:inline-block;transition:transform .15s ease;}
  .hint[open] .arrow{transform:rotate(90deg);}
  .hint-content{margin-top:10px;font-size:15px;}

  .coord-input-row{
    display:flex;align-items:center;justify-content:center;gap:4px;
    margin:16px 0;font-size:24px;font-weight:700;color:var(--gold);
  }
  .coord-input-row input{
    width:58px;padding:6px 4px;font-size:18px;border-radius:6px;border:1.5px solid var(--teal);
    text-align:center;font-family:'Assistant',sans-serif;background:var(--foam);color:var(--ink);
  }
  .coord-input-row input:focus{outline:2px solid var(--gold);}
  .coord-input-row .paren, .coord-input-row .comma{color:var(--foam);}

  .gridbox{display:flex;justify-content:center;margin:16px 0;}
  .gridbox svg{background:rgba(10,42,67,0.35);border-radius:8px;}

  .video-wrap{
    position:relative;width:100%;max-width:520px;margin:0 auto 20px;
    padding-top:56.25%;border-radius:10px;overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
  }
  .video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

  .btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .btn{
    background:var(--gold);color:var(--deep-navy);border:none;font-weight:700;
    font-family:'Assistant',sans-serif;font-size:15px;padding:11px 26px;
    border-radius:24px;cursor:pointer;transition:transform .12s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn.secondary{background:transparent;border:1.5px solid var(--foam);color:var(--foam);}
  .btn.secondary:hover{border-color:var(--gold);color:var(--gold);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  .feedback{text-align:center;font-size:16px;font-weight:700;margin:14px 0;min-height:24px;}
  .feedback.ok{color:var(--seafoam);}
  .feedback.bad{color:var(--coral);}

  .target-pop{
    text-align:center;
    animation: popIn .45s cubic-bezier(.34,1.56,.64,1);
  }
  .target-pop .label{
    display:block;font-size:14px;color:var(--foam);opacity:.8;margin-bottom:4px;
  }
  .target-pop .coord-big{
    display:inline-block;font-size:32px;font-weight:800;
    font-family:'Assistant',sans-serif;
  }
  .target-wrap{
    display:flex;align-items:center;justify-content:center;gap:16px;
    margin:8px 0 16px;flex-wrap:wrap;
  }
  .target-counter-badge{
    width:62px;height:62px;border-radius:50%;flex-shrink:0;
    background:var(--navy);border:2.5px solid var(--gold);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1.05;animation: popIn .45s cubic-bezier(.34,1.56,.64,1);
  }
  .target-counter-badge .num{font-size:22px;font-weight:800;color:var(--gold);}
  .target-counter-badge .of{font-size:10px;color:var(--foam);opacity:.8;margin-top:1px;}
  @keyframes popIn{
    0%{transform:scale(.55);opacity:0;}
    65%{transform:scale(1.18);opacity:1;}
    100%{transform:scale(1);}
  }

  .miss-mark{
    animation: missFade 1.2s ease-out forwards;
  }
  @keyframes missFade{
    0%{opacity:1;transform:scale(1.4);}
    18%{opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(1);}
  }

  .reflect-box{
    background:rgba(58,160,196,0.12);border-right:4px solid var(--light-teal);
    border-radius:6px;padding:14px 16px;margin:0 0 18px;text-align:right;
  }
  .reflect-points{
    display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
    margin-top:10px;direction:ltr;
  }
  .reflect-coord{font-size:22px;font-weight:800;color:var(--light-teal);}

  .progressdots{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
  .dot{
    width:11px;height:11px;border-radius:50%;background:rgba(234,244,241,0.25);
    border:none;padding:0;
  }
  .dot.clickable{cursor:pointer;transition:transform .12s ease, background .12s ease;}
  .dot.clickable:hover{transform:scale(1.4);background:rgba(234,244,241,0.5);}
  .dots-hint{
    text-align:center;font-size:12.5px;color:var(--foam);opacity:.6;
    margin:0 0 16px;
  }
  .dot.done{background:var(--seafoam);}
  .dot.active{background:var(--gold);}

  .inputs-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0;align-items:center;}
  .inputs-row label{font-size:15px;display:flex;align-items:center;gap:6px;}
  .inputs-row input{
    width:70px;padding:8px 10px;font-size:16px;border-radius:6px;border:1.5px solid var(--teal);
    text-align:center;font-family:'Assistant',sans-serif;background:var(--foam);color:var(--ink);
  }
  .inputs-row input:focus{outline:2px solid var(--gold);}

  .mc-options{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:16px auto 0;}
  .mc-btn{
    background:rgba(234,244,241,0.08);border:1.5px solid rgba(234,244,241,0.3);
    color:var(--foam);padding:12px 16px;border-radius:8px;font-size:16px;
    cursor:pointer;font-family:'Assistant',sans-serif;
    text-align:center;
  }
  .mc-btn:hover{border-color:var(--gold);}
  .mc-btn.correct{background:rgba(72,176,140,0.3);border-color:var(--seafoam);}
  .mc-btn.wrong{background:rgba(226,96,79,0.3);border-color:var(--coral);}
  .mc-btn:disabled{cursor:default;}

  .explain-box{
    background:rgba(72,176,140,0.1);border-right:4px solid var(--seafoam);
    border-radius:6px;padding:12px 16px;margin-top:14px;text-align:right;font-size:15px;
  }

  .qmeta{text-align:center;font-size:14px;opacity:.75;margin-bottom:6px;}
  .qtitle{font-size:18px;font-weight:700;text-align:center;margin:6px 0 4px;}
  .qtext{font-size:16px;text-align:center;margin:0 0 6px;max-width:560px;margin-left:auto;margin-right:auto;}

  .coord{direction:ltr;display:inline-block;font-weight:700;color:var(--gold);}

  .scorebig{font-family:'Frank Ruhl Libre',serif;font-size:52px;color:var(--gold);text-align:center;margin:10px 0;}

  .targetlist{max-width:300px;margin:14px auto;}
  .targetlist .t{
    display:flex;justify-content:space-between;padding:7px 12px;font-size:15px;
    border-bottom:1px solid rgba(234,244,241,0.15);
  }
  .targetlist .t.hit{color:var(--seafoam);}

  footer.waves{
    position:relative;height:36px;margin-top:20px;opacity:.5;
  }

  @media (max-width:480px){
    .card.learn, .card.quiz{width:100%;max-width:300px;}
    .cards{flex-direction:column;}
    .flow-arrow .wide-arrow{display:none;}
    .flow-arrow .narrow-arrow{display:inline;}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand-group">
    <img id="topbarLogo" class="topbar-logo" alt="לוגו חן מרגלית - למידה אקטיבית">
    <span class="brand">⚓ מערכת הצירים של הים</span>
  </div>
  <button class="homebtn" id="homeBtn">בית</button>
</div>
<div id="app" class="wrap"></div>

/* ============ SVG GRID ENGINE ============ */

function shipIcon(cx,cy,color){
  return `<g transform="translate(${cx},${cy})">
    <path d="M -11,-2 L 11,-2 L 8,9 L -8,9 Z" fill="${color}" stroke="var(--deep-navy)" stroke-width="1.5"/>
    <rect x="-2" y="-11" width="4" height="10" fill="${color}"/>
    <path d="M 2,-11 L 10,-6 L 2,-4 Z" fill="${color}"/>
  </g>`;
}
function buoyIcon(cx,cy,color){
  return `<g transform="translate(${cx},${cy})">
    <circle r="9" fill="${color}" stroke="var(--deep-navy)" stroke-width="1.5"/>
    <circle r="3" fill="var(--deep-navy)"/>
  </g>`;
}

function buildGrid({id, size=10, cellPx=34, points=[], lines=[], interactive=false, missPoint=null}){
  const margin = 32;
  const width = margin + size*cellPx + 26;
  const height = margin + size*cellPx + 26;
  const X = gx => margin + gx*cellPx;
  const Y = gy => height - margin - gy*cellPx;

  let gridLines = '';
  for(let i=0;i<=size;i++){
    gridLines += `<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(size)}" stroke="var(--gridline)" stroke-width="1"/>`;
    gridLines += `<line x1="${X(0)}" y1="${Y(i)}" x2="${X(size)}" y2="${Y(i)}" stroke="var(--gridline)" stroke-width="1"/>`;
  }

  let labels = `<text x="${X(0)-10}" y="${Y(0)+16}" font-size="11" fill="var(--axislabel)" text-anchor="end" font-family="Assistant">0</text>`;
  for(let i=1;i<=size;i++){
    labels += `<text x="${X(i)}" y="${Y(0)+18}" font-size="11" fill="var(--axislabel)" text-anchor="middle" font-family="Assistant">${i}</text>`;
    labels += `<text x="${X(0)-10}" y="${Y(i)+4}" font-size="11" fill="var(--axislabel)" text-anchor="end" font-family="Assistant">${i}</text>`;
  }

  const axisColor = 'var(--axis)';
  const axes = `
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(size)+12}" y2="${Y(0)}" stroke="${axisColor}" stroke-width="2"/>
    <polygon points="${X(size)+12},${Y(0)-5} ${X(size)+20},${Y(0)} ${X(size)+12},${Y(0)+5}" fill="${axisColor}"/>
    <text x="${X(size)+8}" y="${Y(0)-10}" font-size="13" fill="${axisColor}" text-anchor="middle" font-family="Assistant">x</text>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(size)-12}" stroke="${axisColor}" stroke-width="2"/>
    <polygon points="${X(0)-5},${Y(size)-12} ${X(0)},${Y(size)-20} ${X(0)+5},${Y(size)-12}" fill="${axisColor}"/>
    <text x="${X(0)+14}" y="${Y(size)-14}" font-size="13" fill="${axisColor}" text-anchor="middle" font-family="Assistant">y</text>
  `;

  let linesMarkup = '';
  lines.forEach(seg=>{
    linesMarkup += `<line x1="${X(seg[0].x)}" y1="${Y(seg[0].y)}" x2="${X(seg[1].x)}" y2="${Y(seg[1].y)}" stroke="var(--linecolor)" stroke-width="2.5"/>`;
  });

  let pointsMarkup = '';
  points.forEach(p=>{
    const cx=X(p.x), cy=Y(p.y);
    const color = p.color || 'var(--gold)';
    if(p.icon==='ship'){ pointsMarkup += shipIcon(cx,cy,color); }
    else if(p.icon==='buoy'){ pointsMarkup += buoyIcon(cx,cy,color); }
    else if(p.icon==='unknown'){
      pointsMarkup += `<circle cx="${cx}" cy="${cy}" r="12" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="3,3"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="15" fill="${color}" font-weight="700" font-family="Assistant">?</text>`;
    } else {
      pointsMarkup += `<circle cx="${cx}" cy="${cy}" r="6" fill="${color}" stroke="var(--deep-navy)" stroke-width="1.5"/>`;
    }
    if(p.label){
      pointsMarkup += `<text x="${cx}" y="${cy-14}" text-anchor="middle" font-size="13" fill="var(--foam)" font-weight="700" font-family="Assistant">${p.label}</text>`;
    }
  });

  const svg = `<svg id="${id}" viewBox="0 0 ${width} ${height}" aria-hidden="true" style="width:100%;height:auto;max-width:${width}px;user-select:none;-webkit-user-select:none;${interactive?'cursor:crosshair;':''}">
    ${gridLines}${axes}${labels}${linesMarkup}${pointsMarkup}${missPoint ? `<g transform="translate(${X(missPoint.x)},${Y(missPoint.y)})"><g class="miss-mark">
      <line x1="-9" y1="-9" x2="9" y2="9" stroke="var(--coral)" stroke-width="4" stroke-linecap="round"/>
      <line x1="9" y1="-9" x2="-9" y2="9" stroke="var(--coral)" stroke-width="4" stroke-linecap="round"/>
    </g></g>` : ''}
  </svg>`;

  return {svg, width, height, margin, cellPx, size};
}

function attachGridClick(svgId, cfg, callback){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  svg.addEventListener('click', function(evt){
    const rect = svg.getBoundingClientRect();
    const scaleX = cfg.width/rect.width;
    const scaleY = cfg.height/rect.height;
    const px = (evt.clientX-rect.left)*scaleX;
    const py = (evt.clientY-rect.top)*scaleY;
    const gx = Math.round((px-cfg.margin)/cfg.cellPx);
    const gy = Math.round((cfg.height-cfg.margin-py)/cfg.cellPx);
    if(gx<0||gx>cfg.size||gy<0||gy>cfg.size) return;
    callback(gx,gy);
  });
}

/* ============ RENDER DISPATCH ============ */

function targetColor(idx){
  const colors = ['var(--gold)','var(--seafoam)','var(--coral)','var(--light-teal)'];
  return colors[idx % colors.length];
}

function targetAnnounce(label, bigText, idx, total, isCoord=true){
  return `
    <div class="target-wrap">
      <div class="target-counter-badge"><span class="num">${idx+1}</span><span class="of">מתוך ${total}</span></div>
      <div class="target-pop">
        <span class="label">${label}</span>
        <span class="coord-big" style="color:${targetColor(idx)};${isCoord?'direction:ltr;':'direction:rtl;'}">${bigText}</span>
      </div>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  if(state.screen==='home') app.innerHTML = renderHome();
  else if(state.screen==='learn'){ app.innerHTML = renderLearn(); postRenderLearn(); }
  else if(state.screen==='game'){ app.innerHTML = renderGame(); postRenderGame(); }
  else if(state.screen==='gameResults') app.innerHTML = renderGameResults();
  else if(state.screen==='quiz'){ app.innerHTML = renderQuiz(); postRenderQuiz(); }
  else if(state.screen==='quizResults') app.innerHTML = renderQuizResults();
}

/* ============ GAME ============ */

function startGame(){
  state.screen='game';
  state.levelIndex=0;
  state.gameScore=0;
  state.gameTotal=0;
  state.levelSub = freshLevelSub(0);
  render();
}

function freshLevelSub(levelIdx){
  const lvl = gameLevels[levelIdx];
  if(lvl.id==='place') return {targetIdx:0, hits:[], feedback:'', wrongTry:false, missPoint:null};
  if(lvl.id==='read') return {targetIdx:0, x:'', y:'', feedback:'', checked:false};
  if(lvl.id==='shape') return {placed:[], feedback:'', shapeAnswered:false, shapeCorrect:null, missPoint:null};
  if(lvl.id==='measure') return {vertical:'', horizontal:'', area:'', checked:false, results:null};
  if(lvl.id==='concept') return {qIdx:0, feedback:null, answered:false, correctCount:0};
  return {};
}

let gameGridCfg = null;

function jumpToLevel(idx){
  state.levelIndex = idx;
  state.levelSub = freshLevelSub(idx);
  render();
}

function renderGame(){
  const lvl = gameLevels[state.levelIndex];
  const dots = gameLevels.map((l,i)=>{
    let cls='dot';
    if(i<state.levelIndex) cls+=' done';
    else if(i===state.levelIndex) cls+=' active';
    return `<button class="${cls} clickable" onclick="jumpToLevel(${i})" title="${l.title}" aria-label="${l.title}"></button>`;
  }).join('');

  let inner = '';
  if(lvl.id==='place') inner = renderPlaceLevel(lvl);
  else if(lvl.id==='read') inner = renderReadLevel(lvl);
  else if(lvl.id==='shape') inner = renderShapeLevel(lvl);
  else if(lvl.id==='measure') inner = renderMeasureLevel(lvl);
  else if(lvl.id==='concept') inner = renderConceptLevel(lvl);

  return `
    <div class="progressdots">${dots}</div>
    <div class="panel">
      <h2 class="qtitle" style="text-align:right;">${lvl.title}</h2>
      <details class="hint">
        <summary><span class="arrow">▸</span> רמז לקברניט!</summary>
        <div class="hint-content">${lvl.guide}</div>
      </details>
      <p class="qtext" style="text-align:right;">${lvl.instructions}</p>
      ${inner}
    </div>
  `;
}

function renderPlaceLevel(lvl){
  const sub = state.levelSub;
  const target = lvl.targets[sub.targetIdx];
  const points = sub.hits.map(h=>({x:h.x, y:h.y, icon:'ship', color:'var(--seafoam)'}));
  const g = buildGrid({id:'gameGrid', size:10, cellPx:32, points, interactive: sub.targetIdx < lvl.targets.length, missPoint: sub.missPoint});
  gameGridCfg = g;
  const done = sub.targetIdx >= lvl.targets.length;
  return `
    ${!done ? targetAnnounce('מטרה חדשה זוהתה!', `(${target.x}, ${target.y})`, sub.targetIdx, lvl.targets.length) : ''}
    <div class="gridbox">${g.svg}</div>
    <div class="feedback ${sub.feedback==='ok'?'ok':sub.feedback==='bad'?'bad':''}">${sub.feedback==='ok'?'פגיעה! ⚓':sub.feedback==='bad'?'החטאה, נסו שוב':''}</div>
    ${done && lvl.reflect ? `
    <div class="reflect-box">
      <p class="qtext" style="text-align:right;margin:0;">${lvl.reflect.question}</p>
      <div class="reflect-points">
        ${lvl.targets.map(p=>`<span class="reflect-coord">(${p.x},${p.y})</span>`).join('')}
      </div>
    </div>` : ''}
    <div class="btnrow">
      ${done ? `<button class="btn" onclick="nextLevel()">להמשך המשחק</button>` : ''}
    </div>
  `;
}

function renderReadLevel(lvl){
  const sub = state.levelSub;
  const done = sub.targetIdx >= lvl.targets.length;
  const target = !done ? lvl.targets[sub.targetIdx] : null;
  const points = target ? [{...target, icon:'buoy', color:'var(--gold)'}] : [];
  const g = buildGrid({id:'gameGrid', size:10, cellPx:32, points, interactive:false});
  gameGridCfg = g;
  return `
    ${!done ? targetAnnounce('מוקש חדש התגלה!', 'פענחו את המיקום', sub.targetIdx, lvl.targets.length, false) : ''}
    <div class="gridbox">${g.svg}</div>
    ${!done ? `
    <div class="coord-input-row" dir="ltr">
      <span class="paren">(</span><input type="number" id="readX" value="${sub.x}" min="0" max="10"><span class="comma">,</span><input type="number" id="readY" value="${sub.y}" min="0" max="10"><span class="paren">)</span>
    </div>
    <div class="btnrow"><button class="btn" onclick="checkRead()" ${sub.checked?'disabled':''}>בדוק תשובה</button></div>
    ` : ''}
    <div class="feedback ${sub.feedback==='ok'?'ok':sub.feedback==='bad'?'bad':''}">${sub.feedback==='ok'?'תשובה נכונה! פוענח בהצלחה':sub.feedback==='bad'?`לא בדיוק. השיעור הנכון הוא (${target?target.x:''}, ${target?target.y:''})`:''}</div>
    <div class="btnrow">
      ${sub.checked && !done ? `<button class="btn" onclick="nextReadTarget()">למוקש הבא</button>` : ''}
      ${done ? `<button class="btn" onclick="nextLevel()">להמשך המשחק</button>` : ''}
    </div>
  `;
}

function renderShapeLevel(lvl){
  const sub = state.levelSub;
  const allPlaced = sub.placed.length >= lvl.points.length;
  const points = sub.placed.map((p,i)=>({...p, label:lvl.points[i].label, icon:'buoy', color:'var(--gold)'}));
  let lines = [];
  if(allPlaced){
    for(let i=0;i<lvl.points.length;i++){
      const a = lvl.points[i], b = lvl.points[(i+1)%lvl.points.length];
      lines.push([a,b]);
    }
  }
  const g = buildGrid({id:'gameGrid', size:10, cellPx:32, points, lines, interactive: !allPlaced, missPoint: sub.missPoint});
  gameGridCfg = g;

  const targetList = lvl.points.map((p,i)=>{
    const hitCls = i < sub.placed.length ? 'hit' : '';
    return `<div class="t ${hitCls}">${p.label} <span class="coord">(${p.x}, ${p.y})</span></div>`;
  }).join('');

  return `
    ${!allPlaced ? `<div class="targetlist">${targetList}</div>` : ''}
    <div class="gridbox">${g.svg}</div>
    <div class="feedback ${sub.feedback==='ok'?'ok':sub.feedback==='bad'?'bad':''}">${sub.feedback==='ok'?'סומן במקום!':sub.feedback==='bad'?'לא בדיוק המקום, נסו שוב':''}</div>
    ${allPlaced && !sub.shapeAnswered ? `
      <p class="qtext">איזו צורה נוצרה?</p>
      <div class="mc-options">
        ${lvl.shapeOptions.map(opt=>`<button class="mc-btn" onclick="answerShape('${opt}')">${opt}</button>`).join('')}
      </div>
    ` : ''}
    ${sub.shapeAnswered ? `
      <div class="explain-box"><strong>${sub.shapeCorrect?'תשובה נכונה!':'לא מדויק.'}</strong> הצלע BC (בין B ל-C) אופקית, והצלע AD (בין A ל-D) גם היא אופקית — שתי צלעות מקבילות בלבד, ולכן הצורה היא טרפז.</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">להמשך המשחק</button></div>
    ` : ''}
  `;
}

function renderMeasureLevel(lvl){
  const r = lvl.rect;
  const points = [
    {...r.a, label:'A'}, {...r.b, label:'B'}, {...r.c, label:'C'}, {...r.d, label:'D'}
  ];
  const lines = [[r.a,r.b],[r.b,r.c],[r.c,r.d],[r.d,r.a]];
  const g = buildGrid({id:'gameGrid', size:10, cellPx:32, points, lines, interactive:false});
  gameGridCfg = g;
  const sub = state.levelSub;
  const res = sub.results;
  return `
    <div class="gridbox">${g.svg}</div>
    <div class="inputs-row">
      <label>אורך AB: <input type="number" id="mVert" value="${sub.vertical}" ${sub.checked?'disabled':''}></label>
      <label>אורך BC: <input type="number" id="mHoriz" value="${sub.horizontal}" ${sub.checked?'disabled':''}></label>
      <label>שטח: <input type="number" id="mArea" value="${sub.area}" ${sub.checked?'disabled':''}></label>
    </div>
    <div class="btnrow">
      ${!sub.checked ? `<button class="btn" onclick="checkMeasure()">בדוק תשובות</button>` : ''}
    </div>
    ${res ? `
      <div class="feedback">${res.vertical?'✔️':'❌'} אורך AB: התשובה הנכונה ${lvl.answers.vertical} &nbsp; ${res.horizontal?'✔️':'❌'} אורך BC: התשובה הנכונה ${lvl.answers.horizontal} &nbsp; ${res.area?'✔️':'❌'} שטח: התשובה הנכונה ${lvl.answers.area}</div>
      <div class="btnrow"><button class="btn" onclick="finishGame()">לתוצאות המשחק</button></div>
    ` : ''}
  `;
}

function renderConceptLevel(lvl){
  const sub = state.levelSub;
  const done = sub.qIdx >= lvl.questions.length;
  if(done){
    return `
      <p class="qtext">ענית נכון על ${sub.correctCount} מתוך ${lvl.questions.length} שאלות.</p>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">להמשך המשחק</button></div>
    `;
  }
  const q = lvl.questions[sub.qIdx];
  return `
    <p class="qtext">${q.prompt}</p>
    <div class="mc-options">
      ${q.options.map(opt=>`<button class="mc-btn" onclick="answerConcept('${opt.replace(/'/g,"\\'")}')" ${sub.answered?'disabled':''}>${opt}</button>`).join('')}
    </div>
    ${sub.answered ? `
      <div class="explain-box"><strong>${sub.feedback==='ok'?'תשובה נכונה!':'לא מדויק.'}</strong> ${q.explain}</div>
      <div class="btnrow"><button class="btn" onclick="nextConceptQuestion()">${sub.qIdx===lvl.questions.length-1?'לסיכום':'לשאלה הבאה'}</button></div>
    ` : ''}
  `;
}

function answerConcept(opt){
  const lvl = gameLevels[state.levelIndex];
  const sub = state.levelSub;
  if(sub.answered) return;
  const q = lvl.questions[sub.qIdx];
  sub.answered = true;
  state.gameTotal++;
  if(opt===q.correct){
    sub.feedback='ok';
    sub.correctCount++;
    state.gameScore++;
  } else {
    sub.feedback='bad';
  }
  render();
}

function nextConceptQuestion(){
  const sub = state.levelSub;
  sub.qIdx++;
  sub.answered=false;
  sub.feedback=null;
  render();
}

function postRenderGame(){
  const lvl = gameLevels[state.levelIndex];
  if(lvl.id==='place'){
    attachGridClick('gameGrid', gameGridCfg, function(gx,gy){
      const sub = state.levelSub;
      if(sub.targetIdx>=lvl.targets.length) return;
      const t = lvl.targets[sub.targetIdx];
      state.gameTotal++;
      if(gx===t.x && gy===t.y){
        sub.hits.push({x:gx,y:gy});
        sub.feedback='ok';
        sub.missPoint=null;
        sub.targetIdx++;
        state.gameScore++;
      } else {
        sub.feedback='bad';
        sub.missPoint={x:gx,y:gy};
      }
      render();
    });
  } else if(lvl.id==='shape'){
    if(state.levelSub.placed.length < lvl.points.length){
      attachGridClick('gameGrid', gameGridCfg, function(gx,gy){
        const sub = state.levelSub;
        const idx = sub.placed.length;
        const t = lvl.points[idx];
        state.gameTotal++;
        if(gx===t.x && gy===t.y){
          sub.placed.push({x:gx,y:gy});
          sub.feedback='ok';
          sub.missPoint=null;
          state.gameScore++;
        } else {
          sub.feedback='bad';
          sub.missPoint={x:gx,y:gy};
        }
        render();
      });
    }
  }
}

function nextReadTarget(){
  const sub = state.levelSub;
  sub.targetIdx++;
  sub.x=''; sub.y=''; sub.feedback=''; sub.checked=false;
  render();
}

function checkRead(){
  const lvl = gameLevels[state.levelIndex];
  const sub = state.levelSub;
  const target = lvl.targets[sub.targetIdx];
  const xVal = document.getElementById('readX').value;
  const yVal = document.getElementById('readY').value;
  sub.x = xVal; sub.y = yVal;
  state.gameTotal++;
  if(parseInt(xVal)===target.x && parseInt(yVal)===target.y){
    sub.feedback='ok';
    state.gameScore++;
  } else {
    sub.feedback='bad';
  }
  sub.checked=true;
  render();
}

function answerShape(opt){
  const lvl = gameLevels[state.levelIndex];
  const sub = state.levelSub;
  sub.shapeAnswered = true;
  sub.shapeCorrect = (opt === lvl.correctShape);
  state.gameTotal++;
  if(sub.shapeCorrect) state.gameScore++;
  render();
}

function checkMeasure(){
  const lvl = gameLevels[state.levelIndex];
  const sub = state.levelSub;
  const v = parseInt(document.getElementById('mVert').value);
  const h = parseInt(document.getElementById('mHoriz').value);
  const a = parseInt(document.getElementById('mArea').value);
  sub.vertical=v; sub.horizontal=h; sub.area=a; sub.checked=true;
  const res = {
    vertical: v===lvl.answers.vertical,
    horizontal: h===lvl.answers.horizontal,
    area: a===lvl.answers.area
  };
  sub.results = res;
  state.gameTotal += 3;
  state.gameScore += (res.vertical?1:0)+(res.horizontal?1:0)+(res.area?1:0);
  render();
}

function nextLevel(){
  state.levelIndex++;
  if(state.levelIndex >= gameLevels.length){
    finishGame();
    return;
  }
  state.levelSub = freshLevelSub(state.levelIndex);
  render();
}

function finishGame(){
  state.screen='gameResults';
  render();
}

function renderGameResults(){
  return `
    <div class="panel" style="text-align:center;">
      <h2 class="qtitle">סיימתם את משחק הצוללות! 🎉</h2>
      <div class="scorebig">${state.gameScore} / ${state.gameTotal}</div>
      <p class="qtext">עכשיו אפשר לבדוק את הידע שלכם בבוחן החוקרים.</p>
      <div class="btnrow">
        <button class="btn" onclick="startQuiz()">לבוחן החוקרים 🗺️</button>
        <button class="btn secondary" onclick="goHome()">חזרה לבית</button>
      </div>
    </div>
  `;
}

/* ============ QUIZ ============ */

function startQuiz(){
  state.screen='quiz';
  state.quizIndex=0;
  state.quizScore=0;
  state.quizAnswered=false;
  state.quizLastCorrect=null;
  render();
}

let quizGridCfg = null;

function renderQuiz(){
  const q = quizQuestions[state.quizIndex];
  const dots = quizQuestions.map((_,i)=>{
    let cls='dot';
    if(i<state.quizIndex) cls+=' done';
    else if(i===state.quizIndex) cls+=' active';
    return `<div class="${cls}"></div>`;
  }).join('');

  let diagram = '';
  if(q.points){
    const g = buildGrid({id:'quizGrid', size:10, cellPx:30, points:q.points.map(p=>({...p, icon:'buoy', color:'var(--gold)'})), lines: q.lines||[], interactive:false});
    quizGridCfg = g;
    diagram = `<div class="gridbox">${g.svg}</div>`;
  } else if(q.scatter){
    const g = buildGrid({id:'quizGrid', size:10, cellPx:30, points:q.scatter.map(p=>({...p, icon:'dot', color:'var(--seafoam)'})), interactive:false});
    quizGridCfg = g;
    diagram = `<div class="gridbox">${g.svg}</div>`;
  } else if(q.trapezoid){
    const t = q.trapezoid;
    const g = buildGrid({id:'quizGrid', size:10, cellPx:30, points:[
      {...t.a,label:'A'},{...t.b,label:'B'},{...t.c,label:'C'},{...t.d,label:'D'}
    ], lines:[[t.a,t.b],[t.b,t.c],[t.c,t.d],[t.d,t.a]], interactive:false});
    quizGridCfg = g;
    diagram = `<div class="gridbox">${g.svg}</div>`;
  }

  let answerArea = '';
  if(q.type==='mc'){
    answerArea = `<div class="mc-options">
      ${q.options.map(opt=>`<button class="mc-btn" id="opt-${opt.replace(/[^a-zA-Zא-ת0-9]/g,'')}" onclick="answerMC('${opt.replace(/'/g,"\\'")}')" ${state.quizAnswered?'disabled':''}>${opt}</button>`).join('')}
    </div>`;
  } else if(q.type==='input1'){
    answerArea = `<div class="inputs-row">
      <label>תשובה: <input type="number" id="qInput1" ${state.quizAnswered?'disabled':''}></label>
      ${!state.quizAnswered ? `<button class="btn" onclick="answerInput1()">בדוק תשובה</button>` : ''}
    </div>`;
  } else if(q.type==='input2'){
    answerArea = `<div class="inputs-row" style="flex-direction:column;align-items:center;">
      <label>${q.label1}: <input type="number" id="qInput1" ${state.quizAnswered?'disabled':''}></label>
      <label>${q.label2}: <input type="number" id="qInput2" ${state.quizAnswered?'disabled':''}></label>
      ${!state.quizAnswered ? `<button class="btn" onclick="answerInput2()">בדוק תשובות</button>` : ''}
    </div>`;
  }

  const isLast = state.quizIndex === quizQuestions.length-1;

  return `
    <div class="progressdots">${dots}</div>
    <div class="panel">
      <div class="qmeta">שאלה ${state.quizIndex+1} מתוך ${quizQuestions.length}</div>
      <h2 class="qtitle">${q.title}</h2>
      <p class="qtext">${q.text}</p>
      ${diagram}
      ${answerArea}
      ${state.quizAnswered ? `
        <div class="explain-box"><strong>${state.quizLastCorrect?'תשובה נכונה!':'לא מדויק.'}</strong> ${q.explain}</div>
        <div class="btnrow"><button class="btn" onclick="${isLast?'finishQuiz()':'nextQuizQuestion()'}">${isLast?'לתוצאות הבוחן':'לשאלה הבאה'}</button></div>
      ` : ''}
    </div>
  `;
}

function postRenderQuiz(){}

function answerMC(opt){
  if(state.quizAnswered) return;
  const q = quizQuestions[state.quizIndex];
  state.quizAnswered = true;
  const correct = (opt === q.correct);
  state.quizLastCorrect = correct;
  if(correct) state.quizScore++;
  document.querySelectorAll('.mc-btn').forEach(btn=>{
    btn.disabled = true;
    if(btn.textContent === q.correct) btn.classList.add('correct');
    else if(btn.textContent === opt && !correct) btn.classList.add('wrong');
  });
  setTimeout(render, 350);
}

function answerInput1(){
  const q = quizQuestions[state.quizIndex];
  const v = parseInt(document.getElementById('qInput1').value);
  state.quizAnswered = true;
  const correct = (v === q.correct);
  state.quizLastCorrect = correct;
  if(correct) state.quizScore++;
  render();
}

function answerInput2(){
  const q = quizQuestions[state.quizIndex];
  const v1 = parseInt(document.getElementById('qInput1').value);
  const v2 = parseInt(document.getElementById('qInput2').value);
  state.quizAnswered = true;
  const correct = (v1===q.correct1 && v2===q.correct2);
  state.quizLastCorrect = correct;
  if(correct) state.quizScore++;
  render();
}

function nextQuizQuestion(){
  state.quizIndex++;
  state.quizAnswered = false;
  state.quizLastCorrect = null;
  render();
}

function finishQuiz(){
  state.screen='quizResults';
  render();
}

function renderQuizResults(){
  const pct = Math.round((state.quizScore/quizQuestions.length)*100);
  let msg = 'המשך להתאמן, אתם בדרך הנכונה!';
  if(pct>=85) msg = 'כל הכבוד, ניווט מצוין!';
  else if(pct>=60) msg = 'עבודה טובה, עוד קצת תרגול ותהיו רבי חובלים!';
  return `
    <div class="panel" style="text-align:center;">
      <h2 class="qtitle">תוצאות בוחן החוקרים 🗺️</h2>
      <div class="scorebig">${state.quizScore} / ${quizQuestions.length}</div>
      <p class="qtext">${msg}</p>
      <div class="btnrow">
        <button class="btn" onclick="startQuiz()">לנסות שוב</button>
        <button class="btn secondary" onclick="goHome()">חזרה לבית</button>
      </div>
    </div>
  `;
}

/* ============ INIT ============ */
document.getElementById('topbarLogo').src = LOGO_URI;
render();
</script>
</body>
</html>
