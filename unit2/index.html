<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מספרים מכוונים</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');

  :root{
    --navy:#1E1B2E;
    --deep-navy:#0F0D1A;
    --teal:#4A4080;
    --light-teal:#3AA0C4;
    --foam:#EAF4F1;
    --gold:#EFA94A;
    --coral:#E2604F;
    --seafoam:#48B08C;
    --paper:#EFE7D3;
    --ink:#0A2A43;
    --gridline: rgba(234,244,241,0.14);
    --axislabel: rgba(234,244,241,0.68);
    --axis:#EAF4F1;
    --linecolor:#EFA94A;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Rubik',sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #3D3568 0%, #1E1B2E 50%, #0F0D1A 100%);
    color: var(--foam);
    direction: rtl;
    min-height:100vh;
    line-height:1.6;
  }

  .wrap{max-width:900px;margin:0 auto;padding:20px 18px 70px;}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;max-width:900px;margin:0 auto;
  }
  .brand{
    font-family:'Rubik',sans-serif;font-size:19px;color:var(--gold);
    text-align:right;
  }
  .homebtn{
    background:transparent;border:1.5px solid var(--foam);color:var(--foam);
    padding:7px 16px;border-radius:20px;font-family:'Rubik',sans-serif;
    font-size:14px;cursor:pointer;opacity:.85;text-decoration:none;display:inline-block;
  }
  .homebtn:hover{opacity:1;border-color:var(--gold);color:var(--gold);}

  .hero{text-align:center;padding:18px 10px 10px;}
  h1.title{
    font-family:'Rubik',sans-serif;font-weight:800;
    font-size:clamp(26px,5.2vw,42px);margin:6px 0 10px;color:#FFFFFF;
    text-align:center;letter-spacing:-0.5px;
  }
  p.subtitle{font-size:17px;color:var(--foam);opacity:.85;margin:0 0 8px;text-align:center;}

  .cards{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  .sequence-section{margin-bottom:28px;background:rgba(234,244,241,0.04);border-radius:14px;padding:18px 20px;}
  .sequence-title{
    font-family:'Rubik',sans-serif;font-weight:700;
    font-size:17px;color:var(--foam);
    text-align:center;margin:0 0 14px;opacity:.9;
  }

  .flow-arrow{display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(239,169,74,0.5);flex-shrink:0;}

  .card{
    display:flex;align-items:center;gap:10px;
    padding:12px 20px;border-radius:50px;cursor:pointer;
    font-family:'Rubik',sans-serif;font-weight:600;font-size:15px;
    transition:transform .15s ease, box-shadow .15s ease;
    border:none;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.25);}
  .card h3{font-family:'Rubik',sans-serif;font-size:15px;font-weight:600;margin:0;}
  .card p{display:none;}

  .card.learn{background:rgba(28,110,140,0.25);border:1.5px solid var(--teal);color:var(--foam);}
  .card.game{background:rgba(239,169,74,0.18);border:1.5px solid var(--gold);color:var(--gold);}
  .card.quiz{background:rgba(226,96,79,0.18);border:1.5px solid var(--coral);color:var(--coral);}

  .panel{
    background:rgba(234,244,241,0.06);border:1px solid rgba(234,244,241,0.15);
    border-radius:10px;padding:22px;margin:18px 0;
  }

  .btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .btn{
    background:var(--gold);color:var(--deep-navy);border:none;font-weight:700;
    font-family:'Rubik',sans-serif;font-size:15px;padding:11px 26px;
    border-radius:24px;cursor:pointer;transition:transform .12s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn.secondary{background:transparent;border:1.5px solid var(--foam);color:var(--foam);}
  .btn.secondary:hover{border-color:var(--gold);color:var(--gold);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  .feedback{text-align:center;font-size:16px;font-weight:700;margin:14px 0;min-height:24px;}
  .feedback.ok{color:var(--seafoam);}
  .feedback.bad{color:var(--coral);}

  .progressdots{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
  .dot{
    width:11px;height:11px;border-radius:50%;background:rgba(234,244,241,0.25);
    border:none;padding:0;
  }
  .dot.done{background:var(--seafoam);}
  .dot.active{background:var(--gold);}
  .dot:hover{opacity:.75;}

  .mc-options{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:16px auto 0;}
  .mc-btn{
    background:rgba(234,244,241,0.08);border:1.5px solid rgba(234,244,241,0.3);
    color:var(--foam);padding:12px 16px;border-radius:8px;font-size:16px;
    cursor:pointer;font-family:'Rubik',sans-serif;
    text-align:center;
  }
  .mc-btn:hover{border-color:var(--gold);}
  .mc-btn.correct{background:rgba(72,176,140,0.3);border-color:var(--seafoam);}
  .mc-btn.wrong{background:rgba(226,96,79,0.3);border-color:var(--coral);}
  .mc-btn:disabled{cursor:default;}

  .explain-box{
    background:rgba(72,176,140,0.1);border-right:4px solid var(--seafoam);
    border-radius:6px;padding:12px 16px;margin-top:14px;text-align:right;font-size:15px;
  }

  .qmeta{text-align:center;font-size:14px;opacity:.75;margin-bottom:6px;}
  .qtitle{font-size:18px;font-weight:700;text-align:center;margin:6px 0 4px;}
  .qtext{font-size:16px;text-align:center;margin:0 0 6px;max-width:560px;margin-left:auto;margin-right:auto;}

  .scorebig{font-family:'Rubik',sans-serif;font-size:52px;color:var(--gold);text-align:center;margin:10px 0;}

  .nl-wrap{display:flex;justify-content:center;margin:16px 0;overflow-x:auto;direction:ltr;}
  .nl-wrap svg{max-width:100%;}

  .abs-input-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0;}
  .abs-input-row input{
    width:80px;padding:8px 10px;font-size:18px;border-radius:6px;border:1.5px solid var(--teal);
    text-align:center;font-family:'Rubik',sans-serif;background:var(--foam);color:var(--ink);
  }
  .abs-input-row input:focus{outline:2px solid var(--gold);}

  .mc-btns-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
  .ans-btn{
    background:rgba(234,244,241,0.1);border:1.5px solid rgba(234,244,241,0.35);
    color:var(--foam);padding:10px 20px;border-radius:8px;font-size:16px;
    cursor:pointer;font-family:'Rubik',sans-serif;font-weight:600;
    transition:border-color .12s ease, background .12s ease;
  }
  .ans-btn:hover{border-color:var(--gold);}
  .ans-btn.correct{background:rgba(72,176,140,0.3);border-color:var(--seafoam);color:var(--seafoam);}
  .ans-btn.wrong{background:rgba(226,96,79,0.3);border-color:var(--coral);color:var(--coral);}
  .ans-btn:disabled{cursor:default;}

  .instr{
    text-align:center;font-size:15px;color:var(--foam);opacity:.85;
    margin:8px 0 4px;
  }

  .video-placeholder{
    background:rgba(0,0,0,0.3);border-radius:10px;padding:60px 20px;
    margin:16px 0;color:rgba(234,244,241,0.4);font-size:15px;text-align:center;
  }

  ul.bullets{list-style:none;margin:18px 0 6px;padding:0;text-align:right;}
  ul.bullets li{position:relative;padding-right:22px;margin-bottom:10px;font-size:16px;line-height:1.55;}
  ul.bullets li::before{content:"•";color:var(--gold);position:absolute;right:0;top:0;font-size:18px;}

  .learn-note{
    background:rgba(239,169,74,0.1);border-right:4px solid var(--gold);
    border-radius:6px;padding:12px 16px;margin-top:16px;font-size:15px;text-align:right;
  }

  @keyframes popIn{
    0%{transform:scale(.55);opacity:0;}
    65%{transform:scale(1.18);opacity:1;}
    100%{transform:scale(1);}
  }

  /* Jump arc animation */
  .jump-arc { animation: drawArc 0.6s ease forwards; }
  @keyframes drawArc {
    from { stroke-dashoffset: 400; }
    to   { stroke-dashoffset: 0; }
  }

  /* Arrow chain game (sequence 3) */
  .ac-track-wrap {
    position: relative;
    width: 100%;
    touch-action: none;
    overflow-x: auto;
  }
  #arrow-track-svg {
    width: 100%;
    height: auto;
    display: block;
    user-select: none;
    -webkit-user-select: none;
    min-width: 320px;
  }
  .ac-built-line {
    text-align: right;
    font-size: 14px;
    color: rgba(234,244,241,0.65);
    margin-top: 8px;
    min-height: 20px;
  }
  .ac-built-line .val { direction: ltr; unicode-bidi: isolate; font-weight: 700; color: var(--foam); }
  .ac-tray {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    align-items: center;
    min-height: 70px;
    padding: 10px 6px 4px;
  }
  .ac-tile {
    touch-action: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .ac-tile:active { cursor: grabbing; }
  .ac-answer-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 8px 0 4px;
    direction: ltr;
  }
  .ac-answer-row input {
    width: 70px;
    text-align: center;
    font-size: 18px;
    font-family: 'Rubik', sans-serif;
    padding: 6px 8px;
    border-radius: 10px;
    border: 2px solid rgba(234,244,241,0.25);
    background: rgba(234,244,241,0.08);
    color: var(--foam);
  }
  .ac-answer-row input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  .ac-feedback {
    text-align: center;
    font-weight: 700;
    font-size: 16px;
    min-height: 24px;
    margin-bottom: 4px;
  }
  .ac-feedback.ok  { color: var(--seafoam); }
  .ac-feedback.bad { color: var(--coral); }
  .ac-score-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(234,244,241,0.07);
    border: 1.5px solid var(--gold);
    border-radius: 999px;
    padding: 4px 14px;
    font-weight: 600;
    color: var(--gold);
    font-size: 14px;
  }
  /* Rule discovery panels (sequences 4 & 5) */
  .rd-panel {
    background: rgba(234,244,241,0.06);
    border: 1px solid rgba(234,244,241,0.18);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .rd-section-title {
    font-weight: 700;
    font-size: 17px;
    color: var(--gold);
    text-align: right;
    margin: 0 0 14px;
  }
  .rd-expr-pair {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .rd-expr-box {
    flex: 1 1 200px;
    max-width: 280px;
    background: rgba(234,244,241,0.04);
    border: 1px solid rgba(234,244,241,0.15);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    direction: ltr;
    unicode-bidi: isolate;
    color: var(--foam);
  }
  .rd-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0;
  }
  .rd-option {
    text-align: right;
    background: rgba(234,244,241,0.07);
    border: 1.5px solid rgba(234,244,241,0.25);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    font-family: 'Rubik', sans-serif;
    font-size: 15px;
    color: var(--foam);
    transition: border-color .12s ease, background .12s ease;
  }
  .rd-option:hover { border-color: var(--gold); }
  .rd-option.correct { border-color: var(--seafoam); background: rgba(72,176,140,0.2); color: var(--seafoam); }
  .rd-option.incorrect { border-color: var(--coral); background: rgba(226,96,79,0.2); color: var(--coral); }
  .rd-option:disabled, .rd-option[disabled] { cursor: default; }
  .rd-explain {
    background: rgba(72,176,140,0.1);
    border-right: 4px solid var(--seafoam);
    border-radius: 6px;
    padding: 10px 14px;
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.65;
    text-align: right;
    color: var(--foam);
  }
  .rd-practice-title {
    font-weight: 700;
    font-size: 15px;
    color: rgba(234,244,241,0.8);
    text-align: right;
    margin: 16px 0 8px;
  }
  .rd-practice-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .rd-practice-expr {
    direction: ltr;
    unicode-bidi: isolate;
    font-weight: 700;
    font-size: 17px;
    color: var(--foam);
  }
  .rd-practice-input {
    width: 65px;
    text-align: center;
    font-size: 16px;
    font-family: 'Rubik', sans-serif;
    padding: 5px 8px;
    border-radius: 8px;
    border: 1.5px solid rgba(234,244,241,0.25);
    background: rgba(234,244,241,0.08);
    color: var(--foam);
  }
  .rd-practice-input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  .rd-practice-fb { font-size: 14px; font-weight: 700; }
  .rd-practice-fb.ok  { color: var(--seafoam); }
  .rd-practice-fb.bad { color: var(--coral); }

  /* Chip board */
  .chip-board { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:16px 0; }
  .chip {
    width:40px; height:40px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:20px; font-weight:700; position:relative;
    user-select:none;
  }
  .chip.pos { background:#48B08C; color:#fff; }
  .chip.neg { background:#E2604F; color:#fff; }
  .chip.dim { opacity:0.25; }
  .chip-x { position:absolute; font-size:13px; top:-4px; right:-4px;
    background:rgba(0,0,0,0.5); border-radius:50%; width:16px; height:16px;
    display:flex; align-items:center; justify-content:center; }

  /* Group sort */
  .addend-tiles { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:16px 0; }
  .addend-tile {
    padding:10px 18px; border-radius:8px; font-size:18px; font-weight:700;
    cursor:pointer; border:2px solid rgba(234,244,241,0.3);
    background:rgba(234,244,241,0.1); color:var(--foam);
    transition: background .15s, border-color .15s;
    direction:ltr; unicode-bidi:isolate;
  }
  .addend-tile.pos-group { background:rgba(72,176,140,0.3); border-color:var(--seafoam); color:var(--seafoam); }
  .addend-tile.neg-group { background:rgba(226,96,79,0.3); border-color:var(--coral); color:var(--coral); }

  .group-areas { display:flex; gap:16px; justify-content:center; margin:12px 0; flex-wrap:wrap; }
  .group-area {
    flex:1; min-width:120px; max-width:200px;
    border-radius:10px; padding:12px; text-align:center;
  }
  .group-area.pos { background:rgba(72,176,140,0.1); border:1.5px solid var(--seafoam); }
  .group-area.neg { background:rgba(226,96,79,0.1); border:1.5px solid var(--coral); }
  .group-label { font-size:13px; font-weight:700; margin-bottom:8px; }
  .group-area.pos .group-label { color:var(--seafoam); }
  .group-area.neg .group-label { color:var(--coral); }
  .group-nums { font-size:18px; font-weight:700; min-height:28px; direction:ltr; }
  .group-sums { display:flex; gap:24px; justify-content:center; font-size:17px; font-weight:700; margin:10px 0; }

  /* Dual model layout */
  .dual-models { display:flex; gap:16px; margin:14px 0; flex-wrap:wrap; }
  .dual-model-box {
    flex:1; min-width:260px;
    background:rgba(234,244,241,0.05); border:1px solid rgba(234,244,241,0.15);
    border-radius:10px; padding:14px; text-align:center;
  }
  .dual-model-label { font-size:13px; font-weight:700; color:rgba(234,244,241,0.6); margin-bottom:8px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">מספרים מכוונים</div>
  <button class="homebtn" onclick="goBack()">← חזרה</button>
</div>
<div class="wrap">
  <div id="app"></div>
</div>

<script>
/* ============ STATE ============ */
let state = {
  screen:'home',
  sequence:1,
  levelIndex:0,
  levelSub:{},
  gameScore:0,
  gameTotal:0,
  quizIndex:0,
  quizScore:0,
  quizAnswered:false,
  quizLastCorrect:null,
  shuffledOptions:[],
  quizAlt:false,
  challengeAnswers:false
};

/* ============ GAME LEVELS ============ */

const gameLevels1 = [
  {
    id:'absInput',
    title:'מדדו את המרחק',
    number:-4,
    correct:4,
    explain:'הערך המוחלט של (−4) הוא 4 — המרחק מ-0 על הציר. מרחק הוא תמיד מספר אי-שלילי.'
  },
  {
    id:'absInput',
    title:'מדדו את המרחק',
    number:-6,
    correct:6,
    explain:'הערך המוחלט של (−6) הוא 6 — המרחק מ-0 על הציר. מרחק הוא תמיד מספר אי-שלילי.'
  },
  {
    id:'absInput',
    title:'מדדו את המרחק',
    number:9,
    correct:9,
    explain:'הערך המוחלט של 9 הוא 9 — מספר חיובי שווה לעצמו. |9| = 9.'
  },
  {
    id:'absTwoPoints',
    title:'שני מספרים, ערך אחד',
    absValue:3,
    correct:[3,-3],
    explain:'גם 3 וגם (−3) נמצאים במרחק 3 יחידות מ-0 — לכן לשניהם אותו ערך מוחלט.'
  },
  {
    id:'absTwoPoints',
    title:'שני מספרים, ערך אחד',
    absValue:5,
    correct:[5,-5],
    explain:'גם 5 וגם (−5) נמצאים במרחק 5 יחידות מ-0 — לכן לשניהם אותו ערך מוחלט.'
  },
  {
    id:'absMax',
    title:'הערך המוחלט הגדול ביותר',
    numbers:[-5, 12, -3, 7],
    correct:12,
    explain:'לפי ערך מוחלט: |−5|=5, |12|=12, |−3|=3, |7|=7. הגדול ביותר הוא 12 — ולכן 12 הוא התשובה.'
  },
  {
    id:'absMax',
    title:'הערך המוחלט הגדול ביותר',
    numbers:[-8, 3, -2, 6],
    correct:-8,
    explain:'לפי ערך מוחלט: |−8|=8, |3|=3, |−2|=2, |6|=6. הגדול ביותר הוא 8 — ולכן (−8) הוא התשובה, אפילו שהוא שלילי.'
  },
  {
    id:'absMC',
    title:'מושג מסכם',
    question:'הערך המוחלט של מספר הוא...',
    options:['המספר בלי הסימן שלו','המרחק של המספר מ-0','המספר החיובי המקביל','המספר כפול (−1)'],
    correct:'המרחק של המספר מ-0',
    explain:'הגדרה מדויקת: הערך המוחלט = המרחק מ-0 על ציר המספרים. תמיד אי-שלילי, גם אם המספר המקורי שלילי.'
  }
];

const gameLevels2 = [
  {
    id:'oppClick',
    title:'מצאו את הנגדי',
    number:6,
    correct:-6,
    explain:'הנגדי של 6 הוא (−6) — אותו מרחק מ-0, כיוון הפוך.'
  },
  {
    id:'oppClick',
    title:'מצאו את הנגדי',
    number:-4,
    correct:4,
    explain:'הנגדי של (−4) הוא 4 — אותו מרחק מ-0, כיוון הפוך.'
  },
  {
    id:'oppClick',
    title:'מצאו את הנגדי',
    number:3,
    correct:-3,
    explain:'הנגדי של 3 הוא (−3) — אותו מרחק מ-0, כיוון הפוך.'
  },
  {
    id:'oppPair',
    title:'זוגות נגדיים',
    numbers:[5,-3,3,-5,2],

/* ============ NUMBER LINE SVG ============ */

function buildNumberLine({min=-12, max=12, marked=[], highlight=null, interactive=false, clickFn=null, matchedPairs=[], firstClick=null, errorNums=[], markedLabels={}}={}){
  const svgW = 600;
  const svgH = 80;
  const leftM = 30;
  const rightM = 30;
  const plotW = svgW - leftM - rightM;
  const axisY = 50;
  const totalNums = max - min; // 24
  const step = plotW / totalNums;

  function xOf(n){ return leftM + (n - min) * step; }

  let s = `<svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="font-family:Rubik,sans-serif;display:block;direction:ltr;">`;

  // Highlight segment from 0 to highlight value (coral)
  if(highlight !== null && highlight !== 0){
    const x0 = xOf(0);
    const xH = xOf(highlight);
    s += `<line x1="${x0}" y1="${axisY}" x2="${xH}" y2="${axisY}" stroke="#E2604F" stroke-width="4" stroke-linecap="round"/>`;
  }

  // Main axis line
  s += `<line x1="${leftM}" y1="${axisY}" x2="${svgW - rightM}" y2="${axisY}" stroke="rgba(234,244,241,0.7)" stroke-width="2"/>`;

  // Arrow heads
  s += `<polygon points="${svgW-rightM+2},${axisY} ${svgW-rightM-7},${axisY-5} ${svgW-rightM-7},${axisY+5}" fill="rgba(234,244,241,0.7)"/>`;
  s += `<polygon points="${leftM-2},${axisY} ${leftM+7},${axisY-5} ${leftM+7},${axisY+5}" fill="rgba(234,244,241,0.7)"/>`;

  // Tick marks and labels
  for(let n = min; n <= max; n++){
    const x = xOf(n);
    const isZero = n === 0;
    const isFive = n % 5 === 0;
    const tickH = isZero ? 14 : isFive ? 10 : 6;
    const tickW = isZero ? 2.5 : 1.5;
    s += `<line x1="${x}" y1="${axisY - tickH}" x2="${x}" y2="${axisY + tickH}" stroke="rgba(234,244,241,${isZero?0.9:0.6})" stroke-width="${tickW}"/>`;

    // Labels only at -10,-5,0,5,10
    if(n !== min && n !== max && (n === -10 || n === -5 || n === 0 || n === 5 || n === 10)){
      s += `<text x="${x}" y="${axisY + 28}" text-anchor="middle" font-size="13" fill="rgba(234,244,241,0.75)" font-family="Rubik,sans-serif">${n}</text>`;
    }
  }

  // Half-unit ticks when fractions are present
  const hasNonInt = marked.some(n => n !== Math.floor(n)) ||
                    (highlight !== null && highlight !== Math.floor(highlight));
  if(hasNonInt){
    for(let n = min; n < max; n++){
      const xh = xOf(n + 0.5);
      s += `<line x1="${xh}" y1="${axisY-5}" x2="${xh}" y2="${axisY+5}" stroke="rgba(234,244,241,0.4)" stroke-width="1"/>`;
    }
  }

  // Matched pair arcs — two arcs from 0 outward, one per side
  matchedPairs.forEach(pair => {
    const x0 = xOf(0);
    const neg = pair[0] < pair[1] ? pair[0] : pair[1];
    const pos = pair[0] < pair[1] ? pair[1] : pair[0];
    const xNeg = xOf(neg);
    const xPos = xOf(pos);
    const arcH = Math.max(14, Math.abs(pos) * 2.5);
    const mx1 = (x0 + xPos) / 2;
    const mx2 = (x0 + xNeg) / 2;
    s += `<path d="M${x0},${axisY-8} Q${mx1},${axisY-8-arcH} ${xPos},${axisY-8}" fill="none" stroke="#48B08C" stroke-width="2.5" stroke-dasharray="5,3"/>`;
    s += `<path d="M${x0},${axisY-8} Q${mx2},${axisY-8-arcH} ${xNeg},${axisY-8}" fill="none" stroke="#48B08C" stroke-width="2.5" stroke-dasharray="5,3"/>`;
  });

  // firstClick highlight
  if(firstClick !== null){
    const xfc = xOf(firstClick);
    s += `<circle cx="${xfc}" cy="${axisY}" r="11" fill="rgba(239,169,74,0.35)" stroke="#EFA94A" stroke-width="2.5"/>`;
    s += `<text x="${xfc}" y="${axisY+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#EFA94A" font-family="Rubik,sans-serif">${firstClick}</text>`;
  }

  // Marked circles
  const matchedFlat = matchedPairs.flat();
  marked.forEach(n => {
    const x = xOf(n);
    const isMatched = matchedFlat.includes(n);
    const isError = errorNums.includes(n);
    const isFirst = firstClick === n;
    if(isFirst) return; // already drawn above
    const fillColor = isMatched ? '#48B08C' : isError ? '#E2604F' : '#EFA94A';
    const strokeColor = fillColor;
    const dotLabel = markedLabels[n] !== undefined ? markedLabels[n] : n;
    const isFrac = n !== Math.floor(n);
    if(isFrac){
      // Small dot, label below axis
      s += `<circle cx="${x}" cy="${axisY}" r="6" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2"/>`;
      s += `<text x="${x}" y="${axisY+26}" text-anchor="middle" font-size="11" fill="${fillColor}" font-family="Rubik,sans-serif">${dotLabel}</text>`;
    } else {
      s += `<circle cx="${x}" cy="${axisY}" r="8" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2"/>`;
      s += `<text x="${x}" y="${axisY+4}" text-anchor="middle" font-size="11" font-weight="700" fill="${isMatched||isError?'#fff':'#0A2A43'}" font-family="Rubik,sans-serif">${dotLabel}</text>`;
    }
  });

  // Interactive click targets
  if(interactive && clickFn){
    for(let n = min + 1; n < max; n++){
      const x = xOf(n);
      s += `<circle cx="${x}" cy="${axisY}" r="14" fill="transparent" style="cursor:pointer;" onclick="window['${clickFn}'](${n})"/>`;
    }
  }

  s += `</svg>`;
  return s;
}

/* ============ GAME INIT ============ */

function startGame(){
  state.screen = 'game';
  state.levelIndex = 0;
  state.gameScore = 0;
  state.gameTotal = 0;
  state.levelSub = freshLevelSub(0);
  const firstLvl = currentGameLevels()[0];
  if(firstLvl && firstLvl.id === 'absMC') state.shuffledOptions = shuffleArr(firstLvl.options || []);
  else if(firstLvl && (firstLvl.id === 'oppZero' || firstLvl.id === 'oppAbsMC')) state.shuffledOptions = shuffleArr(firstLvl.options || []);
  else if(firstLvl && firstLvl.id === 'mc') state.shuffledOptions = shuffleArr(firstLvl.options || []);
  else if(firstLvl && firstLvl.id === 'readFracMC') state.shuffledOptions = shuffleArr(firstLvl.options || []);
  render();
}

function freshLevelSub(levelIdx){
  const lvl = currentGameLevels()[levelIdx];
  if(!lvl) return {};
  if(lvl.id === 'absTwoPoints') return {clicked:[], answered:false, correct:false, error:false};
  if(lvl.id === 'oppPair') return {firstClick:null, matched:[], answered:false, error:false};
  if(lvl.id === 'groupSort') return {groups:{}, sumSubmitted:false, answered:false, correct:false};
  if(lvl.id === 'chipProfit') return {cancelled:false, answered:false, correct:false};
  if(lvl.id === 'buildSum') return {answered:false, correct:false, buildError:null};
  if(lvl.id === 'placeNum') return {answered:false, correct:false, errorAt:null};
  if(lvl.id === 'readFracMC') return {answered:false, correct:false, picked:null};
  return {answered:false, correct:false};
}

function nextLevel(){
  state.levelIndex++;
  if(state.levelIndex >= currentGameLevels().length){
    finishGame();
    return;
  }
  state.levelSub = freshLevelSub(state.levelIndex);
  const nextLvl = currentGameLevels()[state.levelIndex];
  if(nextLvl && (nextLvl.id === 'absMC' || nextLvl.id === 'oppZero' || nextLvl.id === 'oppAbsMC')){
    state.shuffledOptions = shuffleArr(nextLvl.options || []);
  }
  if(nextLvl && nextLvl.id === 'mc') state.shuffledOptions = shuffleArr(nextLvl.options || []);
  if(nextLvl && nextLvl.id === 'readFracMC') state.shuffledOptions = shuffleArr(nextLvl.options || []);
  render();
}

function finishGame(){
  state.screen = 'gameResults';
  render();
}

/* ============ GAME RENDER ============ */

function renderGame(){
  if(state.sequence===3) return renderGameArrowChain();
  if(state.sequence===4) return renderGameRuleDiscovery4();
  if(state.sequence===5) return renderGameRuleDiscovery5();

  const lvl = currentGameLevels()[state.levelIndex];
  const levels = currentGameLevels();
  const dots = levels.map((_,i)=>{
    let cls = 'dot';
    if(i < state.levelIndex) cls += ' done';
    else if(i === state.levelIndex) cls += ' active';
    return `<div class="${cls}" onclick="jumpToLevel(${i})" style="cursor:pointer;" title="שלב ${i+1}"></div>`;
  }).join('');

  let content = '';
  if(!lvl){ content = '<p>שגיאה: אין שלב</p>'; }
  else if(lvl.id === 'absInput') content = renderAbsInput(lvl);
  else if(lvl.id === 'absTwoPoints') content = renderAbsTwoPoints(lvl);
  else if(lvl.id === 'absMax') content = renderAbsMax(lvl);
  else if(lvl.id === 'absMC') content = renderAbsMC(lvl);
  else if(lvl.id === 'oppClick') content = renderOppClick(lvl);
  else if(lvl.id === 'oppPair') content = renderOppPair(lvl);
  else if(lvl.id === 'oppZero') content = renderOppZero(lvl);
  else if(lvl.id === 'oppAbsMC') content = renderOppAbsMC(lvl);
  else if(lvl.id === 'jumpClick') content = renderJumpClick(lvl);
  else if(lvl.id === 'dragArrow') content = renderDragArrow(lvl);
  else if(lvl.id === 'chipProfit') content = renderChipProfit(lvl);
  else if(lvl.id === 'dualModel') content = renderDualModel(lvl);
  else if(lvl.id === 'typedSum' || lvl.id === 'typedSum3') content = renderTypedSum(lvl);
  else if(lvl.id === 'groupSort') content = renderGroupSort(lvl);
  else if(lvl.id === 'buildSum') content = renderBuildSum(lvl);
  else if(lvl.id === 'mc') content = renderMC(lvl);
  else if(lvl.id === 'placeNum') content = renderPlaceNum(lvl);
  else if(lvl.id === 'readFracMC') content = renderReadFracMC(lvl);

  const sub = state.levelSub || {};
  const isAnswered = !!sub.answered;
  const isLastLvl = state.levelIndex >= levels.length - 1;
  const skipBtn = (!isAnswered && !isLastLvl)
    ? `<div style="text-align:center;margin-top:10px;"><button class="btn secondary" onclick="skipLevel()" style="font-size:13px;padding:6px 18px;">דלג לתרגיל הבא ←</button></div>`
    : '';

  return `
    <div class="progressdots">${dots}</div>
    <div class="panel">
      ${content}
      ${skipBtn}
    </div>
  `;
}

function skipLevel(){
  const levels = currentGameLevels();
  if(state.levelIndex >= levels.length - 1) return;
  if(_dArrowCleanup){ _dArrowCleanup(); _dArrowCleanup = null; }
  state.levelIndex++;
  state.levelSub = freshLevelSub(state.levelIndex);
  const next = levels[state.levelIndex];
  if(next && next.options) state.shuffledOptions = shuffleArr(next.options.slice());
  render();
}

function submitAbsInput(){

  sub.answered = true;
  sub.correct = val === lvl.correct;

  state.gameTotal++;

/* ---- absTwoPoints ---- */
function renderAbsTwoPoints(lvl){
  const sub = state.levelSub;
  if(!sub.clicked) sub.clicked = [];
  const nl = buildNumberLine({
    marked: sub.clicked,
    interactive: !sub.answered,
    clickFn: 'clickAbsPoint'
  });
  let statusArea = '';
  if(sub.error){
    statusArea = `<div class="feedback bad">לא נכון — נסו שוב</div>`;
  }
  if(!sub.answered){
    statusArea += `<p class="instr">לחצו על שני המספרים שמקיימים <bdi style="direction:ltr;unicode-bidi:isolate;">|x| = ${lvl.absValue}</bdi></p>
    <p class="instr" style="opacity:.6;font-size:13px;">בחרתם: ${sub.clicked.length > 0 ? sub.clicked.map(n => bdi(n)).join(', ') : '—'}</p>`;
  } else {
    statusArea = `

      <div class="explain-box">${wrapMath(lvl.explain)}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;

    <div class="nl-wrap">${nl}</div>
    ${statusArea}
  `;
}

function clickAbsPoint(n){
  const sub = state.levelSub;
  if(sub.answered) return;
  if(!sub.clicked) sub.clicked = [];
  const idx = sub.clicked.indexOf(n);
  if(idx >= 0){ sub.clicked.splice(idx, 1); }
  else { sub.clicked.push(n); }
  const lvl = currentGameLevels()[state.levelIndex];
  if(sub.clicked.length === 2){
    const sorted1 = [...sub.clicked].sort((a,b)=>a-b);
    const sorted2 = [...lvl.correct].sort((a,b)=>a-b);
    if(sorted1[0]===sorted2[0] && sorted1[1]===sorted2[1]){
      sub.answered = true;
      sub.correct = true;
      state.gameScore++;
      state.gameTotal++;
    } else {
      sub.clicked = [];
      sub.error = true;
      setTimeout(()=>{ if(state.levelSub) state.levelSub.error = false; render(); }, 900);
    }
  }
  render();
}

function renderOppPair(lvl){

    if(!sub.error){
      statusArea = `<p class="instr">לחצו על כל זוג מספרים נגדיים (נותרו ${pairsLeft} זוגות)</p>`;
      if(sub.firstClick !== null) statusArea += `<p class="instr" style="opacity:.7;font-size:13px;">בחרתם: ${bdi(sub.firstClick)} — לחצו על הנגדי שלו</p>`;
    }
  } else {
    statusArea = `
      <div class="feedback ok">מצוין! מצאתם את כל הזוגות הנגדיים.</div>
      <div class="explain-box">${wrapMath(lvl.explain)}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;
  }
  return `
    <h2 class="qtitle">${lvl.title}</h2>
    <p class="qtext">לחצו על כל זוג מספרים נגדיים</p>
    <div class="nl-wrap">${nl}</div>
    ${statusArea}
  `;
}

function clickPairPoint(n){
  const lvl = currentGameLevels()[state.levelIndex];
  const sub = state.levelSub;
  if(!sub.matched) sub.matched = [];
  if(sub.answered) return;
  if(sub.matched.flat().includes(n)) return;
  if(sub.firstClick === null){
    sub.firstClick = n;
    sub.error = false;
  } else {
    const a = sub.firstClick;
    const b = n;
    sub.firstClick = null;
    if(a === b){ sub.error = false; render(); return; }
    const isPair = lvl.pairs.some(p => (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
    if(isPair){
      sub.matched.push([a, b]);
      sub.error = false;
      if(sub.matched.length === lvl.pairs.length){
        sub.answered = true;
        state.gameScore++;
        state.gameTotal++;
      }
    } else {
      sub.error = true;
      setTimeout(()=>{ if(state.levelSub) state.levelSub.error = false; render(); }, 900);
    }
  }
  render();
}

/* ---- buildNumberLine with jump arc ---- */
/* (Override existing to add jump support) */
const _buildNumberLineOrig = buildNumberLine;

function buildNumberLineWithJump({min=-12, max=12, marked=[], highlight=null, interactive=false, clickFn=null, matchedPairs=[], firstClick=null, errorNums=[], markedLabels={}, jump=null, jumpDone=false}={}){
  const svgW = 600;
  const svgH = 80;
  const leftM = 30;
  const rightM = 30;
  const plotW = svgW - leftM - rightM;
  const axisY = 50;
  const totalNums = max - min;
  const step = plotW / totalNums;

  function xOf(n){ return leftM + (n - min) * step; }

  let s = `<svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="font-family:Rubik,sans-serif;display:block;direction:ltr;">`;

  if(highlight !== null && highlight !== 0){
    const x0 = xOf(0);
    const xH = xOf(highlight);
    s += `<line x1="${x0}" y1="${axisY}" x2="${xH}" y2="${axisY}" stroke="#E2604F" stroke-width="4" stroke-linecap="round"/>`;
  }

  s += `<line x1="${leftM}" y1="${axisY}" x2="${svgW - rightM}" y2="${axisY}" stroke="rgba(234,244,241,0.7)" stroke-width="2"/>`;
  s += `<polygon points="${svgW-rightM+2},${axisY} ${svgW-rightM-7},${axisY-5} ${svgW-rightM-7},${axisY+5}" fill="rgba(234,244,241,0.7)"/>`;
  s += `<polygon points="${leftM-2},${axisY} ${leftM+7},${axisY-5} ${leftM+7},${axisY+5}" fill="rgba(234,244,241,0.7)"/>`;

  for(let n = min; n <= max; n++){
    const x = xOf(n);
    const isZero = n === 0;
    const isFive = n % 5 === 0;
    const tickH = isZero ? 14 : isFive ? 10 : 6;
    const tickW = isZero ? 2.5 : 1.5;
    s += `<line x1="${x}" y1="${axisY - tickH}" x2="${x}" y2="${axisY + tickH}" stroke="rgba(234,244,241,${isZero?0.9:0.6})" stroke-width="${tickW}"/>`;
    if(n !== min && n !== max && (n === -10 || n === -5 || n === 0 || n === 5 || n === 10)){
      s += `<text x="${x}" y="${axisY + 28}" text-anchor="middle" font-size="13" fill="rgba(234,244,241,0.75)" font-family="Rubik,sans-serif">${n}</text>`;
    }
  }

  matchedPairs.forEach(pair => {
    const x0 = xOf(0);
    const neg = pair[0] < pair[1] ? pair[0] : pair[1];
    const pos = pair[0] < pair[1] ? pair[1] : pair[0];
    const xNeg = xOf(neg);
    const xPos = xOf(pos);
    const arcH = Math.max(14, Math.abs(pos) * 2.5);
    const mx1 = (x0 + xPos) / 2;
    const mx2 = (x0 + xNeg) / 2;
    s += `<path d="M${x0},${axisY-8} Q${mx1},${axisY-8-arcH} ${xPos},${axisY-8}" fill="none" stroke="#48B08C" stroke-width="2.5" stroke-dasharray="5,3"/>`;
    s += `<path d="M${x0},${axisY-8} Q${mx2},${axisY-8-arcH} ${xNeg},${axisY-8}" fill="none" stroke="#48B08C" stroke-width="2.5" stroke-dasharray="5,3"/>`;
  });

  // Jump arc
  if(jump !== null){
    const xFrom = xOf(jump.from);
    const xTo = xOf(jump.to);
    const arcH = Math.min(35, Math.max(18, Math.abs(jump.to - jump.from) * 2));
    const mx = (xFrom + xTo) / 2;
    const markerId = `jmp${jump.from}_${jump.to}`.replace(/-/g,'n');

    // Always show the "from" dot in gold
    s += `<circle cx="${xFrom}" cy="${axisY}" r="8" fill="#EFA94A" stroke="#EFA94A" stroke-width="2"/>`;
    s += `<text x="${xFrom}" y="${axisY+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#0A2A43" font-family="Rubik,sans-serif">${jump.from}</text>`;

    if(jumpDone){
      const arrowY = axisY - 12;
      s += `<defs>
        <marker id="${markerId}" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#EFA94A"/>
        </marker>
      </defs>`;
      s += `<line x1="${xFrom}" y1="${arrowY}" x2="${xTo}" y2="${arrowY}"
        stroke="#EFA94A" stroke-width="3"
        marker-end="url(#${markerId})"
        stroke-dasharray="500 500" stroke-dashoffset="500">
        <animate attributeName="stroke-dashoffset" from="500" to="0" dur="0.5s" fill="freeze"/>
      </line>`;
      // "to" dot in green
      s += `<circle cx="${xTo}" cy="${axisY}" r="8" fill="#48B08C" stroke="#48B08C" stroke-width="2"/>`;
      s += `<text x="${xTo}" y="${axisY+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Rubik,sans-serif">${jump.to}</text>`;
    }
  }

  if(firstClick !== null){
    const xfc = xOf(firstClick);
    s += `<circle cx="${xfc}" cy="${axisY}" r="11" fill="rgba(239,169,74,0.35)" stroke="#EFA94A" stroke-width="2.5"/>`;
    s += `<text x="${xfc}" y="${axisY+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#EFA94A" font-family="Rubik,sans-serif">${firstClick}</text>`;
  }

  const matchedFlat = matchedPairs.flat();
  marked.forEach(n => {
    const x = xOf(n);
    const isMatched = matchedFlat.includes(n);
    const isError = errorNums.includes(n);
    const isFirst = firstClick === n;
    // Skip if this is the jump.from (already drawn)
    if(jump !== null && n === jump.from) return;
    if(isFirst) return;
    const fillColor = isMatched ? '#48B08C' : isError ? '#E2604F' : '#EFA94A';
    const strokeColor = isMatched ? '#48B08C' : isError ? '#E2604F' : '#EFA94A';
    const dotLabel = markedLabels[n] !== undefined ? markedLabels[n] : n;
    s += `<circle cx="${x}" cy="${axisY}" r="8" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2"/>`;
    s += `<text x="${x}" y="${axisY+4}" text-anchor="middle" font-size="11" font-weight="700" fill="${isMatched||isError?'#fff':'#0A2A43'}" font-family="Rubik,sans-serif">${dotLabel}</text>`;
  });

  if(interactive && clickFn){
    for(let n = min + 1; n < max; n++){
      const x = xOf(n);
      s += `<circle cx="${x}" cy="${axisY}" r="14" fill="transparent" style="cursor:pointer;" onclick="window['${clickFn}'](${n})"/>`;
    }
  }

  s += `</svg>`;
  return s;
}

/* ---- chipBoard ---- */
function buildChipBoard(pos, neg, cancelled=false){
  const pairs = Math.min(pos, neg);
  let html = '<div class="chip-board">';
  if(cancelled){
    for(let i=0;i<pairs;i++){
      html += `<div class="chip pos dim">+<span class="chip-x">×</span></div>`;
      html += `<div class="chip neg dim">−<span class="chip-x">×</span></div>`;
    }
    for(let i=0;i<pos-pairs;i++) html += `<div class="chip pos">+</div>`;
    for(let i=0;i<neg-pairs;i++) html += `<div class="chip neg">−</div>`;
  } else {
    for(let i=0;i<pos;i++) html += `<div class="chip pos">+</div>`;
    for(let i=0;i<neg;i++) html += `<div class="chip neg">−</div>`;
  }
  html += '</div>';
  return html;
}

/* ---- jumpClick ---- */
function renderJumpClick(lvl){
  const sub = state.levelSub;
  if(!sub) return '';
  const absAddend = Math.abs(lvl.addend);
  const dirHe = lvl.addend < 0 ? 'שמאלה' : 'ימינה';
  const startDisp = lvl.start < 0 ? bdi('(−' + Math.abs(lvl.start) + ')') : bdi(lvl.start);
  const exprStr = lvl.addend < 0
    ? `${startDisp} + ${bdi('(−' + absAddend + ')')}`
    : `${startDisp} + ${bdi(lvl.addend)}`;
  const nl = buildNumberLineWithJump({
    jump:{from:lvl.start, to:lvl.correct},
    jumpDone: !!(sub.answered && sub.correct),
    interactive: !sub.answered,
    clickFn: 'clickJump',
    errorNums: sub.errorAt != null ? [sub.errorAt] : []
  });

  let answerArea = '';
  if(!sub.answered){
    answerArea = `<p class="instr">לחצו על נקודת הנחיתה של הקפיצה</p>`;
  } else {
    answerArea = `
      <div class="feedback ok">נכון! מסיימים ב-${bdi(lvl.correct)}.</div>
      <div class="explain-box">${wrapMath(lvl.explain)}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;
  }
  return `
    <h2 class="qtitle">${lvl.title}</h2>
    <p class="qtext">מתחילים ב-${bdi(lvl.start)}, קופצים ${absAddend} יחידות ${dirHe}</p>
    <p class="qtext" style="font-size:20px;font-weight:700;direction:ltr;unicode-bidi:embed;">${exprStr} = ?</p>
    <div class="nl-wrap">${nl}</div>
    ${answerArea}
  `;
}

function clickJump(n){
  const lvl = currentGameLevels()[state.levelIndex];
  const sub = state.levelSub;
  if(sub.answered) return;
  if(n === lvl.correct){
    sub.answered = true;
    sub.correct = true;
    state.gameScore++;
    state.gameTotal++;
    render();
  } else {
    sub.errorAt = n;
    render();
    setTimeout(()=>{ if(state.levelSub) state.levelSub.errorAt = null; render(); }, 700);
  }
}

/* ---- dragArrow ---- */
let _dArrowCleanup = null;

function renderDragArrow(lvl){
  const sub = state.levelSub;
  const MIN = -12, MAX = 12, SVG_W = 600, SVG_H = 132;
  const LEFT_M = 30, STEP = (SVG_W - 60) / (MAX - MIN); // 22.5
  const AXIS_Y = 96, A1Y = 72, A2Y = 46; // axis, arrow-1 row, arrow-2 row
  function xOf(n){ return LEFT_M + (n - MIN) * STEP; }

  const xOrigin = xOf(0);
  const xStart  = xOf(lvl.start);
  const snapped = (sub.snapped !== null && sub.snapped !== undefined) ? sub.snapped : null;
  const xHead   = snapped !== null ? xOf(snapped) : xStart;

  // Green for rightward (positive), red for leftward (negative)
  const C_GREEN = '#48B08C', C_RED = '#E2604F';
  const color1 = lvl.start  >= 0 ? C_GREEN : C_RED;
  const color2 = lvl.addend >= 0 ? C_GREEN : C_RED;
  const MK1 = 'da1Mk', MK2 = 'da2Mk';

  let s = '';

  // Axis
  s += `<line x1="${LEFT_M}" y1="${AXIS_Y}" x2="${SVG_W-LEFT_M}" y2="${AXIS_Y}" stroke="rgba(234,244,241,0.7)" stroke-width="2"/>`;
  s += `<polygon points="${SVG_W-LEFT_M+2},${AXIS_Y} ${SVG_W-LEFT_M-7},${AXIS_Y-5} ${SVG_W-LEFT_M-7},${AXIS_Y+5}" fill="rgba(234,244,241,0.7)"/>`;
  s += `<polygon points="${LEFT_M-2},${AXIS_Y} ${LEFT_M+7},${AXIS_Y-5} ${LEFT_M+7},${AXIS_Y+5}" fill="rgba(234,244,241,0.7)"/>`;
  // Ticks
  for(let n = MIN; n <= MAX; n++){
    const x = xOf(n), iz = n===0, i5 = n%5===0;
    const th = iz?14:i5?10:6, tw = iz?2.5:1.5;
    s += `<line x1="${x}" y1="${AXIS_Y-th}" x2="${x}" y2="${AXIS_Y+th}" stroke="rgba(234,244,241,${iz?0.9:0.6})" stroke-width="${tw}"/>`;
    if(n!==MIN && n!==MAX && (n===-10||n===-5||n===0||n===5||n===10))
      s += `<text x="${x}" y="${AXIS_Y+24}" text-anchor="middle" font-size="13" fill="rgba(234,244,241,0.75)" font-family="Rubik,sans-serif">${n}</text>`;
  }

  // --- ARROW 1 (fixed): 0 → start ---
  s += `<defs><marker id="${MK1}" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="${color1}"/></marker></defs>`;
  s += `<line x1="${xOrigin}" y1="${A1Y}" x2="${xStart}" y2="${A1Y}" stroke="${color1}" stroke-width="3" marker-end="url(#${MK1})"/>`;
  // Dot at 0 (tail of arrow 1)
  s += `<circle cx="${xOrigin}" cy="${AXIS_Y}" r="5" fill="rgba(234,244,241,0.45)" stroke="rgba(234,244,241,0.7)" stroke-width="1.5"/>`;
  // Dot at start (head of arrow 1 / tail of arrow 2)
  s += `<circle cx="${xStart}" cy="${AXIS_Y}" r="7" fill="${color1}" stroke="${color1}" stroke-width="2"/>`;
  // Dashed vertical connector from arrow-1 head to arrow-2 tail
  s += `<line x1="${xStart}" y1="${A1Y}" x2="${xStart}" y2="${A2Y+2}" stroke="rgba(234,244,241,0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>`;
  // Start label at head of arrow 1 (below the arrow line)
  const startLbl = lvl.start<0?`(−${Math.abs(lvl.start)})`:String(lvl.start);
  s += `<text x="${xStart}" y="${A1Y+16}" text-anchor="middle" font-size="11" fill="${color1}" font-weight="700" font-family="Rubik,sans-serif">${startLbl}</text>`;
  // Size label for arrow 1: |start| shown below the arrow, between arrow 1 and axis
  const xMid1 = (xOrigin + xStart) / 2;
  s += `<text x="${xMid1}" y="${A1Y+10}" text-anchor="middle" font-size="12" fill="${color1}" font-weight="600" font-family="Rubik,sans-serif">|${Math.abs(lvl.start)}|</text>`;

  // Size label for arrow 2: |addend| shown below arrow 2, between arrow 2 and arrow 1
  const xMid2 = (xStart + xOf(lvl.correct)) / 2;
  s += `<text x="${xMid2}" y="${A2Y+12}" text-anchor="middle" font-size="12" fill="${color2}" font-weight="600" font-family="Rubik,sans-serif">|${Math.abs(lvl.addend)}|</text>`;

  // --- ARROW 2 ---
  s += `<defs><marker id="${MK2}" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="${color2}"/></marker></defs>`;

  if(sub.answered){
    const xTo = xOf(lvl.correct);
    s += `<line x1="${xStart}" y1="${A2Y}" x2="${xTo}" y2="${A2Y}" stroke="${color2}" stroke-width="3" marker-end="url(#${MK2})" stroke-dasharray="500 500" stroke-dashoffset="500"><animate attributeName="stroke-dashoffset" from="500" to="0" dur="0.5s" fill="freeze"/></line>`;
    const resLbl = lvl.correct<0?`(−${Math.abs(lvl.correct)})`:String(lvl.correct);
    s += `<circle cx="${xTo}" cy="${AXIS_Y}" r="7" fill="${color2}" stroke="${color2}" stroke-width="2"/>`;
    s += `<text x="${xTo}" y="${AXIS_Y+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Rubik,sans-serif">${resLbl}</text>`;
    s += `<text x="${xTo}" y="${A2Y-22}" text-anchor="middle" font-size="12" fill="${color2}" font-weight="700" font-family="Rubik,sans-serif">${resLbl}</text>`;
  } else {
    const showA2 = snapped !== null && snapped !== lvl.start;
    s += `<line id="dArrowLine" x1="${xStart}" y1="${A2Y}" x2="${xHead}" y2="${A2Y}" stroke="${color2}" stroke-width="3" marker-end="url(#${MK2})" opacity="${showA2?1:0}"/>`;
    // Draggable head circle
    s += `<circle id="dHead" cx="${xHead}" cy="${A2Y}" r="15" fill="${color2}" fill-opacity="${showA2?0.6:0.15}" stroke="${color2}" stroke-width="2.5" style="cursor:grab;"/>`;
    // Label above head (current snapped value)
    const headL = showA2 ? (snapped<0?`(−${Math.abs(snapped)})`:String(snapped)) : '?';
    s += `<text id="dLabel" x="${xHead}" y="${A2Y-22}" text-anchor="middle" font-size="14" font-weight="700" fill="${color2}" font-family="Rubik,sans-serif">${headL}</text>`;
  }

  const absA = Math.abs(lvl.addend), dirHe = lvl.addend<0?'שמאלה':'ימינה';
  const startD = lvl.start<0?bdi('(−'+Math.abs(lvl.start)+')'): bdi(lvl.start);
  const addD   = lvl.addend<0?bdi('(−'+absA+')'):bdi(lvl.addend);

  let answerArea = '';
  if(!sub.answered){
    answerArea = `
      <p class="instr">גררו את ראש החץ ${dirHe} אל נקודת הנחיתה</p>
      ${sub.error?`<div class="feedback bad">לא מדויק — נסו שוב</div>`:''}
      ${snapped!==null&&!sub.error?`<div class="btnrow"><button class="btn" onclick="submitDragArrow()">אשרו תשובה</button></div>`:''}`;
  } else {
    answerArea = `
      <div class="feedback ok">נכון! מסיימים ב-${bdi(lvl.correct)}.</div>
      <div class="explain-box">${wrapMath(lvl.explain)}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;
  }
  if(!sub.answered) setTimeout(()=>initDragArrow(MIN,MAX,STEP,LEFT_M,SVG_W,lvl.start),0);

  return `
    <h2 class="qtitle">${lvl.title}</h2>
    <p class="qtext" style="font-size:20px;font-weight:700;direction:ltr;unicode-bidi:embed;">${startD} + ${addD} = ?</p>
    <div class="nl-wrap"><svg id="dragNL" viewBox="0 0 ${SVG_W} ${SVG_H}" style="width:100%;display:block;direction:ltr;" xmlns="http://www.w3.org/2000/svg">${s}</svg></div>
    ${answerArea}
  `;
}

function initDragArrow(MIN,MAX,STEP,LEFT_M,SVG_W,startN){
  if(_dArrowCleanup){ _dArrowCleanup(); _dArrowCleanup=null; }
  const svg = document.getElementById('dragNL');
  const head = document.getElementById('dHead');
  if(!svg||!head) return;
  let dragging = false;
  function xOf(n){ return LEFT_M+(n-MIN)*STEP; }
  function toN(cx){
    const r=svg.getBoundingClientRect(), sc=SVG_W/r.width;
    const sx=(cx-r.left)*sc;
    return Math.max(MIN+1,Math.min(MAX-1,Math.round(MIN+(sx-LEFT_M)/STEP)));
  }
  function updateDOM(cx){
    const n=toN(cx), x=xOf(n);
    const ln=document.getElementById('dArrowLine'), lb=document.getElementById('dLabel'), hd=document.getElementById('dHead');
    if(hd) hd.setAttribute('cx',x);
    if(ln){ ln.setAttribute('x2',x); ln.setAttribute('opacity',n!==startN?'1':'0'); }
    if(lb){ lb.setAttribute('x',x); lb.textContent=n<0?`(−${Math.abs(n)})`:String(n); }
    return n;
  }
  function onDown(e){ dragging=true; e.preventDefault(); }
  function onMove(e){ if(!dragging) return; updateDOM(e.touches?e.touches[0].clientX:e.clientX); e.preventDefault(); }
  function onUp(e){
    if(!dragging) return;
    dragging=false;
    const cx=e.changedTouches?e.changedTouches[0].clientX:e.clientX;
    const n=updateDOM(cx);
    cleanup();
    if(state.levelSub) state.levelSub.snapped=n;
    render();
    setTimeout(()=>initDragArrow(MIN,MAX,STEP,LEFT_M,SVG_W,startN),0);
  }
  function cleanup(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onUp);
    const h=document.getElementById('dHead');
    if(h){ h.removeEventListener('mousedown',onDown); h.removeEventListener('touchstart',onDown); }
  }
  _dArrowCleanup=cleanup;
  head.addEventListener('mousedown',onDown);
  head.addEventListener('touchstart',onDown,{passive:false});
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onUp);
}

function submitDragArrow(){
  const lvl=currentGameLevels()[state.levelIndex];
  const sub=state.levelSub;
  if(sub.snapped===null||sub.snapped===undefined) return;
  if(sub.snapped===lvl.correct){
    sub.answered=true; sub.correct=true;
    state.gameScore++; state.gameTotal++;
    render();
  } else {
    sub.error=true;
    if(_dArrowCleanup){ _dArrowCleanup(); _dArrowCleanup=null; }
    render();
    setTimeout(()=>{
      if(state.levelSub){ state.levelSub.error=false; render(); setTimeout(()=>initDragArrow(-12,12,22.5,30,600,lvl.start),0); }
    },900);
  }
}

/* ---- chipProfit ---- */
function renderChipProfit(lvl){
  const sub = state.levelSub;
  const isCancelled = sub.cancelled || sub.answered;
  const pairs = Math.min(lvl.pos, lvl.neg);
  const remaining = Math.abs(lvl.correct);

  let answerArea = '';
  if(!sub.answered){
    if(!sub.cancelled){
      answerArea = `
        <div class="btnrow">
          <button class="btn" onclick="cancelChipPairs()">בטלו זוגות ✕</button>
        </div>`;
    } else {
      // Generate MC options: correct, wrong-sign, total-pos, neg-total
      const rawOpts = [lvl.correct, -lvl.correct, lvl.pos, -lvl.neg];
      const chipMCOpts = shuffleArr([...new Set(rawOpts)].slice(0, 4));
      const chipBtns = chipMCOpts.map(opt => {
        let cls = 'mc-btn';
        if(sub.chipPicked !== undefined){
          if(opt === lvl.correct) cls += ' correct';
          else if(opt === sub.chipPicked) cls += ' wrong';
        }
        const lbl = opt < 0 ? `(−${Math.abs(opt)})` : String(opt);
        return `<button class="${cls}" onclick="answerChipMC(${opt})" ${sub.chipPicked!==undefined?'disabled':''}>${lbl}</button>`;
      }).join('');
      answerArea = `
        <p class="qtext">נשארו ${remaining} צ׳יפים — מה הסכום?</p>
        <div class="mc-options">${chipBtns}</div>
        ${sub.chipWrong ? '<div class="feedback bad">לא מדויק.</div>' : ''}`;
    }
  } else {
    answerArea = `
      <div class="feedback ${sub.correct?'ok':'bad'}">${sub.correct?'נכון!':'לא מדויק. התשובה: '+bdi(lvl.correct)}</div>
      <div class="explain-box">${wrapMath(lvl.explain)}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;
  }
  return `
    <h2 class="qtitle">${lvl.title}</h2>
    <p class="qtext">${lvl.scenario}</p>
    ${buildChipBoard(lvl.pos, lvl.neg, isCancelled)}
    ${answerArea}
  `;
}

function cancelChipPairs(){

function answerChipMC(val){

/* ---- groupSort (sequence 5) ---- */
function renderGroupSort(lvl){
  const sub = state.levelSub;
  if(!sub.groups) sub.groups = {};

  const tiles = lvl.addends.map((n,i) => {
    let cls = 'addend-tile';
    if(sub.groups[i] === 'pos') cls += ' pos-group';
    else if(sub.groups[i] === 'neg') cls += ' neg-group';
    return `<div class="${cls}" onclick="toggleGroup(${i})">${n >= 0 ? n : '(−'+Math.abs(n)+')'}</div>`;
  }).join('');

  const posNums = lvl.addends.filter((_,i) => sub.groups[i]==='pos');
  const negNums = lvl.addends.filter((_,i) => sub.groups[i]==='neg');
  const posSum = posNums.reduce((a,b)=>a+b,0);
  const negSum = negNums.reduce((a,b)=>a+b,0);
  const allAssigned = lvl.addends.every((_,i) => sub.groups[i]==='pos' || sub.groups[i]==='neg');

  let content = '';
  if(!sub.sumSubmitted){
    content = `
      <p class="instr">לחצו על כל מחובר כדי לשייכו לחיוביים (ירוק) או שליליים (אדום)</p>

        </div>
        <div class="group-area neg">
          <div class="group-label">שליליים −</div>
          <div class="group-nums">${negNums.map(n=>'(−'+Math.abs(n)+')').join(', ') || '—'}</div>
        </div>
      </div>
      <div class="btnrow">
        <button class="btn" onclick="submitGroups()" ${allAssigned?'':'disabled'}>חשבו ←</button>
      </div>`;
  } else if(!sub.answered){
    content = `
      <div class="group-sums">
        <span style="color:var(--seafoam);">חיוביים: ${posSum}</span>
        <span style="color:var(--coral);">שליליים: ${negSum}</span>
      </div>
      <p class="qtext">מה הסכום הכולל?</p>
      <div class="abs-input-row">
        <input type="number" id="groupSumInput" placeholder="?" style="width:80px;">
        <button class="btn" onclick="submitGroupSum()">בדיקה</button>
      </div>`;
  } else {
    content = `
      <div class="feedback ${sub.correct?'ok':'bad'}">${sub.correct?'נכון!':'לא מדויק. התשובה: '+bdi(lvl.correct)}</div>
      <div class="explain-box">${wrapMath(lvl.explain)}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;
  }
  return `
    <h2 class="qtitle">${lvl.title}</h2>
    ${content}
  `;
}

function submitBuildSum(){
  const lvl = currentGameLevels()[state.levelIndex];
  const sub = state.levelSub;
  const field = document.getElementById('buildInput');
  const raw = field ? field.value : '';
  const parts = raw.split(',').map(s => s.trim()).filter(s => s !== '');
  const nums = parts.map(s => parseInt(s));
  if(nums.some(isNaN)){ sub.buildError = 'יש ערכים לא תקינים — כתבו מספרים שלמים מופרדים בפסיק.'; render(); return; }
  if(nums.length < lvl.minAddends){ sub.buildError = `יש להזין לפחות ${lvl.minAddends} מחוברים.`; render(); return; }
  if(lvl.requireNeg && !nums.some(n => n < 0)){ sub.buildError = 'יש לכלול לפחות מחובר שלילי אחד.'; render(); return; }
  const sum = nums.reduce((a,b)=>a+b,0);
  if(sum !== lvl.target){ sub.buildError = `הסכום שלכם הוא ${sum}, לא ${lvl.target}. נסו שוב.`; render(); return; }
  sub.answered = true;
  sub.correct = true;
  sub.userExpr = parts.join(' + ');
  state.gameScore++;
  state.gameTotal++;
  render();
}

/* ============ QUIZ ============ */

function shuffleArr(arr){
  const a = [...arr];
  for(let i = a.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function wrapMath(str){
  if(!str) return str;
  return str
    .replace(/\|[^|]+\|/g, m => `<bdi style="direction:ltr;unicode-bidi:isolate;">${m}</bdi>`)
    .replace(/\([-−][^)]+\)/g, m => `<bdi style="direction:ltr;unicode-bidi:isolate;">${m}</bdi>`);
}
/* Wrap an MC option for display: if it has no Hebrew letters it's a math expression → force LTR */
function wrapOpt(opt){
  if(!/[\u05d0-\u05ea]/.test(opt)){
    return `<span style="direction:ltr;unicode-bidi:embed;display:inline-block;">${wrapMath(opt)}</span>`;
  }
  return wrapMath(opt);
}

function bdi(n){ return `<bdi style="direction:ltr;unicode-bidi:isolate;">${n}</bdi>`; }

function startQuiz(){
  state.quizAlt = false;
  startQuizInternal();
}

function startQuizAlt(){
  state.quizAlt = true;

function startQuizInternal(){
  state.screen = 'quiz';
  state.quizIndex = 0;
  state.quizScore = 0;
  state.quizAnswered = false;

  const dots = currentQuizQuestions().map((_,i) => {
    let cls = 'dot';
    if(i < state.quizIndex) cls += ' done';
    else if(i === state.quizIndex) cls += ' active';
    return `<div class="${cls}"></div>`;
  }).join('');

  let answerArea;
  if(q.type === 'input'){
    answerArea = `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:16px;">
      <input id="quiz-input" type="number" step="any" inputmode="decimal"
        style="font-size:22px;padding:10px 18px;border-radius:10px;border:1.5px solid rgba(234,244,241,0.3);background:rgba(234,244,241,0.08);color:var(--foam);font-family:'Rubik',sans-serif;text-align:center;width:140px;"
        placeholder="?" ${state.quizAnswered?'disabled':''}

      ${!state.quizAnswered ? `<button class="btn" onclick="submitQuizInput()">בדוק</button>` : ''}
    </div>`;
  } else {
    const opts = state.shuffledOptions && state.shuffledOptions.length ? state.shuffledOptions : q.options;
    answerArea = `<div class="mc-options">
      ${opts.map(opt => `<button class="mc-btn" id="opt-${safeId(opt)}" onclick="answerQuizMC('${escOpt(opt)}')" ${state.quizAnswered?'disabled':''}>${wrapOpt(opt)}</button>`).join('')}
    </div>`;
  }

  const isLast = state.quizIndex === currentQuizQuestions().length - 1;

  return `
    <div class="progressdots">${dots}</div>
    <div class="panel">
      <div class="qmeta">שאלה ${state.quizIndex+1} מתוך ${currentQuizQuestions().length}</div>
      <h2 class="qtitle">${wrapMath(q.title)}</h2>
      <p class="qtext"${/= \?$/.test(q.text) ? ' style="direction:ltr;unicode-bidi:embed;"' : ''}>${wrapMath(q.text)}</p>
      ${answerArea}
      ${state.quizAnswered ? `
        <div class="explain-box"><strong>${state.quizLastCorrect ? 'תשובה נכונה!' : `לא מדויק. התשובה הנכונה: <bdi style="direction:ltr;unicode-bidi:embed;">${q.correct}</bdi>`}</strong> ${wrapMath(q.explain)}</div>
        <div class="btnrow"><button class="btn" onclick="${isLast ? 'finishQuiz()' : 'nextQuizQuestion()'}">${isLast ? 'לתוצאות' : 'לשאלה הבאה'}</button></div>
      ` : ''}
    </div>
  `;
}

function answerQuizMC(opt){
  if(state.quizAnswered) return;
  const q = currentQuizQuestions()[state.quizIndex];
  state.quizAnswered = true;
  const correct = (opt === q.correct);
  state.quizLastCorrect = correct;
  if(correct) state.quizScore++;
  document.querySelectorAll('.mc-btn').forEach(btn => {
    btn.disabled = true;
    if(btn.textContent === q.correct) btn.classList.add('correct');
    else if(btn.textContent === opt && !correct) btn.classList.add('wrong');
  });
  setTimeout(render, 350);
}

function submitQuizInput(){
  if(state.quizAnswered) return;
  const q = currentQuizQuestions()[state.quizIndex];
  const input = document.getElementById('quiz-input');
  if(!input || input.value === '') return;
  const val = parseFloat(input.value.replace(',', '.'));
  const correct = (val === parseFloat(q.correct));
  state.quizAnswered = true;
  state.quizLastCorrect = correct;
  if(correct) state.quizScore++;
  render();
}

function nextQuizQuestion(){
  state.quizIndex++;
  state.quizAnswered = false;
  state.quizLastCorrect = null;
  const q = currentQuizQuestions()[state.quizIndex];
  state.shuffledOptions = shuffleArr(q.options || []);
  render();
}

function finishQuiz(){
  state.screen = 'quizResults';
  render();
}

/* ============ QUIZ RESULTS ============ */

function renderQuizResults(){
  const total = currentQuizQuestions().length;
  const pct = Math.round((state.quizScore / total) * 100);
  let msg = 'המשך להתאמן, אתם בדרך הנכונה!';
  if(pct >= 85) msg = 'כל הכבוד! שליטה מעולה בחומר.';
  else if(pct >= 60) msg = 'עבודה טובה! עוד קצת תרגול ותהיו מומחים.';
  return `
    <div class="panel" style="text-align:center;">
      <h2 class="qtitle">תוצאות מבדק שליטה</h2>
      <div class="scorebig" dir="ltr">${state.quizScore} / ${total}</div>
      <p class="qtext">${msg}</p>
      <div class="btnrow">
        <button class="btn" onclick="startQuiz()">לנסות שוב</button>
        <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
      </div>
    </div>
  `;
}

function initArrowChainGame(){
  const PX = 26;
  const X0 = 400;
  const BASE_OFFSET = 56;
  const ROW_GAP = 34;
  const TOP_MARGIN = 26;
  const BOTTOM_MARGIN = 40;
  const TRAY_PX = 20;
  const TILE_H = 46;

  let AXIS_Y = BASE_OFFSET + TOP_MARGIN;

  const svg = document.getElementById('arrow-track-svg');
  const axisLayer = document.getElementById('arrow-axis-layer');
  const chainLayer = document.getElementById('arrow-chain-layer');
  const tipLayer = document.getElementById('arrow-tip-layer');
  const trayEl = document.getElementById('arrow-tray');
  const exprEl = document.getElementById('arrow-exercise-expr');
  const builtLineEl = document.getElementById('arrow-built-line');
  const feedbackEl = document.getElementById('arrow-feedback');
  const answerInput = document.getElementById('arrow-answer-input');
  const scoreEl = document.getElementById('arrow-score');

  if(!svg || !trayEl) return;

  let acState = {
    terms: [],
    trayItems: [],
    chain: [],
    score: 0,
    solvedThisRound: false,
    revealed: false
  };

  function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function randNonZero(min, max){ let v=0; while(v===0){v=randInt(min,max);} return v; }

  function generateExercise(){
    let terms, ok=false, guard=0;
    while(!ok && guard<500){
      guard++;
      const n = Math.random()<0.55?2:3;
      terms = [];
      for(let i=0;i<n;i++) terms.push(randNonZero(-9,9));
      let running=0, within=true;
      for(const t of terms){ running+=t; if(Math.abs(running)>10){within=false;break;} }
      if(within && Math.abs(running)<=9) ok=true;
    }
    return terms;
  }

  function generateDecoys(terms){
    const decoys=[];
    let guard=0;
    while(decoys.length<2 && guard<200){
      guard++;
      const v=randNonZero(-9,9);
      if(!terms.includes(v)&&!decoys.includes(v)) decoys.push(v);
    }
    return decoys;
  }

  function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function fmtSigned(v){ return v>0?('+'+v):String(v); }
  function formatTerm(v){ return v<0?('('+v+')'):String(v); }

  function renderExpression(){
    exprEl.innerHTML='';
    acState.terms.forEach((t,idx)=>{
      if(idx>0){
        const op=document.createElement('span');
        op.style.color='rgba(234,244,241,0.6)';
        op.style.margin='0 6px';
        op.textContent='+';
        exprEl.appendChild(op);
      }
      const span=document.createElement('span');
      span.style.color = t<0?'#E2604F':'#48B08C';
      span.textContent=formatTerm(t);
      exprEl.appendChild(span);
    });
    const eq=document.createElement('span');
    eq.style.color='rgba(234,244,241,0.6)';
    eq.style.marginLeft='6px';
    eq.textContent='= ?';
    exprEl.appendChild(eq);
  }

  function floorY(i){ return AXIS_Y-BASE_OFFSET-i*ROW_GAP; }

  function computeMaxFloor(chain){
    if(chain.length===0) return 0;
    let floor=0, prevSign=null;
    chain.forEach((item,idx)=>{
      const sign=item.value<0?-1:1;
      if(idx>0&&sign!==prevSign) floor+=1;
      prevSign=sign;
    });
    return floor;
  }

  function updateLayout(){
    const maxFloor=computeMaxFloor(acState.chain);
    AXIS_Y=BASE_OFFSET+maxFloor*ROW_GAP+TOP_MARGIN;
    svg.setAttribute('viewBox',`0 0 800 ${AXIS_Y+BOTTOM_MARGIN}`);
    drawAxis();
    drawChain();
  }

  function drawAxis(){
    axisLayer.innerHTML='';
    const MIN=-12, MAX=12;
    const svgNS='http://www.w3.org/2000/svg';
    const line=document.createElementNS(svgNS,'line');
    line.setAttribute('x1',X0+MIN*PX); line.setAttribute('x2',X0+MAX*PX);
    line.setAttribute('y1',AXIS_Y); line.setAttribute('y2',AXIS_Y);
    line.setAttribute('stroke','rgba(234,244,241,0.7)'); line.setAttribute('stroke-width','2');
    axisLayer.appendChild(line);
    for(let i=MIN;i<=MAX;i++){
      const x=X0+i*PX;
      const isMajor=(i%5===0);
      const tick=document.createElementNS(svgNS,'line');
      tick.setAttribute('x1',x); tick.setAttribute('x2',x);
      tick.setAttribute('y1',AXIS_Y-(isMajor?9:5)); tick.setAttribute('y2',AXIS_Y+(isMajor?9:5));
      tick.setAttribute('stroke',i===0?'#EFA94A':'rgba(234,244,241,0.5)');
      tick.setAttribute('stroke-width',i===0?'3':'1.5');
      axisLayer.appendChild(tick);
      if(isMajor||i===0){
        const label=document.createElementNS(svgNS,'text');
        label.setAttribute('x',x); label.setAttribute('y',AXIS_Y+20);
        label.setAttribute('text-anchor','middle');
        label.setAttribute('font-size',i===0?'15':'13');
        label.setAttribute('font-weight',i===0?'700':'500');
        label.setAttribute('fill',i===0?'#EFA94A':'rgba(234,244,241,0.75)');
        label.setAttribute('font-family','Rubik,sans-serif');
        label.textContent=i;
        axisLayer.appendChild(label);
      }
    }
  }

  function buildTile(value,id){
    const wrapper=document.createElement('div');
    wrapper.className='ac-tile';
    wrapper.dataset.id=id;
    wrapper.dataset.value=value;
    const w=Math.max(Math.abs(value)*TRAY_PX,46);
    const color=value<0?'#E2604F':'#48B08C';
    const svgNS='http://www.w3.org/2000/svg';
    const s=document.createElementNS(svgNS,'svg');
    s.setAttribute('width',w); s.setAttribute('height',TILE_H);
    s.setAttribute('viewBox',`0 0 ${w} ${TILE_H}`);
    const marker=value<0?'url(#arrow-head-red)':'url(#arrow-head-green)';
    const y=TILE_H/2+6;
    const ln=document.createElementNS(svgNS,'line');
    if(value<0){ ln.setAttribute('x1',w-4); ln.setAttribute('x2',6); }
    else { ln.setAttribute('x1',4); ln.setAttribute('x2',w-6); }
    ln.setAttribute('y1',y); ln.setAttribute('y2',y);
    ln.setAttribute('stroke',color); ln.setAttribute('stroke-width',3.5);
    ln.setAttribute('stroke-linecap','round'); ln.setAttribute('marker-end',marker);
    s.appendChild(ln);
    wrapper.appendChild(s);
    return wrapper;
  }

  function renderTray(){
    trayEl.innerHTML='';
    acState.trayItems.filter(it=>!it.used).forEach(it=>{
      const tile=buildTile(it.value,it.id);
      attachDrag(tile,it);
      trayEl.appendChild(tile);
    });
  }

  function renderBuiltLine(){
    if(acState.chain.length===0){ builtLineEl.textContent=''; return; }
    const seq=acState.chain.map(c=>formatTerm(c.value)).join(' + ');
    builtLineEl.innerHTML='התרגיל שיצרתם: <span class="val">'+seq+'</span>';
  }

  function drawChain(){
    chainLayer.innerHTML=''; tipLayer.innerHTML='';
    let running=0, prevY=AXIS_Y, prevSign=null, floorIndex=-1;
    const svgNS='http://www.w3.org/2000/svg';
    acState.chain.forEach((item,idx)=>{
      const sign=item.value<0?-1:1;
      if(idx===0){ floorIndex=0; }
      else if(sign!==prevSign){ floorIndex+=1; }
      const rowY=floorY(floorIndex);
      const startX=X0+running*PX;
      running+=item.value;
      const endX=X0+running*PX;
      const color=item.value<0?'#E2604F':'#48B08C';
      const marker=item.value<0?'url(#arrow-head-red)':'url(#arrow-head-green)';
      const g=document.createElementNS(svgNS,'g');
      g.style.cursor='pointer';
      g.addEventListener('click',()=>removeFromChain(item.id));
      if(rowY!==prevY){
        const conn=document.createElementNS(svgNS,'line');
        conn.setAttribute('x1',startX); conn.setAttribute('x2',startX);
        conn.setAttribute('y1',prevY); conn.setAttribute('y2',rowY);
        conn.setAttribute('stroke','rgba(234,244,241,0.3)');
        conn.setAttribute('stroke-width',1.5);
        conn.setAttribute('stroke-dasharray','3,3');
        g.appendChild(conn);
      }
      const guide=document.createElementNS(svgNS,'line');
      guide.setAttribute('x1',endX); guide.setAttribute('x2',endX);
      guide.setAttribute('y1',rowY); guide.setAttribute('y2',AXIS_Y);
      guide.setAttribute('stroke','rgba(234,244,241,0.3)');
      guide.setAttribute('stroke-width',1.5);
      guide.setAttribute('stroke-dasharray','3,3');
      if(idx===acState.chain.length-1) g.appendChild(guide);
      const ln=document.createElementNS(svgNS,'line');
      ln.setAttribute('x1',startX); ln.setAttribute('x2',endX);
      ln.setAttribute('y1',rowY); ln.setAttribute('y2',rowY);
      ln.setAttribute('stroke',color); ln.setAttribute('stroke-width',4);
      ln.setAttribute('stroke-linecap','round'); ln.setAttribute('marker-end',marker);
      g.appendChild(ln);
      chainLayer.appendChild(g);
      prevY=rowY; prevSign=sign;
    });
    if(acState.chain.length>0){
      const tipX=X0+running*PX;
      const pin=document.createElementNS(svgNS,'path');
      pin.setAttribute('d',`M ${tipX} ${prevY-6} l 8 -14 l -16 0 z`);
      pin.setAttribute('fill','#EFA94A');
      tipLayer.appendChild(pin);
      const q=document.createElementNS(svgNS,'text');
      q.setAttribute('x',tipX); q.setAttribute('y',prevY-24);
      q.setAttribute('text-anchor','middle'); q.setAttribute('font-size','16');
      q.setAttribute('font-weight','700'); q.setAttribute('fill','#EFA94A');
      q.setAttribute('font-family','Rubik,sans-serif');
      q.textContent=acState.revealed?String(running):'?';
      tipLayer.appendChild(q);
    }
    return running;
  }

  function removeFromChain(id){
    const idx=acState.chain.findIndex(c=>c.id===id);
    if(idx===-1) return;
    const removedIds=acState.chain.slice(idx).map(c=>c.id);
    acState.chain=acState.chain.slice(0,idx);
    removedIds.forEach(rid=>{ const it=acState.trayItems.find(t=>t.id===rid); if(it) it.used=false; });
    acState.revealed=false;
    feedbackEl.textContent=''; feedbackEl.className='ac-feedback';
    renderTray(); updateLayout(); renderBuiltLine();
  }

  function commitDrop(id){
    const it=acState.trayItems.find(t=>t.id===id);
    if(!it||it.used) return;
    it.used=true;
    acState.chain.push({id:it.id,value:it.value});
    acState.revealed=false;
    feedbackEl.textContent=''; feedbackEl.className='ac-feedback';
    renderTray(); updateLayout(); renderBuiltLine();
  }

  let _acDragging=null;

  function attachDrag(tileEl,item){
    tileEl.addEventListener('pointerdown',(e)=>{
      e.preventDefault();
      const rect=tileEl.getBoundingClientRect();
      _acDragging={id:item.id,el:tileEl,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top};
      tileEl.style.position='fixed';
      tileEl.style.left=rect.left+'px';
      tileEl.style.top=rect.top+'px';
      tileEl.style.width=rect.width+'px';
      tileEl.style.zIndex=1000;
      document.body.appendChild(tileEl);
      tileEl.setPointerCapture(e.pointerId);
    });
    tileEl.addEventListener('pointermove',(e)=>{
      if(!_acDragging||_acDragging.id!==item.id) return;
      _acDragging.el.style.left=(e.clientX-_acDragging.offsetX)+'px';
      _acDragging.el.style.top=(e.clientY-_acDragging.offsetY)+'px';
    });
    tileEl.addEventListener('pointerup',(e)=>{
      if(!_acDragging||_acDragging.id!==item.id) return;
      const svgRect=svg.getBoundingClientRect();
      const inside=e.clientX>=svgRect.left&&e.clientX<=svgRect.right&&
                   e.clientY>=svgRect.top&&e.clientY<=svgRect.bottom;
      _acDragging.el.style.position='';
      _acDragging.el.style.left='';
      _acDragging.el.style.top='';
      _acDragging.el.style.width='';
      _acDragging.el.style.zIndex='';
      _acDragging.el.remove();
      _acDragging=null;
      if(inside) commitDrop(item.id);
      else renderTray();
    });
    tileEl.addEventListener('pointercancel',()=>{
      if(_acDragging) _acDragging.el.remove();
      _acDragging=null;
      renderTray();
    });
  }

  function checkAnswer(){
    const chainSum=acState.chain.reduce((s,c)=>s+c.value,0);
    const targetSum=acState.terms.reduce((s,t)=>s+t,0);
    const chainVals=acState.chain.map(c=>c.value).slice().sort((a,b)=>a-b);
    const targetVals=acState.terms.slice().sort((a,b)=>a-b);
    const sameSet=chainVals.length===targetVals.length&&chainVals.every((v,i)=>v===targetVals[i]);
    const typed=answerInput.value.trim();
    const typedNum=typed===''?null:Number(typed);
    acState.revealed=true;
    updateLayout();
    if(acState.chain.length===0){
      feedbackEl.textContent='קודם גררו חצים אל הציר.';
      feedbackEl.className='ac-feedback bad';
      return;
    }
    if(!sameSet){
      feedbackEl.textContent='החצים שבחרתם לא תואמים בדיוק את התרגיל — נסו שוב.';
      feedbackEl.className='ac-feedback bad';
      return;
    }
    if(typedNum===null){
      feedbackEl.textContent='התוצאה על הציר נכונה: '+chainSum+'. הקלידו אותה בתיבה כדי לאשר.';
      feedbackEl.className='ac-feedback';
      return;
    }
    if(typedNum===chainSum&&chainSum===targetSum){
      feedbackEl.textContent='תשובה נכונה! 🎉';
      feedbackEl.className='ac-feedback ok';
      if(!acState.solvedThisRound){
        acState.solvedThisRound=true;
        acState.score++;
        if(scoreEl) scoreEl.textContent=acState.score;
      }
    } else {
      feedbackEl.textContent='לא בדיוק — בדקו שוב את הראש של החץ האחרון.';
      feedbackEl.className='ac-feedback bad';
    }
  }

  function resetCurrent(){
    acState.chain=[];
    acState.trayItems.forEach(it=>it.used=false);
    acState.revealed=false;
    if(answerInput) answerInput.value='';
    feedbackEl.textContent=''; feedbackEl.className='ac-feedback';
    renderTray(); updateLayout(); renderBuiltLine();
  }

  function newExercise(){
    const terms=generateExercise();
    const decoys=generateDecoys(terms);
    const allValues=shuffle(terms.concat(decoys));
    acState.terms=terms;
    acState.trayItems=allValues.map((v,i)=>({id:'ac'+Date.now()+'_'+i,value:v,used:false}));
    acState.chain=[];
    acState.revealed=false;
    acState.solvedThisRound=false;
    if(answerInput) answerInput.value='';
    feedbackEl.textContent=''; feedbackEl.className='ac-feedback';
    renderExpression(); renderTray(); updateLayout(); renderBuiltLine();
  }

  const btnCheck=document.getElementById('arrow-btn-check');
  const btnReset=document.getElementById('arrow-btn-reset');
  const btnNew=document.getElementById('arrow-btn-new');
  if(btnCheck) btnCheck.addEventListener('click',checkAnswer);
  if(btnReset) btnReset.addEventListener('click',resetCurrent);
  if(btnNew) btnNew.addEventListener('click',newExercise);
  if(answerInput) answerInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter') checkAnswer(); });

  newExercise();
}

/* ============ SEQUENCE 4 GAME: RULE DISCOVERY ============ */

function renderGameRuleDiscovery4(){
  return `
    <div style="margin-bottom:12px;">
      <button class="btn secondary" onclick="goHome()">← חזרה</button>
    </div>
    <div class="rd-panel">
      <div class="rd-section-title">גילוי כלל 1: חיבור מספרים עם אותו סימן</div>
