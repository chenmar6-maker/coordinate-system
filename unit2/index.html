/* ============ NUMBER LINE SVG ============ */

function buildNumberLine({min=-12, max=12, marked=[], highlight=null, interactive=false, clickFn=null, matchedPairs=[], firstClick=null, errorNums=[], markedLabels={}}={}){
  const svgW = 600;
  const svgH = 80;
  const leftM = 30;
  const rightM = 30;
  const plotW = svgW - leftM - rightM;
  const axisY = 50;
  const totalNums = max - min; // 24
  const step = plotW / totalNums;

  function xOf(n){ return leftM + (n - min) * step; }

  let s = `<svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="font-family:Rubik,sans-serif;display:block;direction:ltr;">`;

  // Highlight segment from 0 to highlight value (coral)
  if(highlight !== null && highlight !== 0){
    const x0 = xOf(0);
    const xH = xOf(highlight);
    s += `<line x1="${x0}" y1="${axisY}" x2="${xH}" y2="${axisY}" stroke="#E2604F" stroke-width="4" stroke-linecap="round"/>`;
  }

  // Main axis line
  s += `<line x1="${leftM}" y1="${axisY}" x2="${svgW - rightM}" y2="${axisY}" stroke="rgba(234,244,241,0.7)" stroke-width="2"/>`;

  // Arrow heads
  s += `<polygon points="${svgW-rightM+2},${axisY} ${svgW-rightM-7},${axisY-5} ${svgW-rightM-7},${axisY+5}" fill="rgba(234,244,241,0.7)"/>`;
  s += `<polygon points="${leftM-2},${axisY} ${leftM+7},${axisY-5} ${leftM+7},${axisY+5}" fill="rgba(234,244,241,0.7)"/>`;

  // Tick marks and labels
  for(let n = min; n <= max; n++){
    const x = xOf(n);
    const isZero = n === 0;
    const isFive = n % 5 === 0;
    const tickH = isZero ? 14 : isFive ? 10 : 6;
    const tickW = isZero ? 2.5 : 1.5;
    s += `<line x1="${x}" y1="${axisY - tickH}" x2="${x}" y2="${axisY + tickH}" stroke="rgba(234,244,241,${isZero?0.9:0.6})" stroke-width="${tickW}"/>`;

    // Labels only at -10,-5,0,5,10
    if(n !== min && n !== max && (n === -10 || n === -5 || n === 0 || n === 5 || n === 10)){
      s += `<text x="${x}" y="${axisY + 28}" text-anchor="middle" font-size="13" fill="rgba(234,244,241,0.75)" font-family="Rubik,sans-serif">${n}</text>`;
    }
  }

  // Matched pair lines (green arcs/connectors)
  matchedPairs.forEach(pair => {
    const xa = xOf(pair[0]);
    const xb = xOf(pair[1]);
    const mx = (xa + xb) / 2;
    const arcH = 18;
    s += `<path d="M${xa},${axisY-8} Q${mx},${axisY-8-arcH} ${xb},${axisY-8}" fill="none" stroke="#48B08C" stroke-width="2" stroke-dasharray="4,2"/>`;
  });

  // firstClick highlight
  if(firstClick !== null){
    const xfc = xOf(firstClick);
    s += `<circle cx="${xfc}" cy="${axisY}" r="11" fill="rgba(239,169,74,0.35)" stroke="#EFA94A" stroke-width="2.5"/>`;
    s += `<text x="${xfc}" y="${axisY+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#EFA94A" font-family="Rubik,sans-serif">${firstClick}</text>`;
  }

  // Marked circles
  const matchedFlat = matchedPairs.flat();
  marked.forEach(n => {
    const x = xOf(n);
    const isMatched = matchedFlat.includes(n);
    const isError = errorNums.includes(n);
    const isFirst = firstClick === n;
    if(isFirst) return; // already drawn above
    const fillColor = isMatched ? '#48B08C' : isError ? '#E2604F' : '#EFA94A';
    const strokeColor = isMatched ? '#48B08C' : isError ? '#E2604F' : '#EFA94A';
    const dotLabel = markedLabels[n] !== undefined ? markedLabels[n] : n;
    s += `<circle cx="${x}" cy="${axisY}" r="8" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2"/>`;
    s += `<text x="${x}" y="${axisY+4}" text-anchor="middle" font-size="11" font-weight="700" fill="${isMatched||isError?'#fff':'#0A2A43'}" font-family="Rubik,sans-serif">${dotLabel}</text>`;
  });

  // Interactive click targets
  if(interactive && clickFn){
    for(let n = min + 1; n < max; n++){
      const x = xOf(n);
      s += `<circle cx="${x}" cy="${axisY}" r="14" fill="transparent" style="cursor:pointer;" onclick="window['${clickFn}'](${n})"/>`;
    }
  }

  s += `</svg>`;
  return s;
}

/* ============ GAME INIT ============ */

function startGame(){
  state.screen = 'game';
  state.levelIndex = 0;
  state.gameScore = 0;
  state.gameTotal = 0;
  state.levelSub = freshLevelSub(0);
  const firstLvl = currentGameLevels()[0];
  if(firstLvl && firstLvl.id === 'absMC') state.shuffledOptions = shuffleArr(firstLvl.options || []);
  else if(firstLvl && (firstLvl.id === 'oppZero' || firstLvl.id === 'oppAbsMC')) state.shuffledOptions = shuffleArr(firstLvl.options || []);
  render();
}

function freshLevelSub(levelIdx){
  const lvl = currentGameLevels()[levelIdx];
  if(!lvl) return {};
  if(lvl.id === 'absTwoPoints') return {clicked:[], answered:false, correct:false, error:false};
  if(lvl.id === 'oppPair') return {firstClick:null, matched:[], answered:false, error:false};
  return {answered:false, correct:false};
}

function nextLevel(){
  state.levelIndex++;
  if(state.levelIndex >= currentGameLevels().length){
    finishGame();
    return;
  }
  state.levelSub = freshLevelSub(state.levelIndex);
  const nextLvl = currentGameLevels()[state.levelIndex];
  if(nextLvl && (nextLvl.id === 'absMC' || nextLvl.id === 'oppZero' || nextLvl.id === 'oppAbsMC')){
    state.shuffledOptions = shuffleArr(nextLvl.options || []);
  }
  render();
}

function finishGame(){
  state.screen = 'gameResults';
  render();
}

/* ============ GAME RENDER ============ */

function renderGame(){
  const lvl = currentGameLevels()[state.levelIndex];
  const levels = currentGameLevels();
  const dots = levels.map((_,i)=>{
    let cls = 'dot';
    if(i < state.levelIndex) cls += ' done';
    else if(i === state.levelIndex) cls += ' active';
    return `<div class="${cls}"></div>`;
  }).join('');

  let content = '';
  if(!lvl){ content = '<p>שגיאה: אין שלב</p>'; }
  else if(lvl.id === 'absInput') content = renderAbsInput(lvl);
  else if(lvl.id === 'absTwoPoints') content = renderAbsTwoPoints(lvl);
  else if(lvl.id === 'absMax') content = renderAbsMax(lvl);
  else if(lvl.id === 'absMC') content = renderAbsMC(lvl);
  else if(lvl.id === 'oppClick') content = renderOppClick(lvl);
  else if(lvl.id === 'oppPair') content = renderOppPair(lvl);
  else if(lvl.id === 'oppZero') content = renderOppZero(lvl);
  else if(lvl.id === 'oppAbsMC') content = renderOppAbsMC(lvl);

  return `
    <div class="progressdots">${dots}</div>
    <div class="panel">
      ${content}
    </div>
  `;
}

/* ---- absTwoPoints ---- */
function renderAbsTwoPoints(lvl){
  const sub = state.levelSub;

    <p class="instr" style="opacity:.6;font-size:13px;">בחרתם: ${sub.clicked.length > 0 ? sub.clicked.join(', ') : '—'}</p>`;
  } else {
    statusArea = `

    ${statusArea}
  `;

function clickAbsPoint(n){
  const sub = state.levelSub;
  if(sub.answered) return;
  if(!sub.clicked) sub.clicked = [];
  const idx = sub.clicked.indexOf(n);
  if(idx >= 0){ sub.clicked.splice(idx, 1); }
  else { sub.clicked.push(n); }
  const lvl = currentGameLevels()[state.levelIndex];
  if(sub.clicked.length === 2){
    const sorted1 = [...sub.clicked].sort((a,b)=>a-b);
    const sorted2 = [...lvl.correct].sort((a,b)=>a-b);
    if(sorted1[0]===sorted2[0] && sorted1[1]===sorted2[1]){
      sub.answered = true;
      sub.correct = true;
      state.gameScore++;
      state.gameTotal++;
    } else {
      sub.clicked = [];
      sub.error = true;
      setTimeout(()=>{ if(state.levelSub) state.levelSub.error = false; render(); }, 900);
    }
  }
  render();
}

/* ---- oppPair ---- */
function renderOppPair(lvl){
  const sub = state.levelSub;
  if(!sub.matched) sub.matched = [];
  const matchedFlat = sub.matched.flat();

  // Build marked with special rendering
  const nl = buildNumberLine({
    marked: lvl.numbers,
    interactive: !sub.answered,
    clickFn: 'clickPairPoint',
    matchedPairs: sub.matched,
    firstClick: sub.firstClick
  });

  let statusArea = '';
  if(sub.error){
    statusArea = `<div class="feedback bad">אלה לא מספרים נגדיים — נסו שנית</div>`;
  }
  if(!sub.answered){
    const pairsLeft = lvl.pairs.length - sub.matched.length;
    if(!sub.error){
      statusArea = `<p class="instr">לחצו על כל זוג מספרים נגדיים (נותרו ${pairsLeft} זוגות)</p>`;
      if(sub.firstClick !== null) statusArea += `<p class="instr" style="opacity:.7;font-size:13px;">בחרתם: ${sub.firstClick} — לחצו על הנגדי שלו</p>`;
    }
  } else {
    statusArea = `
      <div class="feedback ok">מצוין! מצאתם את כל הזוגות הנגדיים.</div>
      <div class="explain-box">${lvl.explain}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;
  }
  return `
    <h2 class="qtitle">${lvl.title}</h2>
    <p class="qtext">לחצו על כל זוג מספרים נגדיים</p>
    <div class="nl-wrap">${nl}</div>
    ${statusArea}
  `;
}

function clickPairPoint(n){
  const lvl = currentGameLevels()[state.levelIndex];
  const sub = state.levelSub;
  if(!sub.matched) sub.matched = [];
  if(sub.answered) return;
  if(sub.matched.flat().includes(n)) return;
  if(sub.firstClick === null){
    sub.firstClick = n;
    sub.error = false;
  } else {
    const a = sub.firstClick;
    const b = n;
    sub.firstClick = null;
    if(a === b){ sub.error = false; render(); return; }
    const isPair = lvl.pairs.some(p => (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
    if(isPair){
      sub.matched.push([a, b]);
      sub.error = false;
      if(sub.matched.length === lvl.pairs.length){
        sub.answered = true;
        state.gameScore++;
        state.gameTotal++;
      }
    } else {
      sub.error = true;
      setTimeout(()=>{ if(state.levelSub) state.levelSub.error = false; render(); }, 900);
    }
  }
  render();
}

  const opts = state.shuffledOptions && state.shuffledOptions.length ? state.shuffledOptions : lvl.options;
  const btns = opts.map(opt => {
    let cls = 'mc-btn';
    if(sub.answered){
      if(opt === lvl.correct) cls += ' correct';
      else if(opt === sub.picked && opt !== lvl.correct) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="answerOppAbsMC('${escOpt(opt)}')" ${sub.answered?'disabled':''}>${opt}</button>`;
  }).join('');

  let feedback = '';
  if(sub.answered){
    const feedbackClass = sub.correct ? 'ok' : 'bad';
    feedback = `
      <div class="feedback ${feedbackClass}">${sub.correct ? 'נכון!' : 'לא מדויק.'}</div>
      <div class="explain-box">${lvl.explain}</div>
      <div class="btnrow"><button class="btn" onclick="nextLevel()">הבא ←</button></div>`;
  }
  return `
    <h2 class="qtitle">${lvl.title}</h2>
    <p class="qtext">${lvl.question}</p>
    <div class="mc-options">${btns}</div>
    ${feedback}
  `;
}

function answerOppAbsMC(opt){
  const lvl = currentGameLevels()[state.levelIndex];
  const sub = state.levelSub;
  if(sub.answered) return;
  sub.answered = true;
  sub.picked = opt;
  sub.correct = opt === lvl.correct;
  if(sub.correct) state.gameScore++;
  state.gameTotal++;
  render();
}

/* ============ GAME RESULTS ============ */

function renderGameResults(){
  const total = state.gameTotal || currentGameLevels().length;
  return `
    <div class="panel" style="text-align:center;">
      <h2 class="qtitle">סיימתם את התרגול!</h2>
      <div class="scorebig">${state.gameScore} / ${total}</div>
      <p class="qtext">עכשיו אפשר לבדוק את הידע שלכם במבדק שליטה.</p>
      <div class="btnrow">
        <button class="btn" onclick="startQuiz()">למבדק שליטה ←</button>
        <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
      </div>
    </div>
  `;
}

/* ============ QUIZ ============ */

function shuffleArr(arr){
  const a = [...arr];
  for(let i = a.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  state.quizAlt = false;
  startQuizInternal();
}

function startQuizAlt(){
  state.quizAlt = true;
  startQuizInternal();
}

function startQuizInternal(){
  state.screen = 'quiz';
  state.quizIndex = 0;
  state.quizScore = 0;
  state.quizAnswered = false;
  state.quizLastCorrect = null;
  state.shuffledOptions = shuffleArr(currentQuizQuestions()[0].options || []);
  render();
}

function renderQuiz(){
  const q = currentQuizQuestions()[state.quizIndex];
  const dots = currentQuizQuestions().map((_,i) => {
    let cls = 'dot';
    if(i < state.quizIndex) cls += ' done';
    else if(i === state.quizIndex) cls += ' active';
    return `<div class="${cls}"></div>`;
  }).join('');

  const opts = state.shuffledOptions && state.shuffledOptions.length ? state.shuffledOptions : q.options;
  const answerArea = `<div class="mc-options">
    ${opts.map(opt => `<button class="mc-btn" id="opt-${safeId(opt)}" onclick="answerQuizMC('${escOpt(opt)}')" ${state.quizAnswered?'disabled':''}>${opt}</button>`).join('')}
  </div>`;

  const isLast = state.quizIndex === currentQuizQuestions().length - 1;

  return `
    <div class="progressdots">${dots}</div>
    <div class="panel">
      <div class="qmeta">שאלה ${state.quizIndex+1} מתוך ${currentQuizQuestions().length}</div>
      <h2 class="qtitle">${q.title}</h2>
      <p class="qtext">${q.text}</p>
      ${answerArea}
      ${state.quizAnswered ? `
        <div class="explain-box"><strong>${state.quizLastCorrect ? 'תשובה נכונה!' : 'לא מדויק.'}</strong> ${q.explain}</div>
        <div class="btnrow"><button class="btn" onclick="${isLast ? 'finishQuiz()' : 'nextQuizQuestion()'}">${isLast ? 'לתוצאות' : 'לשאלה הבאה'}</button></div>
      ` : ''}
    </div>
  `;
}

function answerQuizMC(opt){
  if(state.quizAnswered) return;
  const q = currentQuizQuestions()[state.quizIndex];
  state.quizAnswered = true;
  const correct = (opt === q.correct);
  state.quizLastCorrect = correct;
  if(correct) state.quizScore++;
  document.querySelectorAll('.mc-btn').forEach(btn => {
    btn.disabled = true;
    if(btn.textContent === q.correct) btn.classList.add('correct');
    else if(btn.textContent === opt && !correct) btn.classList.add('wrong');
  });
  setTimeout(render, 350);
}

function nextQuizQuestion(){
  state.quizIndex++;
  state.quizAnswered = false;
  state.quizLastCorrect = null;
  const q = currentQuizQuestions()[state.quizIndex];
  state.shuffledOptions = shuffleArr(q.options || []);
  render();
}

function finishQuiz(){
  state.screen = 'quizResults';
  render();
}

/* ============ QUIZ RESULTS ============ */

function renderQuizResults(){
  const total = currentQuizQuestions().length;
  const pct = Math.round((state.quizScore / total) * 100);
  let msg = 'המשך להתאמן, אתם בדרך הנכונה!';
  if(pct >= 85) msg = 'כל הכבוד! שליטה מעולה בחומר.';
  else if(pct >= 60) msg = 'עבודה טובה! עוד קצת תרגול ותהיו מומחים.';
  return `
    <div class="panel" style="text-align:center;">
      <h2 class="qtitle">תוצאות מבדק שליטה</h2>
      <div class="scorebig" dir="ltr">${state.quizScore} / ${total}</div>
      <p class="qtext">${msg}</p>
      <div class="btnrow">
        <button class="btn" onclick="startQuiz()">לנסות שוב</button>
        <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
      </div>
    </div>
  `;
}

/* ============ UTILS ============ */

function escOpt(s){
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

function safeId(s){
  return s.replace(/[^a-zA-Zא-ת0-9]/g,'_');
}

/* ============ INIT ============ */
render();
</script>
</body>
</html>
