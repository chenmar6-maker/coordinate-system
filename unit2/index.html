function initRuleDiscovery4(){
  let rd4Rule1Done=false, rd4Rule2Done=false;

  function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

  function formatTerm(v){return v<0?('('+v+')'):String(v);}

  function renderExprText(el,vals,signs){
    el.innerHTML='';
    vals.forEach((m,idx)=>{
      if(idx>0){const sp=document.createElement('span');sp.textContent=' + ';el.appendChild(sp);}
      const v=signs[idx]*m;
      const span=document.createElement('span');
      span.style.color=v<0?'#E2604F':'#48B08C';
      span.style.fontWeight='700';
      span.textContent=formatTerm(v);
      el.appendChild(span);
    });
    const total=vals.reduce((a,b,i)=>a+signs[i]*b,0);
    const eq=document.createElement('span');
    eq.style.color=total<0?'#E2604F':total>0?'#48B08C':'rgba(234,244,241,0.8)';
    eq.style.fontWeight='700';
    eq.textContent=' = '+total;
    el.appendChild(eq);
  }

  // --- Rule 1: same-sign ---
  let rd4Mags=[];
  const RULE1_OPTS=[
    {text:'מחברים את הערכים המוחלטים, והתוצאה מקבלת את הסימן המשותף',correct:true},
    {text:'מחסרים בין הערכים המוחלטים',correct:false},
    {text:'התוצאה תמיד יוצאת חיובית',correct:false},
    {text:'אי אפשר לדעת מראש מה יהיה סימן התוצאה',correct:false}
  ];

  function genRd4Mags(){
    let mags,S,guard=0;
    do{mags=[randInt(1,6),randInt(1,6),randInt(1,6)];S=mags.reduce((a,b)=>a+b,0);guard++;}
    while((S<4||S>12||new Set(mags).size<3)&&guard<300);
    return mags;
  }

  function shuffleLocal(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  function newRule1Example(){
    rd4Mags=genRd4Mags();
    const posEl=document.getElementById('rd4-expr1-pos');
    const negEl=document.getElementById('rd4-expr1-neg');
    if(posEl) renderExprText(posEl,rd4Mags,rd4Mags.map(()=>1));
    if(negEl) renderExprText(negEl,rd4Mags,rd4Mags.map(()=>-1));
    const optsEl=document.getElementById('rd4-opts1');
    const explEl=document.getElementById('rd4-explain1');
    if(!optsEl) return;
    optsEl.innerHTML='';
    if(explEl){explEl.style.display='none';explEl.textContent='';}
    shuffleLocal(RULE1_OPTS).forEach(opt=>{
      const btn=document.createElement('button');
      btn.className='rd-option';
      btn.textContent=opt.text;
      btn.addEventListener('click',()=>{
        Array.from(optsEl.children).forEach(b=>{b.disabled=true;});
        const S=rd4Mags.reduce((a,b)=>a+b,0);
        if(opt.correct){
          btn.classList.add('correct');
          if(explEl){explEl.textContent='נכון! '+rd4Mags.join(' + ')+'='+S+'. חיוביים → '+S+', שליליים → ('+(-S)+').';explEl.style.display='block';}
        } else {
          btn.classList.add('incorrect');
          const correctBtn=Array.from(optsEl.children).find(b=>b.textContent===RULE1_OPTS.find(o=>o.correct).text);
          if(correctBtn) correctBtn.classList.add('correct');
          if(explEl){explEl.textContent='לא בדיוק. הכלל: מחברים ערכים מוחלטים ('+rd4Mags.join('+')+' = '+S+') ונותנים לתוצאה את הסימן המשותף.';explEl.style.display='block';}
        }
        rd4Rule1Done=true;
        checkShowQuizBtn();
      });
      optsEl.appendChild(btn);
    });
  }

  // --- Rule 2: different signs ---
  let rd4Data=null;
  const RULE2_OPTS=[
    {text:'מחסרים את הערך המוחלט הקטן מהגדול, והתוצאה מקבלת את הסימן של המספר בעל הערך המוחלט הגדול',correct:true},
    {text:'מחברים את שני הערכים המוחלטים יחד',correct:false},
    {text:'התוצאה תמיד יוצאת אפס',correct:false},
    {text:'הסימן של התוצאה תמיד זהה לסימן של האיבר הראשון',correct:false}
  ];

  function genRd4Data(){
    let p,q,guard=0;
    do{p=randInt(4,9);q=randInt(2,7);guard++;}while(p===q&&guard<300);
    if(p<q){const t=p;p=q;q=t;}
    const domFirst=Math.random()<0.5;
    return{p,q,domFirst};
  }

  function makeRd4Terms(data,mirror){
    const base=data.domFirst?[data.p,-data.q]:[-data.q,data.p];
    return base.map(v=>v*mirror);
  }

  function newRule2Example(){
    rd4Data=genRd4Data();
    const termsA=makeRd4Terms(rd4Data,1);
    const termsB=makeRd4Terms(rd4Data,-1);
    const elA=document.getElementById('rd4-expr2-a');
    const elB=document.getElementById('rd4-expr2-b');
    if(elA) renderExprText(elA,termsA.map(Math.abs),termsA.map(v=>v<0?-1:1));
    if(elB) renderExprText(elB,termsB.map(Math.abs),termsB.map(v=>v<0?-1:1));
    const optsEl=document.getElementById('rd4-opts2');
    const explEl=document.getElementById('rd4-explain2');
    if(!optsEl) return;
    optsEl.innerHTML='';
    if(explEl){explEl.style.display='none';explEl.textContent='';}
    shuffleLocal(RULE2_OPTS).forEach(opt=>{
      const btn=document.createElement('button');
      btn.className='rd-option';
      btn.textContent=opt.text;
      btn.addEventListener('click',()=>{
        Array.from(optsEl.children).forEach(b=>{b.disabled=true;});
        const diff=rd4Data.p-rd4Data.q;
        const msg='הערך המוחלט הגדול הוא '+rd4Data.p+' והקטן הוא '+rd4Data.q+'. ההפרש ביניהם: '+diff+'. בתרגיל הראשון קיבלנו '+(diff>0?'+':'')+diff+', בשני '+((-diff)>0?'+':'')+(-diff)+'.';
        if(opt.correct){
          btn.classList.add('correct');
          if(explEl){explEl.textContent='נכון! '+msg;explEl.style.display='block';}
        } else {
          btn.classList.add('incorrect');
          const correctBtn=Array.from(optsEl.children).find(b=>b.textContent===RULE2_OPTS.find(o=>o.correct).text);
          if(correctBtn) correctBtn.classList.add('correct');
          if(explEl){explEl.textContent='לא בדיוק. '+msg;explEl.style.display='block';}
        }
        rd4Rule2Done=true;
        checkShowQuizBtn();
      });
      optsEl.appendChild(btn);
    });
  }

  function checkShowQuizBtn(){
    if(rd4Rule1Done&&rd4Rule2Done){
      const qb=document.getElementById('rd4-quiz-btn');
      if(qb) qb.style.display='flex';
    }
  }

  const btn1=document.getElementById('rd4-btn-new1');
  const btn2=document.getElementById('rd4-btn-new2');
  if(btn1) btn1.addEventListener('click',newRule1Example);
  if(btn2) btn2.addEventListener('click',newRule2Example);

  newRule1Example();
  newRule2Example();
}

/* ============ SEQUENCE 5 GAME: COMMUTATIVITY DISCOVERY ============ */

function renderGameRuleDiscovery5(){
  return `
    <div style="margin-bottom:12px;">
      <button class="btn secondary" onclick="goHome()">← חזרה</button>
    </div>
    <div class="rd-panel">
      <div class="rd-section-title">גילוי כלל: חוק החילוף בחיבור</div>
      <p style="text-align:right;font-size:14px;color:rgba(234,244,241,0.65);margin:0 0 12px;">שני התרגילים בנויים מאותם שלושה איברים בדיוק — רק בסדר שונה. השוו בין התוצאות:</p>
      <div class="rd-expr-pair">
        <div class="rd-expr-box"><span id="rd5-expr-a"></span></div>
        <div class="rd-expr-box"><span id="rd5-expr-b"></span></div>
      </div>
      <p style="text-align:right;font-weight:600;font-size:15px;margin:10px 0 8px;">מה אפשר להסיק מכך על סדר החיבור, גם כשיש מספרים שליליים?</p>
      <div class="rd-options" id="rd5-opts"></div>
      <div class="rd-explain" id="rd5-explain" style="display:none;"></div>
      <div id="rd5-practice" style="display:none;margin-top:16px;">
        <div class="rd-practice-title">תרגלו — חשבו את הסכומים (שנו סדר אם זה עוזר):</div>
      </div>
      <div style="text-align:left;margin-top:10px;">
        <button class="btn secondary" style="font-size:13px;padding:6px 14px;" id="rd5-btn-new">דוגמה חדשה</button>
      </div>
    </div>
    <div class="btnrow" id="rd5-quiz-btn" style="display:none;">
      <button class="btn" onclick="startQuiz()">לבדיקת שליטה ←</button>
    </div>
  `;
}

function initRuleDiscovery5(){
  function randNonZero(min,max){let v=0;while(v===0){v=Math.floor(Math.random()*(max-min+1))+min;}return v;}
  function formatTerm(v){return v<0?('('+v+')'):String(v);}
  function shuffleLocal(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  function renderExprText(el,terms){
    el.innerHTML='';
    terms.forEach((t,idx)=>{
      if(idx>0){const sp=document.createElement('span');sp.textContent=' + ';el.appendChild(sp);}
      const span=document.createElement('span');
      span.style.color=t<0?'#E2604F':'#48B08C';
      span.style.fontWeight='700';
      span.textContent=formatTerm(t);
      el.appendChild(span);
    });
    const total=terms.reduce((a,b)=>a+b,0);
    const eq=document.createElement('span');
    eq.style.color=total<0?'#E2604F':total>0?'#48B08C':'rgba(234,244,241,0.8)';
    eq.style.fontWeight='700';
    eq.textContent=' = '+total;
    el.appendChild(eq);
  }

  function genCommuteTerms(){
    let terms,guard=0;
    while(guard<500){
      guard++;
      terms=[randNonZero(-8,8),randNonZero(-8,8),randNonZero(-8,8)];
      const hasPos=terms.some(t=>t>0),hasNeg=terms.some(t=>t<0);
      if(!hasPos||!hasNeg) continue;
      let running=0,within=true;
      for(const t of terms){running+=t;if(Math.abs(running)>12){within=false;break;}}
      if(within&&Math.abs(running)<=10) break;
    }
    return terms;
  }

  function differentOrder(terms){
    let order=shuffleLocal(terms),guard=0;
    while(order.every((v,i)=>v===terms[i])&&guard<30){order=shuffleLocal(terms);guard++;}
    return order;
  }

  const RULE3_OPTS=[
    {text:'אפשר לשנות את סדר האיברים גם כשיש ביניהם מספרים שליליים, והתוצאה תישאר זהה',correct:true},
    {text:'שינוי הסדר משנה את התוצאה ברגע שיש מספר שלילי',correct:false},
    {text:'חוק החילוף תקף רק כשכל האיברים חיוביים',correct:false},
    {text:'צריך תמיד לחבר קודם את החיוביים ורק אחר כך את השליליים',correct:false}
  ];

  let rd5Sum=0;

  // Practice exercises
  const PRACTICE_EXERCISES=[
    {expr:'(−7) + 3 + 7', answer:3},
    {expr:'5 + (−3) + (−2)', answer:0},
    {expr:'(−4) + 9 + 4 + (−6)', answer:3}
  ];
  let practiceDone=new Array(PRACTICE_EXERCISES.length).fill(false);

  function renderPractice(){
    const practiceEl=document.getElementById('rd5-practice');
    if(!practiceEl) return;
    practiceEl.style.display='block';
    PRACTICE_EXERCISES.forEach((ex,i)=>{
      const itemId='rd5-pr-'+i;
      if(document.getElementById(itemId)) return;
      const div=document.createElement('div');
      div.className='rd-practice-item';
      div.id=itemId;
      div.innerHTML=`
        <span class="rd-practice-expr">${ex.expr} =</span>
        <input class="rd-practice-input" id="rd5-pr-inp-${i}" type="number" inputmode="numeric" placeholder="?">
        <button class="btn" style="font-size:13px;padding:5px 12px;" onclick="rd5CheckPractice(${i})">בדוק</button>
        <span class="rd-practice-fb" id="rd5-pr-fb-${i}"></span>
      `;
      practiceEl.appendChild(div);
    });
  }

  window.rd5CheckPractice=function(i){
    const inp=document.getElementById('rd5-pr-inp-'+i);
    const fb=document.getElementById('rd5-pr-fb-'+i);
    if(!inp||!fb) return;
    const val=parseInt(inp.value);
    if(isNaN(val)) return;
    if(val===PRACTICE_EXERCISES[i].answer){
      fb.textContent='נכון!';
      fb.className='rd-practice-fb ok';
      inp.disabled=true;
      practiceDone[i]=true;
    } else {
      fb.textContent='לא מדויק — נסו שוב.';
      fb.className='rd-practice-fb bad';
    }
  };

  function newRule3Example(){
    const base=genCommuteTerms();
    const orderA=base.slice();
    const orderB=differentOrder(base);
    rd5Sum=base.reduce((a,b)=>a+b,0);
    const elA=document.getElementById('rd5-expr-a');
    const elB=document.getElementById('rd5-expr-b');
    if(elA) renderExprText(elA,orderA);
    if(elB) renderExprText(elB,orderB);
    const optsEl=document.getElementById('rd5-opts');
    const explEl=document.getElementById('rd5-explain');
    if(!optsEl) return;
    optsEl.innerHTML='';
    if(explEl){explEl.style.display='none';explEl.textContent='';}
    shuffleLocal(RULE3_OPTS).forEach(opt=>{
      const btn=document.createElement('button');
      btn.className='rd-option';
      btn.textContent=opt.text;
      btn.addEventListener('click',()=>{
        Array.from(optsEl.children).forEach(b=>{b.disabled=true;});
        const msg='בשני התרגילים הופיעו אותם שלושה איברים בסדר שונה — ובכל זאת שני הסכומים יצאו '+rd5Sum+'. חוק החילוף תקף גם עם מספרים שליליים.';
        if(opt.correct){
          btn.classList.add('correct');
          if(explEl){explEl.textContent='נכון! '+msg;explEl.style.display='block';}
        } else {
          btn.classList.add('incorrect');
          const correctBtn=Array.from(optsEl.children).find(b=>b.textContent===RULE3_OPTS.find(o=>o.correct).text);
          if(correctBtn) correctBtn.classList.add('correct');
          if(explEl){explEl.textContent='לא בדיוק. '+msg;explEl.style.display='block';}
        }
        renderPractice();
        const qb=document.getElementById('rd5-quiz-btn');
        if(qb) qb.style.display='flex';
      });
      optsEl.appendChild(btn);
    });
  }

  const btn=document.getElementById('rd5-btn-new');
  if(btn) btn.addEventListener('click',newRule3Example);
  newRule3Example();
}

  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

function safeId(s){
  return s.replace(/[^a-zA-Zא-ת0-9]/g,'_');
}

render();
