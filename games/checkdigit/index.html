<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ספרת הביקורת — תעודת זהות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Rubik',sans-serif;
    background:radial-gradient(ellipse at 50% -10%,#1C2B3A 0%,#0E1820 50%,#070C12 100%);
    color:#EAF4F1;direction:rtl;min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 20px 60px;}

  /* ─── header ─── */
  .header{text-align:center;margin-bottom:16px;}
  .page-label{font-size:11px;font-weight:600;letter-spacing:2px;color:rgba(234,244,241,0.4);margin-bottom:6px;}
  h1{font-size:clamp(20px,4vw,26px);font-weight:800;color:#fff;margin:0 0 4px;}
  .header-sub{font-size:12px;color:rgba(234,244,241,0.5);line-height:1.6;}

  /* ─── ID card ─── */
  .id-card{
    position:relative;
    background:linear-gradient(160deg,#2B5AB8 0%,#1A3E8C 45%,#112D70 100%);
    border-radius:14px;
    padding:0;
    margin-bottom:16px;
    box-shadow:0 8px 28px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3);
    overflow:hidden;
    height:140px;
  }
  /* flag-like stripes top & bottom */
  .id-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:10px;
    background:rgba(255,255,255,0.18);
  }
  .id-card::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:10px;
    background:rgba(255,255,255,0.18);
  }
  /* subtle diagonal shine */
  .id-shine{
    position:absolute;top:-60%;left:-40%;width:80%;height:200%;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.04) 50%,transparent 60%);
    pointer-events:none;
  }

  .id-inner{
    position:absolute;inset:0;
    padding:14px 18px 12px;
    display:flex;flex-direction:column;justify-content:space-between;
  }

  .id-top{display:flex;align-items:center;justify-content:space-between;}
  .id-state-he{font-size:clamp(11px,2vw,14px);font-weight:800;color:#fff;letter-spacing:0.5px;}
  .id-state-en{font-size:clamp(7px,1.2vw,9px);font-weight:500;color:rgba(255,255,255,0.55);letter-spacing:1.5px;text-transform:uppercase;}
  .id-star{font-size:clamp(14px,2.5vw,20px);color:rgba(255,255,255,0.65);text-align:center;}

  .id-type-label{
    font-size:clamp(8px,1.2vw,10px);font-weight:700;letter-spacing:1.5px;
    color:rgba(255,255,255,0.5);text-transform:uppercase;text-align:center;
    margin-top:2px;
  }

  .id-bottom{text-align:center;}
  .id-num-label{font-size:clamp(8px,1.2vw,10px);color:rgba(255,255,255,0.45);letter-spacing:1px;margin-bottom:4px;}
  .id-number{
    direction:ltr;
    font-size:clamp(20px,4.5vw,32px);
    font-weight:800;
    letter-spacing:5px;
    color:#fff;
    font-variant-numeric:tabular-nums;
    line-height:1;
    display:flex;gap:3px;justify-content:center;align-items:center;
    flex-wrap:nowrap;
  }
  .id-digit{
    display:inline-block;
    transition:transform .2s, color .2s;
  }
  .id-digit.blank{color:rgba(255,255,255,0.2);}
  .id-digit.check-digit{
    color:#FFD966;
    border-bottom:2px solid rgba(255,217,102,0.6);
    padding-bottom:1px;
  }
  .id-digit.check-digit.blank{color:rgba(255,217,102,0.25);border-bottom-color:rgba(255,217,102,0.15);}
  @keyframes digitPop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .id-digit.pop{animation:digitPop .35s cubic-bezier(0.34,1.56,0.64,1) forwards;}

  /* ─── digit input ─── */
  .input-section{margin-bottom:14px;}
  .input-title{font-size:13px;font-weight:600;color:rgba(234,244,241,0.7);text-align:center;margin-bottom:10px;}
  .digit-boxes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr;}
  .digit-box{
    width:46px;height:56px;
    border:1.5px solid rgba(234,244,241,0.2);
    border-radius:9px;
    background:rgba(234,244,241,0.06);
    color:#EAF4F1;
    font-family:'Rubik',sans-serif;font-size:24px;font-weight:800;
    text-align:center;outline:none;
    direction:ltr;caret-color:transparent;
    transition:border-color .15s,background .15s,box-shadow .15s;
    -webkit-appearance:none;
  }
  .digit-box:focus{
    border-color:rgba(100,160,255,0.7);
    background:rgba(100,160,255,0.08);
    box-shadow:0 0 0 3px rgba(100,160,255,0.15);
  }
  .digit-box.filled{border-color:rgba(234,244,241,0.35);}
  .digit-box.active-step{
    border-color:#FFD966;
    background:rgba(255,217,102,0.1);
    box-shadow:0 0 0 3px rgba(255,217,102,0.2);
  }

  /* ─── calc button ─── */
  .calc-btn{
    display:block;width:100%;padding:12px;
    background:linear-gradient(135deg,#3A6FD8,#1E4AAA);
    color:#fff;border:none;border-radius:10px;
    font-family:'Rubik',sans-serif;font-size:15px;font-weight:800;
    cursor:pointer;margin-bottom:14px;
    box-shadow:0 4px 14px rgba(58,111,216,0.4);
    transition:transform .1s,box-shadow .1s;
  }
  .calc-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(58,111,216,0.5);}
  .calc-btn:disabled{opacity:0.4;cursor:default;transform:none;}

  /* ─── example buttons ─── */
  .examples-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;}
  .example-btn{
    padding:7px 14px;border-radius:20px;
    border:1.5px solid rgba(234,244,241,0.15);background:transparent;
    color:rgba(234,244,241,0.5);font-family:'Rubik',sans-serif;
    font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;
  }
  .example-btn:hover{border-color:rgba(100,160,255,0.5);color:#8BBFFF;}

  /* ─── mode toggle ─── */
  .mode-toggle{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .mode-btn{
    padding:8px 22px;border-radius:20px;font-family:'Rubik',sans-serif;
    font-size:13px;font-weight:700;cursor:pointer;
    border:1.5px solid rgba(234,244,241,0.18);background:transparent;
    color:rgba(234,244,241,0.45);transition:all .15s;
  }
  .mode-btn.active{
    background:rgba(58,111,216,0.18);border-color:rgba(58,111,216,0.55);color:#8BBFFF;
  }

  /* ─── practice grid ─── */
  .practice-hint{
    font-size:12px;color:rgba(234,244,241,0.45);text-align:center;
    margin-bottom:10px;line-height:1.6;
  }
  .practice-input{
    width:36px;height:34px;
    border:1.5px solid rgba(234,244,241,0.25);border-radius:7px;
    background:rgba(234,244,241,0.07);color:#EAF4F1;
    font-family:'Rubik',sans-serif;font-size:17px;font-weight:800;
    text-align:center;outline:none;direction:ltr;
    transition:border-color .15s,background .15s;
  }
  .practice-input:focus{border-color:rgba(100,160,255,0.7);background:rgba(100,160,255,0.08);}
  .practice-input.correct{border-color:#047857 !important;background:rgba(4,120,87,0.14) !important;color:#6EE7B7;}
  .practice-input.wrong{border-color:#DC2626 !important;background:rgba(220,38,38,0.1) !important;color:#FCA5A5;}

  .practice-sum-row{
    display:flex;align-items:center;gap:8px;justify-content:center;
    margin-top:14px;flex-wrap:wrap;direction:ltr;font-size:14px;font-weight:600;
  }
  .sum-total-inp{
    width:52px;height:36px;
    border:1.5px solid rgba(234,244,241,0.25);border-radius:8px;
    background:rgba(234,244,241,0.07);color:#EAF4F1;
    font-family:'Rubik',sans-serif;font-size:20px;font-weight:800;
    text-align:center;outline:none;direction:ltr;
    transition:border-color .15s,background .15s;
  }
  .sum-total-inp:focus{border-color:rgba(100,160,255,0.7);}
  .sum-total-inp.correct{border-color:#047857 !important;background:rgba(4,120,87,0.14) !important;color:#6EE7B7;}
  .sum-total-inp.wrong{border-color:#DC2626 !important;background:rgba(220,38,38,0.1) !important;color:#FCA5A5;}

  .check-digit-row{
    display:flex;align-items:center;gap:10px;justify-content:center;
    margin-top:12px;direction:rtl;
  }
  .check-digit-inp{
    width:56px;height:56px;
    border:2px solid rgba(255,217,102,0.35);border-radius:10px;
    background:rgba(255,217,102,0.07);color:#FFD966;
    font-family:'Rubik',sans-serif;font-size:28px;font-weight:800;
    text-align:center;outline:none;direction:ltr;
    transition:border-color .15s,background .15s;
  }
  .check-digit-inp:focus{border-color:rgba(255,217,102,0.7);}
  .check-digit-inp.correct{border-color:#047857 !important;background:rgba(4,120,87,0.14) !important;color:#6EE7B7;}
  .check-digit-inp.wrong{border-color:#DC2626 !important;background:rgba(220,38,38,0.1) !important;color:#FCA5A5;}

  .verify-btn{
    display:block;width:100%;padding:12px;
    background:linear-gradient(135deg,#3A6FD8,#1E4AAA);
    color:#fff;border:none;border-radius:10px;
    font-family:'Rubik',sans-serif;font-size:15px;font-weight:800;
    cursor:pointer;margin-top:14px;
    box-shadow:0 4px 14px rgba(58,111,216,0.35);
    transition:transform .1s,box-shadow .1s;
  }
  .verify-btn:hover{transform:translateY(-1px);}

  /* ─── steps ─── */
  .steps-section{display:flex;flex-direction:column;gap:10px;}

  .step-card{
    background:rgba(234,244,241,0.05);border:1.5px solid rgba(234,244,241,0.1);
    border-radius:12px;padding:12px 14px;
    opacity:0;transform:translateY(10px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .step-card.visible{opacity:1;transform:translateY(0);}

  .step-heading{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .step-badge{
    width:22px;height:22px;border-radius:50%;
    background:rgba(58,111,216,0.3);border:1.5px solid rgba(58,111,216,0.6);
    color:#8BBFFF;font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .step-title-text{font-size:13px;font-weight:700;color:#EAF4F1;}

  /* ─── horizontal calc grid ─── */
  .calc-grid{
    display:flex;gap:5px;justify-content:center;
    direction:ltr;overflow-x:auto;padding-bottom:4px;
  }
  .calc-col{
    display:flex;flex-direction:column;align-items:center;
    gap:3px;min-width:38px;flex-shrink:0;
    opacity:0;transform:translateY(8px);
    transition:opacity .22s ease, transform .22s ease;
  }
  .calc-col.visible{opacity:1;transform:translateY(0);}

  .col-digit{
    font-size:20px;font-weight:800;color:#fff;
    background:rgba(234,244,241,0.09);border-radius:7px;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  }
  .col-digit.active{
    background:rgba(255,217,102,0.15);
    box-shadow:0 0 0 2px rgba(255,217,102,0.4);
  }
  .col-weight{
    font-size:11px;font-weight:700;color:rgba(234,244,241,0.45);
    height:16px;display:flex;align-items:center;
  }
  .col-arrow-down{
    font-size:14px;color:rgba(234,244,241,0.3);
    height:18px;display:flex;align-items:center;
  }
  .col-product{
    font-size:19px;font-weight:800;color:#8BBFFF;
    height:28px;display:flex;align-items:center;
  }
  .col-reduce-arrow{
    font-size:13px;height:16px;display:flex;align-items:center;
    color:rgba(255,217,102,0.5);
  }
  .col-reduced{
    font-size:19px;font-weight:800;color:#FFD966;
    height:28px;display:flex;align-items:center;
  }
  .col-invisible{opacity:0;pointer-events:none;}

  /* sum card */
  .sum-display{
    display:flex;flex-wrap:wrap;align-items:center;gap:5px;
    font-size:16px;font-weight:700;direction:ltr;
  }
  .sum-part{color:#8BBFFF;}
  .sum-red{color:#FFD966;}
  .sum-plus{color:rgba(234,244,241,0.3);}
  .sum-eq{color:rgba(234,244,241,0.5);margin:0 3px;}
  .sum-total{font-size:26px;font-weight:800;color:#fff;}

  /* final result */
  .final-box{
    background:rgba(58,111,216,0.1);
    border:1.5px solid rgba(58,111,216,0.35);
    border-radius:10px;padding:14px;text-align:center;
  }
  .final-formula{font-size:13px;color:rgba(234,244,241,0.6);margin-bottom:10px;line-height:1.7;}
  .final-formula strong{color:#8BBFFF;}
  .final-digit-big{
    font-size:56px;font-weight:800;color:#FFD966;line-height:1;
    margin-bottom:6px;
    text-shadow:0 0 20px rgba(255,217,102,0.4);
  }
  .final-label{font-size:13px;color:rgba(234,244,241,0.45);}

  .back-link{display:block;text-align:center;margin-top:36px;font-size:13px;color:rgba(234,244,241,0.3);text-decoration:none;transition:color .15s;}
  .back-link:hover{color:rgba(234,244,241,0.6);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="page-label">משחקים מתמטיים</div>
    <h1>🔢 ספרת הביקורת</h1>
    <div class="header-sub">האלגוריתם שעומד מאחורי תעודת הזהות הישראלית — איך ספרה אחת בוחנת את כל השאר?</div>
  </div>

  <!-- ID Card -->
  <div class="id-card" id="id-card">
    <div class="id-shine"></div>
    <div class="id-inner">
      <div>
        <div class="id-top">
          <div>
            <div class="id-state-he">מדינת ישראל</div>
            <div class="id-state-en">State of Israel</div>
          </div>
          <div class="id-star">✡</div>
          <div style="text-align:left;">
            <div class="id-state-he" style="text-align:left;">دولة إسرائيل</div>
            <div class="id-state-en" style="text-align:left;">מ.ס. זהות</div>
          </div>
        </div>
        <div class="id-type-label">תעודת זהות</div>
      </div>
      <div class="id-bottom">
        <div class="id-num-label">מספר זהות</div>
        <div class="id-number" id="id-number-display"></div>
      </div>
    </div>
  </div>

  <!-- mode toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-demo" onclick="setCalcMode('demo')">הדגמה</button>
    <button class="mode-btn" id="mode-practice" onclick="setCalcMode('practice')">תרגול</button>
  </div>

  <!-- Digit input boxes -->
  <div class="input-section">
    <div class="input-title" id="input-title">הכניסו 8 ספרות — הספרה התשיעית תחושב אוטומטית</div>
    <div class="digit-boxes" id="digit-boxes"></div>
  </div>

  <button class="calc-btn" id="calc-btn" onclick="calculate()">חשב את ספרת הביקורת ←</button>

  <div class="examples-row">
    <span style="font-size:12px;color:rgba(234,244,241,0.35);align-self:center;">דוגמאות:</span>
    <button class="example-btn" onclick="loadExample('03988022')">03988022</button>
    <button class="example-btn" onclick="loadExample('20496963')">20496963</button>
    <button class="example-btn" onclick="loadExample('12345678')">12345678</button>
    <button class="example-btn" onclick="loadExample('00000000')">00000000</button>
  </div>

  <div class="steps-section" id="steps-section"></div>

  <a class="back-link" href="../">← חזרה למשחקים</a>
</div>

<script>
// ─── mode ─────────────────────────────────────────────
let calcMode = 'demo';

function setCalcMode(m) {
  calcMode = m;
  document.getElementById('mode-demo').classList.toggle('active', m === 'demo');
  document.getElementById('mode-practice').classList.toggle('active', m === 'practice');
  document.getElementById('input-title').textContent = m === 'demo'
    ? 'הכניסו 8 ספרות — הספרה התשיעית תחושב אוטומטית'
    : 'הכניסו 8 ספרות — ואז חשבו את ספרת הביקורת בעצמכם';
  document.getElementById('calc-btn').textContent = m === 'demo'
    ? 'חשב את ספרת הביקורת ←'
    : 'התחל תרגול ←';
  document.getElementById('steps-section').innerHTML = '';
  updateCardDisplay();
}

// ─── build digit input boxes ──────────────────────────
const N = 8;
const boxesContainer = document.getElementById('digit-boxes');
for (let i = 0; i < N; i++) {
  const inp = document.createElement('input');
  inp.type = 'tel';
  inp.inputMode = 'numeric';
  inp.maxLength = 1;
  inp.className = 'digit-box';
  inp.id = 'dbox' + i;
  inp.dataset.idx = i;
  inp.addEventListener('input', onBoxInput);
  inp.addEventListener('keydown', onBoxKeydown);
  inp.addEventListener('focus', () => inp.select());
  boxesContainer.appendChild(inp);
}

function onBoxInput(e) {
  const inp = e.target;
  const val = inp.value.replace(/[^0-9]/g,'');
  inp.value = val ? val[val.length-1] : '';
  inp.classList.toggle('filled', inp.value !== '');
  if (inp.value && inp.dataset.idx < N-1) {
    document.getElementById('dbox' + (parseInt(inp.dataset.idx)+1)).focus();
  }
  updateCardDisplay();
}

function onBoxKeydown(e) {
  const idx = parseInt(e.target.dataset.idx);
  if (e.key === 'Backspace' && !e.target.value && idx > 0) {
    document.getElementById('dbox' + (idx-1)).focus();
    e.preventDefault();
  }
  if (e.key === 'ArrowLeft' && idx > 0) {
    document.getElementById('dbox' + (idx-1)).focus();
    e.preventDefault();
  }
  if (e.key === 'ArrowRight' && idx < N-1) {
    document.getElementById('dbox' + (idx+1)).focus();
    e.preventDefault();
  }
  if (e.key === 'Enter') {
    calculate();
  }
}

// ─── live card display while typing ──────────────────
function updateCardDisplay(checkDigit) {
  const display = document.getElementById('id-number-display');
  display.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const val = document.getElementById('dbox'+i).value;
    const span = document.createElement('span');
    span.className = 'id-digit' + (val === '' ? ' blank' : '');
    span.textContent = val !== '' ? val : '•';
    display.appendChild(span);
  }
  // check digit slot
  const cd = document.createElement('span');
  if (checkDigit !== undefined) {
    cd.className = 'id-digit check-digit pop';
    cd.textContent = checkDigit;
  } else {
    cd.className = 'id-digit check-digit blank';
    cd.textContent = '?';
  }
  display.appendChild(cd);
}

// ─── load example ─────────────────────────────────────
function loadExample(str) {
  for (let i = 0; i < N; i++) {
    const box = document.getElementById('dbox'+i);
    box.value = str[i] || '';
    box.classList.toggle('filled', box.value !== '');
  }
  updateCardDisplay();
  document.getElementById('steps-section').innerHTML = '';
  setTimeout(calculate, 80);
}

// ─── algorithm ────────────────────────────────────────
function processStep(digit, weight) {
  const product = digit * weight;
  const reduced = product > 9 ? product - 9 : product;
  return { digit, weight, product, reduced, changed: product > 9 };
}

// ─── calculate ────────────────────────────────────────
function calculate() {
  const digits = [];
  for (let i = 0; i < N; i++) {
    const v = document.getElementById('dbox'+i).value;
    if (v === '' || !/^\d$/.test(v)) {
      flashError(); return;
    }
    digits.push(parseInt(v));
  }

  const weights = [1,2,1,2,1,2,1,2];
  const steps = digits.map((d,i) => processStep(d, weights[i]));
  const sum = steps.reduce((a,s) => a + s.reduced, 0);
  const checkDigit = (10 - (sum % 10)) % 10;

  document.getElementById('steps-section').innerHTML = '';
  updateCardDisplay();

  if (calcMode === 'practice') {
    showPracticeGrid(steps, sum, checkDigit);
  } else {
    renderStepsAnimated(steps, sum, checkDigit);
  }
}

function flashError() {
  const btn = document.getElementById('calc-btn');
  btn.style.background = 'linear-gradient(135deg,#CC3333,#991111)';
  btn.textContent = 'נא להכניס 8 ספרות ✕';
  setTimeout(() => {
    btn.style.background = '';
    btn.textContent = 'חשב את ספרת הביקורת ←';
  }, 1200);
}

// ─── animated render ──────────────────────────────────
function renderStepsAnimated(steps, sum, checkDigit) {
  const section = document.getElementById('steps-section');

  const card1 = makeCard(1, 'כופלים כל ספרה במשקלה (1 או 2 לסירוגין)');
  const grid = document.createElement('div');
  grid.className = 'calc-grid';

  // build all columns upfront (hidden), animate in one by one
  steps.forEach((s, i) => {
    const col = document.createElement('div');
    col.className = 'calc-col';

    const dEl = document.createElement('div');
    dEl.className = 'col-digit';
    dEl.textContent = s.digit;

    const wEl = document.createElement('div');
    wEl.className = 'col-weight';
    wEl.textContent = '×' + s.weight;

    const a1 = document.createElement('div');
    a1.className = 'col-arrow-down';
    a1.textContent = '↓';

    const pEl = document.createElement('div');
    pEl.className = 'col-product';
    pEl.textContent = s.product;

    const a2 = document.createElement('div');
    a2.className = 'col-reduce-arrow' + (s.changed ? '' : ' col-invisible');
    a2.textContent = '↓';

    const rEl = document.createElement('div');
    rEl.className = 'col-reduced' + (s.changed ? '' : ' col-invisible');
    rEl.textContent = s.changed ? s.reduced : '';

    col.append(dEl, wEl, a1, pEl, a2, rEl);
    grid.appendChild(col);
  });

  card1.appendChild(grid);
  section.appendChild(card1);
  setTimeout(() => card1.classList.add('visible'), 50);

  // animate columns left to right
  const cols = grid.querySelectorAll('.calc-col');
  cols.forEach((col, i) => {
    setTimeout(() => {
      // highlight matching input box
      document.querySelectorAll('.digit-box').forEach(b => b.classList.remove('active-step'));
      document.getElementById('dbox'+i).classList.add('active-step');
      col.querySelector('.col-digit').classList.add('active');
      col.classList.add('visible');

      if (i === steps.length - 1) {
        setTimeout(() => {
          document.querySelectorAll('.digit-box').forEach(b => b.classList.remove('active-step'));
          cols.forEach(c => c.querySelector('.col-digit').classList.remove('active'));
          showStep2(section, steps, sum, checkDigit);
        }, 450);
      }
    }, i * 180);
  });
}

function showStep2(section, steps, sum, checkDigit) {
  // Step 2: sum
  const card2 = makeCard(2, 'מחברים את כל התוצאות');
  const sumDiv = document.createElement('div');
  sumDiv.className = 'sum-display';

  steps.forEach((s, i) => {
    if (i > 0) {
      const plus = document.createElement('span');
      plus.className = 'sum-plus';
      plus.textContent = '+';
      sumDiv.appendChild(plus);
    }
    const part = document.createElement('span');
    part.className = s.changed ? 'sum-red' : 'sum-part';
    part.textContent = s.reduced;
    sumDiv.appendChild(part);
  });

  const eq = document.createElement('span');
  eq.className = 'sum-eq'; eq.textContent = '=';
  sumDiv.appendChild(eq);

  const total = document.createElement('span');
  total.className = 'sum-total'; total.textContent = sum;
  sumDiv.appendChild(total);

  card2.appendChild(sumDiv);
  section.appendChild(card2);
  setTimeout(() => card2.classList.add('visible'), 60);

  setTimeout(() => showStep3(section, sum, checkDigit), 500);
}

function showStep3(section, sum, checkDigit) {
  const card3 = makeCard(3, 'כמה חסר כדי שהסכום יתחלק ב-10?');
  const mod = sum % 10;
  const nextMultiple = sum + checkDigit;

  const explanation = mod === 0
    ? `הסכום <strong>${sum}</strong> כבר מתחלק ב-10 ללא שארית — לא חסר כלום.`
    : `הסכום הוא <strong>${sum}</strong>. כדי שיתחלק ב-10 ללא שארית צריך להגיע ל-<strong>${nextMultiple}</strong>. חסר <strong>${checkDigit}</strong>.`;

  const box = document.createElement('div');
  box.className = 'final-box';
  box.innerHTML = `
    <div class="final-formula">${explanation}</div>
    <div class="final-digit-big">${checkDigit}</div>
    <div class="final-label">ספרת הביקורת</div>
  `;
  card3.appendChild(box);
  section.appendChild(card3);
  setTimeout(() => {
    card3.classList.add('visible');
    // reveal on ID card
    setTimeout(() => updateCardDisplay(checkDigit), 300);
  }, 60);
}

// ─── practice mode ────────────────────────────────────
function showPracticeGrid(steps, sum, checkDigit) {
  const section = document.getElementById('steps-section');

  const card = makeCard('', 'מלאו את הערכים — כפלו במשקל, ואם התוצאה גדולה מ-9 חסרו ממנה 9');

  const hint = document.createElement('div');
  hint.className = 'practice-hint';
  hint.innerHTML = 'כל עמודה: ספרה × משקל. אם התוצאה > 9 — כתבו <strong>תוצאה − 9</strong>';
  card.appendChild(hint);

  // grid
  const grid = document.createElement('div');
  grid.className = 'calc-grid';

  steps.forEach((s, i) => {
    const col = document.createElement('div');
    col.className = 'calc-col visible';
    col.style.opacity = '1';
    col.style.transform = 'none';

    const dEl = document.createElement('div');
    dEl.className = 'col-digit';
    dEl.textContent = s.digit;

    const wEl = document.createElement('div');
    wEl.className = 'col-weight';
    wEl.textContent = '×' + s.weight;

    const a1 = document.createElement('div');
    a1.className = 'col-arrow-down';
    a1.textContent = '↓';

    const inp = document.createElement('input');
    inp.type = 'tel';
    inp.inputMode = 'numeric';
    inp.maxLength = 2;
    inp.className = 'practice-input';
    inp.id = 'pinp' + i;
    inp.dataset.answer = s.reduced;
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' && i < N-1) { document.getElementById('pinp'+(i+1)).focus(); e.preventDefault(); }
      if (e.key === 'ArrowLeft'  && i > 0)   { document.getElementById('pinp'+(i-1)).focus(); e.preventDefault(); }
      if (e.key === 'Enter') document.getElementById('practice-verify-btn').click();
    });

    // placeholder shows correct answer height without revealing
    const emptyR = document.createElement('div');
    emptyR.className = 'col-reduce-arrow col-invisible';
    emptyR.textContent = '↓';
    const emptyV = document.createElement('div');
    emptyV.className = 'col-reduced col-invisible';
    emptyV.textContent = '0';

    col.append(dEl, wEl, a1, inp, emptyR, emptyV);
    grid.appendChild(col);
  });

  card.appendChild(grid);

  // sum row
  const sumRow = document.createElement('div');
  sumRow.className = 'practice-sum-row';
  sumRow.innerHTML = '<span style="color:rgba(234,244,241,0.5);font-size:13px;">סכום:</span>';
  const sumInp = document.createElement('input');
  sumInp.type = 'tel'; sumInp.inputMode = 'numeric'; sumInp.maxLength = 3;
  sumInp.className = 'sum-total-inp'; sumInp.id = 'psum';
  sumInp.dataset.answer = sum;
  sumInp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('practice-verify-btn').click(); });
  sumRow.appendChild(sumInp);
  card.appendChild(sumRow);

  // check digit row
  const cdRow = document.createElement('div');
  cdRow.className = 'check-digit-row';
  cdRow.innerHTML = '<span style="color:rgba(234,244,241,0.6);font-size:13px;font-weight:600;">ספרת הביקורת:</span>';
  const cdInp = document.createElement('input');
  cdInp.type = 'tel'; cdInp.inputMode = 'numeric'; cdInp.maxLength = 1;
  cdInp.className = 'check-digit-inp'; cdInp.id = 'pcheck';
  cdInp.dataset.answer = checkDigit;
  cdInp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('practice-verify-btn').click(); });
  cdRow.appendChild(cdInp);
  card.appendChild(cdRow);

  // verify button
  const verifyBtn = document.createElement('button');
  verifyBtn.className = 'verify-btn'; verifyBtn.id = 'practice-verify-btn';
  verifyBtn.textContent = 'בדוק ←';
  verifyBtn.onclick = () => checkPracticeAnswers(steps, sum, checkDigit);
  card.appendChild(verifyBtn);

  section.appendChild(card);
  setTimeout(() => card.classList.add('visible'), 50);
  setTimeout(() => document.getElementById('pinp0').focus(), 200);
}

function checkPracticeAnswers(steps, sum, checkDigit) {
  let allCorrect = true;

  // check each column input
  steps.forEach((s, i) => {
    const inp = document.getElementById('pinp' + i);
    const val = parseInt(inp.value.trim());
    const ok = val === s.reduced;
    inp.classList.remove('correct', 'wrong');
    inp.classList.add(ok ? 'correct' : 'wrong');
    if (!ok) allCorrect = false;
  });

  // check sum
  const sumInp = document.getElementById('psum');
  const sumOk = parseInt(sumInp.value.trim()) === sum;
  sumInp.classList.remove('correct', 'wrong');
  sumInp.classList.add(sumOk ? 'correct' : 'wrong');
  if (!sumOk) allCorrect = false;

  // check check digit
  const cdInp = document.getElementById('pcheck');
  const cdOk = parseInt(cdInp.value.trim()) === checkDigit;
  cdInp.classList.remove('correct', 'wrong');
  cdInp.classList.add(cdOk ? 'correct' : 'wrong');
  if (!cdOk) allCorrect = false;

  if (allCorrect) {
    setTimeout(() => updateCardDisplay(checkDigit), 300);
  }
}

function makeCard(num, title) {
  const card = document.createElement('div');
  card.className = 'step-card';
  const heading = document.createElement('div');
  heading.className = 'step-heading';
  heading.innerHTML = `
    <div class="step-badge">${num}</div>
    <div class="step-title-text">${title}</div>
  `;
  card.appendChild(heading);
  return card;
}

// ─── init ─────────────────────────────────────────────
updateCardDisplay();
