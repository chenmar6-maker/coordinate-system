<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחקים וחידות מתמטיות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Rubik',sans-serif;
    background:radial-gradient(ellipse at 50% -10%,#1C2B3A 0%,#0E1820 50%,#070C12 100%);
    color:#EAF4F1;
    direction:rtl;
    min-height:100vh;
    line-height:1.6;
  }
  .wrap{max-width:680px;margin:0 auto;padding:60px 24px 80px;}

  .hero{text-align:center;margin-bottom:52px;}
  .page-label{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(234,244,241,0.45);margin-bottom:14px;}
  h1{font-size:clamp(26px,5vw,40px);font-weight:800;color:#fff;margin:0 0 10px;letter-spacing:-0.5px;}
  .subtitle{font-size:15px;color:rgba(234,244,241,0.55);margin:0;}

  .games{display:flex;flex-direction:column;gap:16px;}

  .game-card{
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(234,244,241,0.05);
    border:1.5px solid rgba(234,244,241,0.1);
    border-radius:14px;padding:22px 26px;
    cursor:pointer;text-decoration:none;color:inherit;
    transition:transform .15s,background .15s,border-color .15s;
  }
  .game-card:hover{transform:translateY(-3px);background:rgba(234,244,241,0.09);border-color:rgba(234,244,241,0.22);}

  .card-left{display:flex;align-items:center;gap:18px;}
  .card-icon{font-size:32px;min-width:42px;text-align:center;}
  .card-name{font-size:18px;font-weight:700;color:#fff;}
  .card-sub{font-size:13px;color:rgba(234,244,241,0.5);margin-top:3px;}
  .card-arrow{font-size:20px;color:rgba(234,244,241,0.3);transition:color .15s;}
  .game-card:hover .card-arrow{color:rgba(234,244,241,0.7);}

  .back-wrap{text-align:center;margin-top:48px;}
  .back-link{
    font-size:13px;color:rgba(234,244,241,0.35);text-decoration:none;
    transition:color .15s;
  }
  .back-link:hover{color:rgba(234,244,241,0.65);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="page-label"><a href="https://www.chenmargalit.co.il" target="_blank" rel="noopener"><img src="../logo.png" alt="חן מרגלית למידה אקטיבית" style="width:220px;max-width:80%;object-fit:contain;border-radius:10px;"></a></div>
    <h1>משחקים וחידות מתמטיות</h1>
    <p class="subtitle">מאחורי כל משחק מסתתרת מתמטיקה</p>
  </div>

  <div class="games">
    <a class="game-card" href="./nim/">
      <div class="card-left">
        <div class="card-icon">🔥</div>
        <div>
          <div class="card-name">משחק הגפרורים — Nim</div>
          <div class="card-sub">שתי ערמות, מי שלוקח את האחרון מנצח</div>
        </div>
      </div>
      <div class="card-arrow">←</div>
    </a>

    <a class="game-card" href="./race100/">
      <div class="card-left">
        <div class="card-icon">🏁</div>
        <div>
          <div class="card-name">מירוץ ל-50</div>
          <div class="card-sub">הוסיפו 1–10 בכל תור — מי שמגיע ל-50 מנצח</div>
        </div>
      </div>
      <div class="card-arrow">←</div>
    </a>

    <a class="game-card" href="./checkdigit/">
      <div class="card-left">
        <div class="card-icon">🔢</div>
        <div>
          <div class="card-name">ספרת הביקורת</div>
          <div class="card-sub">ספרה אחת שבודקת את כל השאר</div>
        </div>
      </div>
      <div class="card-arrow">←</div>
    </a>
  </div>

  <div class="back-wrap">
    <a class="back-link" href="../">← חזרה לדף הראשי</a>
  </div>
</div>
</body>
</html>
