<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שכיחות ספרות — איסוף נתונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ee; --card: #fff; --ink: #1f2430; --muted: #6b7080; --line: #e4ded2;
    --accent: #2563eb; --accent-soft: #dbe7ff;
    --green: #059669; --green-soft: #d1fae5;
    --shadow: 0 2px 0 rgba(0,0,0,.06), 0 8px 24px rgba(31,36,48,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#15171d; --card:#1f222b; --ink:#f1efe9; --muted:#a2a6b3; --line:#333744;
      --accent:#6c9bff; --accent-soft:#1f2d4d;
      --green:#34d399; --green-soft:#0a2a1f;
      --shadow: 0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:"Rubik",system-ui,sans-serif;
    direction:rtl; line-height:1.6;
  }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 80px; }

  header { text-align:center; margin-bottom:28px; }
  h1 { font-size:clamp(1.8rem,7vw,2.6rem); font-weight:800; margin:0 0 6px; letter-spacing:-.5px; }
  .tagline { color:var(--muted); font-size:1rem; }

  /* ── Digit selector ── */
  .digit-selector {
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;
  }
  .selector-label { font-weight:700; margin-bottom:12px; font-size:1rem; }
  .digit-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .dchip {
    width:48px; height:48px; border-radius:12px; border:2px solid var(--line);
    background:var(--card); color:var(--ink); font:inherit; font-size:1.3rem; font-weight:800;
    cursor:pointer; transition:all .15s; display:grid; place-items:center;
  }
  .dchip:hover { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .dchip.active { border-color:var(--accent); background:var(--accent); color:#fff; }

  /* ── Entry row ── */
  .entry-box {
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;
  }
  .entry-title { font-weight:700; font-size:1rem; margin-bottom:14px; }
  .entry-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .name-input, .count-input {
    font:inherit; font-size:1rem; border:2px solid var(--line); border-radius:10px;
    padding:9px 12px; background:var(--bg); color:var(--ink); outline:none;
    transition:border-color .15s;
  }
  .name-input { width:140px; }
  .count-input { width:90px; font-weight:800; font-size:1.2rem; text-align:center; }
  .name-input:focus, .count-input:focus { border-color:var(--accent); }
  .add-btn {
    font:inherit; font-weight:700; font-size:1rem;
    background:var(--accent); color:#fff; border:0; border-radius:10px;
    padding:10px 20px; cursor:pointer; transition:opacity .15s;
  }
  .add-btn:hover { opacity:.85; }
  .add-btn:disabled { opacity:.4; cursor:default; }

  /* ── Entries list ── */
  .entries-list { display:flex; flex-wrap:wrap; gap:8px; min-height:36px; }
  .entry-tag {
    display:inline-flex; align-items:center; gap:6px;
    background:var(--accent-soft); color:var(--accent);
    border-radius:10px; padding:5px 12px; font-weight:700; font-size:.95rem;
    cursor:default;
  }
  .entry-tag .del {
    font-size:.8rem; cursor:pointer; opacity:.6; border:none; background:none;
    color:inherit; font-family:inherit; padding:0; line-height:1;
  }
  .entry-tag .del:hover { opacity:1; }
  .entries-empty { color:var(--muted); font-size:.9rem; padding:4px 0; }

  /* ── Stats button ── */
  .stats-btn-wrap { text-align:center; margin-bottom:18px; }
  .stats-btn {
    font:inherit; font-weight:800; font-size:1.1rem;
    background:var(--green); color:#fff; border:0; border-radius:14px;
    padding:14px 36px; cursor:pointer; box-shadow:0 4px 14px rgba(5,150,105,.3);
    transition:opacity .15s;
  }
  .stats-btn:hover { opacity:.88; }

  /* ── Stats panel ── */
  .stats-panel {
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); padding:20px; margin-bottom:18px;
  }
  .stats-heading {
    font-size:1rem; font-weight:800; color:var(--green);
    border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:16px;
  }
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
  .stat-cell {
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; text-align:center;
  }
  .stat-cell .s-label { font-size:.78rem; color:var(--muted); font-weight:600; margin-bottom:4px; }
  .stat-cell .s-val { font-size:1.6rem; font-weight:800; }

  /* Bar chart */
  .bar-section-title { font-size:.8rem; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
  .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; direction:ltr; }
  .bar-name { min-width:80px; text-align:right; font-size:.85rem; font-weight:600; direction:rtl; }
  .bar-track { flex:1; background:var(--line); border-radius:4px; height:22px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--accent); border-radius:4px; transition:width .4s; }
  .bar-count { min-width:28px; font-size:.85rem; font-weight:800; text-align:left; }

  /* ── Reset ── */
  .reset-btn {
    font:inherit; font-size:.9rem; font-weight:600;
    background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:10px; padding:8px 18px; cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .reset-btn:hover { color:var(--ink); border-color:var(--ink); }

  .back-wrap { text-align:center; margin-top:24px; }
  .back-link {
    display:inline-block; font-weight:700; font-size:1rem; color:var(--ink);
    background:var(--card); border:2px solid var(--line); border-radius:14px;
    padding:12px 28px; text-decoration:none; box-shadow:var(--shadow);
  }
  .back-link:hover { border-color:var(--ink); }

  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🔢 שכיחות ספרות</h1>
    <p class="tagline">איסוף תשובות מהכיתה וסטטיסטיקה</p>
  </header>

  <!-- ── בחירת ספרה ── -->
  <div class="digit-selector">
    <div class="selector-label">1. בחרו ספרה:</div>
    <div class="digit-chips" id="digitChips"></div>
  </div>

  <!-- ── הוספת ערך ── -->
  <div class="entry-box">
    <div class="entry-title" id="entryTitle">2. הוסיפו תשובה של תלמיד/ה:</div>
    <div class="entry-row">
      <input class="name-input" id="nameInput" type="text" placeholder="שם (אופציונלי)">
      <input class="count-input" id="countInput" type="number" min="0" placeholder="0">
      <button class="add-btn" id="addBtn" onclick="addEntry()">הוסף +</button>
    </div>
    <div class="entries-list" id="entriesList">
      <span class="entries-empty">עוד לא הוספו ערכים</span>
    </div>
  </div>

  <!-- ── כפתור סטטיסטיקה ── -->
  <div class="stats-btn-wrap">
    <button class="stats-btn" onclick="calcStats()">חשב סטטיסטיקה ←</button>
  </div>

  <!-- ── פאנל סטטיסטיקה ── -->
  <div class="stats-panel hidden" id="statsPanel">
    <div class="stats-heading" id="statsHeading"></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="bar-section-title">ערכי התלמידים</div>
    <div id="barsDiv"></div>
    <div style="margin-top:14px;">
      <button class="reset-btn" onclick="resetAll()">איפוס הכל</button>
    </div>
  </div>

  <div class="back-wrap">
    <a class="back-link" href="./index.html">← חזרה למשחקתמטיקה</a>
  </div>

</div>

<script>
  // ── State ──
  let selectedDigit = null;
  // entries[digit] = [{name, count}]
  const entries = {};
  for (let d = 0; d <= 9; d++) entries[d] = [];

  // ── Build digit chips ──
  const chipsEl = document.getElementById('digitChips');
  for (let d = 0; d <= 9; d++) {
    const btn = document.createElement('button');
    btn.className = 'dchip';
    btn.textContent = d;
    btn.onclick = () => selectDigit(d);
    chipsEl.appendChild(btn);
  }

  function selectDigit(d) {
    selectedDigit = d;
    chipsEl.querySelectorAll('.dchip').forEach((b, i) => {
      b.classList.toggle('active', i === d);
    });
    document.getElementById('entryTitle').textContent =
      '2. הוסיפו תשובה של תלמיד/ה (ספרה ' + d + '):';
    document.getElementById('countInput').focus();
    renderList();
    document.getElementById('statsPanel').classList.add('hidden');
  }

  // ── Add entry ──
  function addEntry() {
    if (selectedDigit === null) { alert('בחרו ספרה תחילה'); return; }
    const name = document.getElementById('nameInput').value.trim();
    const val = parseInt(document.getElementById('countInput').value);
    if (isNaN(val) || val < 0) { document.getElementById('countInput').focus(); return; }
    entries[selectedDigit].push({ name: name || ('תלמיד ' + (entries[selectedDigit].length + 1)), count: val });
    document.getElementById('nameInput').value = '';
    document.getElementById('countInput').value = '';
    document.getElementById('nameInput').focus();
    renderList();
    document.getElementById('statsPanel').classList.add('hidden');
  }

  document.getElementById('countInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addEntry();
  });
  document.getElementById('nameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('countInput').focus();
  });

  function removeEntry(d, i) {
    entries[d].splice(i, 1);
    renderList();
    document.getElementById('statsPanel').classList.add('hidden');
  }

  function renderList() {
    const el = document.getElementById('entriesList');
    if (selectedDigit === null || entries[selectedDigit].length === 0) {
      el.innerHTML = '<span class="entries-empty">עוד לא הוספו ערכים</span>';
      return;
    }
    el.innerHTML = entries[selectedDigit].map((e, i) =>
      '<span class="entry-tag">' +
        (e.name ? '<span>' + e.name + ':</span>' : '') +
        '<span>' + e.count + '</span>' +
        '<button class="del" onclick="removeEntry(' + selectedDigit + ',' + i + ')">✕</button>' +
      '</span>'
    ).join('');
  }

  // ── Calc stats ──
  function calcStats() {
    if (selectedDigit === null) { alert('בחרו ספרה תחילה'); return; }
    const data = entries[selectedDigit];
    if (data.length === 0) { alert('הוסיפו לפחות ערך אחד'); return; }

    const vals = data.map(e => e.count);
    const n = vals.length;
    const sorted = vals.slice().sort((a, b) => a - b);
    const sum = vals.reduce((a, b) => a + b, 0);
    const avg = (sum / n).toFixed(1);
    const med = n % 2 === 1
      ? sorted[Math.floor(n / 2)]
      : ((sorted[n / 2 - 1] + sorted[n / 2]) / 2).toFixed(1);
    const mn = sorted[0], mx = sorted[n - 1];
    const range = mx - mn;

    // Mode
    const freq = {};
    vals.forEach(v => freq[v] = (freq[v] || 0) + 1);
    const maxFreq = Math.max(...Object.values(freq));
    const modes = Object.keys(freq).filter(k => freq[k] === maxFreq).map(Number).sort((a,b)=>a-b);

    // Grid
    document.getElementById('statsGrid').innerHTML = [
      ['מספר תשובות', n, ''],
      ['ממוצע', avg, ''],
      ['חציון', med, ''],
      ['מינימום', mn, ''],
      ['מקסימום', mx, ''],
      ['טווח', range, ''],
      ['שכיח (מד)', modes.join(', '), ''],
    ].map(([l, v]) =>
      '<div class="stat-cell"><div class="s-label">' + l + '</div><div class="s-val">' + v + '</div></div>'
    ).join('');

    // Heading
    document.getElementById('statsHeading').textContent =
      'סטטיסטיקה — ספרה ' + selectedDigit + ' (' + n + ' תשובות)';

    // Bars — sort by count descending
    const maxVal = mx || 1;
    const barsDiv = document.getElementById('barsDiv');
    const sortedData = data.slice().sort((a, b) => b.count - a.count);
    barsDiv.innerHTML = sortedData.map(e => {
      const pct = Math.round((e.count / maxVal) * 100);
      return '<div class="bar-row">' +
        '<div class="bar-name">' + e.name + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-count">' + e.count + '</div>' +
      '</div>';
    }).join('');

    document.getElementById('statsPanel').classList.remove('hidden');
    document.getElementById('statsPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetAll() {
    if (!confirm('למחוק את כל הנתונים?')) return;
    for (let d = 0; d <= 9; d++) entries[d] = [];
    renderList();
    document.getElementById('statsPanel').classList.add('hidden');
  }

  // init
  selectDigit(1);
</script>
</body>
</html>
