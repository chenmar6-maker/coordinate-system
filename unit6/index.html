<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבוא לגיאומטריה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');

  :root{
    --navy:#1E1B2E;
    --deep-navy:#0F0D1A;
    --green:#10B981;
    --green-dark:#059669;
    --foam:#EAF4F1;
    --gold:#EFA94A;
    --coral:#E2604F;
    --seafoam:#48B08C;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Rubik',sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #0D3D2E 0%, #1E1B2E 50%, #0F0D1A 100%);
    color:var(--foam);
    direction:rtl;
    min-height:100vh;
    line-height:1.6;
  }

  .wrap{max-width:900px;margin:0 auto;padding:20px 18px 70px;}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;max-width:900px;margin:0 auto;
  }
  .brand{font-size:19px;color:var(--green);}
  .homebtn{
    background:transparent;border:1.5px solid var(--foam);color:var(--foam);
    padding:7px 16px;border-radius:20px;font-family:'Rubik',sans-serif;
    font-size:14px;cursor:pointer;opacity:.85;text-decoration:none;display:inline-block;
  }
  .homebtn:hover{opacity:1;border-color:var(--green);color:var(--green);}

  .hero{text-align:center;padding:18px 10px 10px;}
  h1.title{font-weight:800;font-size:clamp(26px,5.2vw,42px);margin:6px 0 10px;color:#FFFFFF;letter-spacing:-0.5px;}
  p.subtitle{font-size:17px;opacity:.85;margin:0 0 8px;}

  .cards{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  .sequence-section{margin-bottom:28px;background:rgba(234,244,241,0.04);border-radius:14px;padding:18px 20px;}
  .sequence-title{font-weight:700;font-size:17px;color:var(--foam);text-align:center;margin:0 0 14px;opacity:.9;}

  .flow-arrow{display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(16,185,129,0.5);flex-shrink:0;}

  .card{
    display:flex;align-items:center;gap:10px;
    padding:12px 20px;border-radius:50px;cursor:pointer;
    font-family:'Rubik',sans-serif;font-weight:600;font-size:15px;
    transition:transform .15s ease, box-shadow .15s ease;border:none;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.25);}
  .card h3{font-size:15px;font-weight:600;margin:0;}
  .card.learn{background:rgba(16,185,129,0.18);border:1.5px solid var(--green);color:var(--green);}
  .card.game{background:rgba(239,169,74,0.18);border:1.5px solid var(--gold);color:var(--gold);}
  .card.quiz{background:rgba(226,96,79,0.18);border:1.5px solid var(--coral);color:var(--coral);}

  .panel{
    background:rgba(234,244,241,0.06);border:1px solid rgba(234,244,241,0.15);
    border-radius:10px;padding:22px;margin:18px 0;
  }

  .btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .btn{
    background:var(--green);color:#0F1E18;border:none;font-weight:700;
    font-family:'Rubik',sans-serif;font-size:15px;padding:11px 26px;
    border-radius:24px;cursor:pointer;transition:transform .12s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn.secondary{background:transparent;border:1.5px solid var(--foam);color:var(--foam);}
  .btn.secondary:hover{border-color:var(--green);color:var(--green);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  .feedback{text-align:center;font-size:16px;font-weight:700;margin:14px 0;min-height:24px;}
  .feedback.ok{color:var(--seafoam);}
  .feedback.bad{color:var(--coral);}

  .progressdots{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
  .dot{width:11px;height:11px;border-radius:50%;background:rgba(234,244,241,0.25);border:none;padding:0;}
  .dot.done{background:var(--seafoam);}
  .dot.active{background:var(--gold);}

  .mc-options{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:16px auto 0;}
  .mc-btn{
    background:rgba(234,244,241,0.08);border:1.5px solid rgba(234,244,241,0.3);
    color:var(--foam);padding:12px 16px;border-radius:8px;font-size:16px;
    cursor:pointer;font-family:'Rubik',sans-serif;text-align:right;
  }
  .mc-btn:hover{border-color:var(--green);}
  .mc-btn.correct{background:rgba(72,176,140,0.3);border-color:var(--seafoam);}
  .mc-btn.wrong{background:rgba(226,96,79,0.3);border-color:var(--coral);}
  .mc-btn:disabled{cursor:default;}

  .explain-box{
    background:rgba(72,176,140,0.1);border-right:4px solid var(--seafoam);
    border-radius:6px;padding:12px 16px;margin-top:14px;font-size:15px;
  }

  .qmeta{text-align:center;font-size:14px;opacity:.75;margin-bottom:6px;}
  .qtitle{font-size:18px;font-weight:700;text-align:center;margin:6px 0 4px;}
  .qtext{font-size:16px;text-align:center;margin:0 0 6px;max-width:560px;margin-left:auto;margin-right:auto;}
  .scorebig{font-size:52px;color:var(--gold);text-align:center;margin:10px 0;}

  ul.bullets{list-style:none;margin:18px 0 6px;padding:0;text-align:right;}
  ul.bullets li{position:relative;padding-right:22px;margin-bottom:10px;font-size:16px;line-height:1.55;}
  ul.bullets li::before{content:"•";color:var(--green);position:absolute;right:0;top:0;font-size:18px;}

  .learn-note{
    background:rgba(16,185,129,0.1);border-right:4px solid var(--green);
    border-radius:6px;padding:12px 16px;margin-top:16px;font-size:15px;text-align:right;
  }

  .gold-box{
    background:rgba(239,169,74,0.12);border-right:4px solid var(--gold);
    border-radius:6px;padding:14px 18px;margin:14px 0;
    font-size:17px;font-weight:700;color:var(--gold);text-align:right;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const state = { screen:'home', sequence:1, qi:0, score:0, answered:false };
const openSections = new Set();

function goTo(s){ state.screen=s; render(); window.scrollTo(0,0); }
function goHome(){ state.screen='home'; render(); window.scrollTo(0,0); }
function toggleSection(n){ openSections.has(n)?openSections.delete(n):openSections.add(n); render(); }
function startGame(){ state.qi=0; state.score=0; state.answered=false; goTo('game'); }
function startQuiz(){ goTo('quiz'); }
let nextUnitUrl = '';
function showNoQuiz(url){ nextUnitUrl=url; goTo('noQuiz'); }

/* ============ LEVELS ============ */

const gameLevels1 = [
  {
    q:'מה פירוש המילה "גיאומטריה" ביוונית?',
    opts:['מדידת אדמה','ספירת כוכבים','חישוב זמן','מדידת מים'],
    ans:0,
    exp:'geo = אדמה, metria = מדידה. גיאומטריה = מדידת אדמה.'
  },
  {
    q:'מדוע פיתחו המצרים הקדמונים את הגיאומטריה?',
    opts:['כדי לבנות ספינות','כדי לחשב שטחי קרקע לגביית מסים','כדי לנווט בים','כדי לחשב את גיל הפירמידות'],
    ans:1,
    exp:'שטפונות הנילוס מחקו את גבולות השדות מדי שנה — והיה צורך למדוד מחדש כדי לדעת כמה מס לגבות.'
  },
  {
    q:'מה גרם לצורך לחשב מחדש את גבולות השדות בכל שנה?',
    opts:['מלחמות בין שבטים','שטפונות הנילוס','רעידות אדמה','בניית פירמידות'],
    ans:1,
    exp:'הנילוס הציף את השדות מדי שנה ומחק את הגבולות — ומכאן נולד הצורך לחשב שטחים ואורכים.'
  },
  {
    q:'גיאומטריה עוסקת בעיקר ב...',
    opts:['חישובי ריבית','צורות, מידות ומרחבים','סטטיסטיקה והסתברות','משוואות עם נעלמים'],
    ans:1,
    exp:'גיאומטריה היא ענף המתמטיקה העוסק בצורות, מידות, זוויות ומרחבים.'
  },
];

function currentLevels(){
  if(state.sequence===1) return gameLevels1;
  return gameLevels1;
}

/* ============ RENDER ============ */

function render(){
  const app = document.getElementById('app');
  if(state.screen==='home')        app.innerHTML = renderTopbar() + '<div class="wrap">' + renderHome() + '</div>';
  else if(state.screen==='learn')  app.innerHTML = renderTopbar() + '<div class="wrap">' + renderLearn() + '</div>';
  else if(state.screen==='game')   app.innerHTML = renderTopbar() + '<div class="wrap">' + renderGame() + '</div>';
  else if(state.screen==='gameResults') app.innerHTML = renderTopbar() + '<div class="wrap">' + renderGameResults() + '</div>';
  else if(state.screen==='noQuiz') app.innerHTML = renderTopbar() + '<div class="wrap">' + renderNoQuiz() + '</div>';
}

function renderTopbar(){
  return `<div class="topbar">
    <div class="brand">חן מרגלית למידה אקטיבית</div>
    <a class="homebtn" href="../index.html">תפריט ראשי</a>
  </div>`;
}

/* ============ seqRow ============ */

function seqRow(seqNum, label, opts={}){
  const isOpen = openSections.has(seqNum);
  const chevron = isOpen ? '▾' : '◂';
  let cards = '';
  if(isOpen){
    const nextCard = opts.nextUrl
      ? `<div class="flow-arrow">←</div><div class="card quiz" onclick="showNoQuiz('${opts.nextUrl}')"><h3>מבדק שליטה</h3></div>`
      : opts.worksheetUrl
        ? `<div class="flow-arrow">←</div><div class="card quiz" onclick="showWorksheet('${opts.worksheetUrl}')"><h3>מבדק שליטה</h3></div>`
        : `<div class="flow-arrow">←</div><div class="card quiz" onclick="state.sequence=${seqNum};startQuiz()"><h3>מבדק שליטה</h3></div>`;
    cards = `<div class="cards" style="margin-bottom:6px;">
      <div class="card learn" onclick="state.sequence=${seqNum};goTo('learn')"><h3>הקנייה</h3></div>
      <div class="flow-arrow">←</div>
      <div class="card game" onclick="state.sequence=${seqNum};startGame()"><h3>תרגול</h3></div>
      ${nextCard}
    </div>`;
  }
  return `
    <div onclick="toggleSection(${seqNum})" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid rgba(234,244,241,0.08);user-select:none;">
      <span class="sequence-title" style="margin:0;">${label}</span>
      <span style="font-size:20px;color:rgba(234,244,241,0.4);">${chevron}</span>
    </div>
    ${cards}`;
}

/* ============ HOME ============ */

function renderHome(){
  return `
    <div class="hero">
      <h1 class="title">גיאומטריה</h1>
      <p class="subtitle">יחידה 1 — תחום גיאומטרי</p>
    </div>
    <div class="sequence-section">
      ${seqRow(1, '1. מבוא — מה זו גיאומטריה?', {nextUrl:'../unit7/'})}
    </div>
  `;
}

/* ============ LEARN ============ */

function renderLearn(){
  return renderLearn1();
}

function renderLearn1(){
  return `
    <div class="panel">
      <h2 class="qtitle">מה זו גיאומטריה?</h2>

      <div style="max-width:300px;margin:20px auto;">
        <div style="position:relative;padding-bottom:177.8%;height:0;border-radius:14px;overflow:hidden;">
          <iframe
            style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
            src="https://www.youtube.com/embed/n9MoxWD7yvk"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <div class="gold-box">
        geo = אדמה &nbsp;·&nbsp; metria = מדידה &nbsp;→&nbsp; גיאומטריה = <strong>מדידת אדמה</strong>
      </div>

      <div style="background:rgba(16,185,129,0.08);border:1.5px solid rgba(16,185,129,0.25);border-radius:12px;padding:18px 20px;margin:18px 0;">
        <div style="font-size:15px;font-weight:700;color:var(--green);margin-bottom:10px;">📜 גיאומטריה ומיסים במצרים העתיקה</div>
        <p style="font-size:15px;line-height:1.7;margin:0;">
          בכל שנה, שטפונות הנילוס הציפו את שדות החקלאים ומחקו את גבולות הקרקע.
          הפקידים המצרים נאלצו למדוד מחדש את שטח כל שדה כדי לדעת <strong>כמה מס לגבות</strong> מכל חקלאי.
          הצורך החוזר הזה הוליד שיטות מדידה, חישובי שטח ואורכים —
          וכך נולדה הגיאומטריה כתחום מתמטי.
          המילה עצמה מגיעה מיוונית: <strong>geo</strong> (אדמה) ו-<strong>metria</strong> (מדידה).
        </p>
      </div>

      <ul class="bullets">
        <li>גיאומטריה עוסקת בצורות, מידות, זוויות ומרחבים</li>
        <li>היא אחד הענפים הקדומים ביותר של המתמטיקה</li>
        <li>היא שימושית בבנייה, הנדסה, אמנות וניווט</li>
      </ul>

      <div class="learn-note">
        המצרים הקדמונים לא קראו לזה "גיאומטריה" — זה השם שנתנו לה היוונים מאוחר יותר, כשפיתחו אותה לכדי תחום מדעי שלם.
      </div>

      <div style="margin-top:22px;border-top:1px solid rgba(234,244,241,0.1);padding-top:18px;">
        <div style="font-size:13px;font-weight:700;color:rgba(234,244,241,0.5);text-align:center;margin-bottom:12px;">🔎 למי שרוצה לדעת עוד על הנילומטר</div>
        <div style="max-width:300px;margin:0 auto;">
          <div style="position:relative;padding-bottom:177.8%;height:0;border-radius:14px;overflow:hidden;">
            <iframe
              style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
              src="https://www.youtube.com/embed/DVOEbfagkBg"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        </div>
      </div>

      <div class="btnrow">
        <button class="btn" onclick="state.sequence=1;startGame()">לתרגול ←</button>
        <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
      </div>
    </div>
  `;
}

/* ============ GAME ============ */

function renderNoQuiz(){
  return `<div class="panel" style="text-align:center;padding:36px 24px;">
    <div style="font-size:48px;margin-bottom:16px;">🎉</div>
    <h2 class="qtitle">אין מבדק שליטה לרצף זה!</h2>
    <p style="font-size:16px;opacity:.75;margin:12px 0 28px;">סיימת את הרצף — אפשר להתקדם ליחידה הבאה</p>
    <div class="btnrow">
      <button class="btn" onclick="window.location.href='${nextUnitUrl}'">ליחידה הבאה ←</button>
      <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
    </div>
  </div>`;
}

function renderGame(){
  const levels = currentLevels();
  if(state.qi >= levels.length){ state.screen='gameResults'; render(); return ''; }
  const q = levels[state.qi];
  const dots = levels.map((_,i)=>`<div class="dot${i<state.qi?' done':i===state.qi?' active':''}"></div>`).join('');
  const opts = q.opts.map((o,i)=>`<button class="mc-btn" id="opt${i}" onclick="answerQ(${i})">${o}</button>`).join('');
  const explainHtml = state.answered
    ? `<div class="explain-box">${q.exp}</div>
       <div class="btnrow" style="margin-top:12px;">
         <button class="btn" onclick="nextQ()">הבא ←</button>
       </div>`
    : '';
  return `
    <div class="panel">
      <div class="progressdots">${dots}</div>
      <div class="qmeta">שאלה ${state.qi+1} מתוך ${levels.length}</div>
      <div class="qtitle">${q.q}</div>
      <div class="mc-options">${opts}</div>
      <div class="feedback" id="fb"></div>
      ${explainHtml}
    </div>`;
}

function answerQ(i){
  if(state.answered) return;
  state.answered = true;
  const levels = currentLevels();
  const q = levels[state.qi];
  const correct = i === q.ans;
  if(correct) state.score++;
  document.querySelectorAll('.mc-btn').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.ans) b.classList.add('correct');
    else if(j===i) b.classList.add('wrong');
  });
  document.getElementById('fb').textContent = correct ? '✓ נכון!' : '✗ לא נכון';
  document.getElementById('fb').className = 'feedback ' + (correct?'ok':'bad');
  render();
}

function nextQ(){
  state.qi++;
  state.answered = false;
  render();
  window.scrollTo(0,0);
}

/* ============ RESULTS ============ */

function renderGameResults(){
  const total = currentLevels().length;
  const pct = Math.round(state.score/total*100);
  return `
    <div class="panel" style="text-align:center;">
      <div class="qtitle">סיימת את התרגול!</div>
      <div class="scorebig">${state.score}/${total}</div>
      <div style="font-size:16px;opacity:.8;margin-bottom:20px;">${pct}% תשובות נכונות</div>
      <div class="btnrow">
        <button class="btn" onclick="startGame()">שוב ←</button>
        <button class="btn secondary" onclick="goHome()">חזרה לתפריט</button>
      </div>
    </div>`;
}

render();
</script>
<footer style="text-align:center;padding:24px 0 14px;font-size:11px;color:#9CA3AF;font-family:Rubik,sans-serif;">© כל הזכויות שמורות לחן מרגלית</footer>
</body>
</html>
